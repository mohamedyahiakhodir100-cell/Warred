<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الطاولة - وريد</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050508;
            --player1-color: #00C6FF; /* أزرق */
            --player2-color: #ff3366; /* أحمر */
            --board-bg: #0a0a14;
            --triangle-dark: #111;
            --triangle-light: #1a1a2e;
            --text-color: #eee;
            --gold: #FFD700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Cairo", sans-serif; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
        body { background: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- الهيدر --- */
        .game-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; background: rgba(5, 5, 8, 0.95);
            border-bottom: 1px solid rgba(0, 198, 255, 0.1); z-index: 10;
        }
        .back-btn { font-size: 20px; color: var(--text-color); cursor: pointer; transition: 0.2s; }
        .back-btn:active { transform: scale(0.9); }
        .header-title { font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 0 10px var(--gold); }
        .wallet { color: var(--gold); font-weight: bold; font-size: 14px; background: rgba(255,215,0,0.1); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--gold); }

        /* --- شريط اللعب --- */
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; background: #0a0a0f; border-bottom: 1px solid #222; z-index: 10;
        }
        .turn-indicator { font-size: 16px; font-weight: bold; padding: 5px 15px; border-radius: 20px; transition: 0.3s; }
        .turn-p1 { background: rgba(0, 198, 255, 0.1); color: var(--player1-color); box-shadow: 0 0 10px rgba(0, 198, 255, 0.3); }
        .turn-p2 { background: rgba(255, 51, 102, 0.1); color: var(--player2-color); box-shadow: 0 0 10px rgba(255, 51, 102, 0.3); }

        .dice-container { display: flex; gap: 10px; }
        .die {
            width: 40px; height: 40px; background: #fff; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: 900; color: #000; box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
        .die.used { opacity: 0.3; box-shadow: none; }

        /* --- منطقة اللعب --- */
        .game-area {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #111, #000); padding: 10px; position: relative;
        }

        .board-container {
            position: relative; width: 100%; max-width: 500px; aspect-ratio: 3/4;
            background: var(--board-bg); border: 4px solid #333; border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1), inset 0 0 20px rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
        }
        
        canvas { display: block; width: 100%; height: 100%; border-radius: 10px; }

        .controls {
            width: 100%; max-width: 500px; display: flex; justify-content: center; margin-top: 15px;
        }
        .roll-btn {
            background: linear-gradient(45deg, var(--gold), #ff8c00);
            color: #000; border: none; padding: 12px 40px; border-radius: 12px;
            font-size: 18px; font-weight: 900; cursor: pointer; width: 100%;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3); transition: 0.2s;
        }
        .roll-btn:active { transform: scale(0.95); }
        .roll-btn:disabled { background: #333; color: #666; box-shadow: none; }

        /* --- المودال --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 2000;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-card {
            background: #111; border: 1px solid #333; border-radius: 20px;
            padding: 30px 20px; width: 90%; max-width: 350px; text-align: center;
            transform: translateY(20px); transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-title { font-size: 28px; font-weight: 900; margin-bottom: 5px; }
        .modal-reward { font-size: 18px; font-weight: bold; margin-bottom: 25px; color: var(--gold); }
        
        .btn-restart {
            background: linear-gradient(45deg, var(--gold), #ff8c00);
            color: #000; border: none; padding: 12px 30px; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer; width: 100%;
        }
    </style>
</head>
<body>

    <div class="game-header">
        <i class="fa-solid fa-arrow-right back-btn" onclick="history.back()"></i>
        <div class="header-title">لعبة الطاولة 🎲</div>
        <div class="wallet"><i class="fa-solid fa-coins"></i> <span id="walletScore">1500</span></div>
    </div>

    <div class="status-bar">
        <div class="turn-indicator turn-p1" id="turnDisplay">دور الأزرق</div>
        <div class="dice-container" id="diceContainer">
            <div class="die" id="die1">-</div>
            <div class="die" id="die2">-</div>
        </div>
    </div>

    <div class="game-area">
        <div class="board-container">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div class="controls">
            <button class="roll-btn" id="rollBtn" onclick="rollDice()">إرمي النرد</button>
        </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div id="modalIcon" style="font-size: 60px; margin-bottom: 10px;">🏆</div>
            <div class="modal-title" id="modalTitle">انتهت اللعبة!</div>
            <div class="modal-reward" id="modalReward">+150 عملة</div>
            <button class="btn-restart" onclick="initGame()">لعب دور جديد</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const rollBtn = document.getElementById('rollBtn');
        const turnDisplay = document.getElementById('turnDisplay');
        const die1El = document.getElementById('die1');
        const die2El = document.getElementById('die2');
        const walletElement = document.getElementById('walletScore');

        function resizeCanvas() {
            // جعل الكانفاس بنفس أبعاد الحاوية
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', () => { resizeCanvas(); draw(); });
        
        // المتغيرات
        let board = [];
        let bar = { 1: 0, 2: 0 }; // المضروبين
        let off = { 1: 0, 2: 0 }; // اللي خرجوا
        let currentPlayer = 1; // 1 (Blue), 2 (Red)
        let dice = [];
        let selectedPoint = null;
        let isGameOver = false;

        function initGame() {
            document.getElementById('resultModal').classList.remove('active');
            resizeCanvas();
            
            // تهيئة اللوحة (24 مثلث)
            // 1: الأزرق، 2: الأحمر، 0: فارغ
            // ترتيب الطاولة القياسي
            board = new Array(24).fill(null).map(() => ({ player: 0, count: 0 }));
            
            board[0] = { player: 1, count: 2 };
            board[5] = { player: 2, count: 5 };
            board[7] = { player: 2, count: 3 };
            board[11] = { player: 1, count: 5 };
            board[12] = { player: 2, count: 5 };
            board[16] = { player: 1, count: 3 };
            board[18] = { player: 1, count: 5 };
            board[23] = { player: 2, count: 2 };

            bar = { 1: 0, 2: 0 };
            off = { 1: 0, 2: 0 };
            currentPlayer = 1;
            dice = [];
            selectedPoint = null;
            isGameOver = false;

            updateUI();
            draw();
        }

        function updateUI() {
            if (currentPlayer === 1) {
                turnDisplay.innerText = "دور الأزرق";
                turnDisplay.className = "turn-indicator turn-p1";
            } else {
                turnDisplay.innerText = "دور الأحمر";
                turnDisplay.className = "turn-indicator turn-p2";
            }

            if (dice.length === 0) {
                die1El.innerText = "-"; die2El.innerText = "-";
                die1El.classList.remove('used'); die2El.classList.remove('used');
                rollBtn.disabled = false;
            } else {
                die1El.innerText = dice[0] || "-";
                die2El.innerText = dice[1] || "-";
                if(dice.length < 2) die2El.classList.add('used');
                rollBtn.disabled = true;
                
                // لو مفيش لعب (تبسيط: بنسمح يغير الدور يدوي لو اتزنق)
                if(dice.length > 0) rollBtn.disabled = true;
            }
        }

        function rollDice() {
            if (isGameOver) return;
            let d1 = Math.floor(Math.random() * 6) + 1;
            let d2 = Math.floor(Math.random() * 6) + 1;
            
            dice = [d1, d2];
            if (d1 === d2) {
                dice = [d1, d1, d1, d1]; // الدش (4 حركات)
            }
            
            updateUI();
            draw();
        }

        // --- دوال الرسم ---
        function drawGlow(color, blur) {
            ctx.shadowBlur = blur;
            ctx.shadowColor = color;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const w = canvas.width;
            const h = canvas.height;
            const pointWidth = w / 13; // 12 مثلث + البار في النص
            const pointHeight = h * 0.4;

            // رسم الخلفية والمفصل (البار)
            ctx.fillStyle = '#111';
            ctx.fillRect(w/2 - pointWidth/2, 0, pointWidth, h);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.strokeRect(w/2 - pointWidth/2, 0, pointWidth, h);

            // رسم المثلثات والقطع
            for (let i = 0; i < 24; i++) {
                let isTop = i >= 12;
                let isLeft = isTop ? (i >= 18) : (i < 6);
                
                // حساب مكان المثلث (تخطي منطقة البار في المنتصف)
                let xIndex = isTop ? (23 - i) : i;
                if (xIndex >= 6) xIndex++; // تخطي البار

                let x = xIndex * pointWidth;
                let y = isTop ? 0 : h;

                // رسم المثلث
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + pointWidth, y);
                ctx.lineTo(x + pointWidth / 2, isTop ? pointHeight : h - pointHeight);
                ctx.closePath();
                
                // ألوان متبادلة
                ctx.fillStyle = (i % 2 === 0) ? 'var(--triangle-dark)' : 'var(--triangle-light)';
                ctx.fill();

                // تظليل لو محدد
                if (selectedPoint === i) {
                    ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
                    ctx.fill();
                }

                // رسم القطع
                let pt = board[i];
                if (pt.count > 0) {
                    let color = pt.player === 1 ? 'var(--player1-color)' : 'var(--player2-color)';
                    let dir = isTop ? 1 : -1;
                    
                    for (let c = 0; c < pt.count; c++) {
                        let cy = isTop ? (15 + c * 25) : (h - 15 - c * 25);
                        
                        // لو عدد القطع كبير، نرسمهم فوق بعض
                        if (c >= 5) {
                            ctx.fillStyle = '#fff';
                            ctx.font = "bold 14px Cairo";
                            ctx.textAlign = "center";
                            ctx.fillText(`+${pt.count - 5}`, x + pointWidth/2, isTop ? (15 + 4 * 25) + 5 : (h - 15 - 4 * 25) + 5);
                            break;
                        }

                        ctx.beginPath();
                        ctx.arc(x + pointWidth / 2, cy, 10, 0, Math.PI * 2);
                        ctx.fillStyle = color;
                        drawGlow(color, 10);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }
        }

        // --- التحكم الحر المبسط (انقل أي مكان بناءً على الرقم) ---
        // نظراً لتعقيد قواعد الطاولة الكبيرة، برمجنا "تحكم حر" بيسمح للاعبين بتحريك القطع بناءً على النرد،
        // وهم اللي بيحكموا القواعد بينهم (عشان تناسب الـ Pass & Play بسلاسة).
        
        canvas.addEventListener('mousedown', (e) => {
            if (dice.length === 0 || isGameOver) return;
            let rect = canvas.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            
            let clickedPoint = getPointFromCoords(x, y);

            if (selectedPoint === null) {
                // اختيار القطعة
                if (clickedPoint !== null && board[clickedPoint].count > 0 && board[clickedPoint].player === currentPlayer) {
                    selectedPoint = clickedPoint;
                    draw();
                }
            } else {
                // نقل القطعة
                if (clickedPoint !== null && selectedPoint !== clickedPoint) {
                    // تنفيذ النقلة
                    board[selectedPoint].count--;
                    if (board[selectedPoint].count === 0) board[selectedPoint].player = 0;

                    // لو في قطعة خصم واحدة (ضرب)
                    if (board[clickedPoint].player !== currentPlayer && board[clickedPoint].player !== 0) {
                        bar[board[clickedPoint].player]++;
                        board[clickedPoint].count = 1;
                        board[clickedPoint].player = currentPlayer;
                    } else {
                        board[clickedPoint].player = currentPlayer;
                        board[clickedPoint].count++;
                    }

                    // استهلاك نرد (مبسط)
                    dice.pop();
                    selectedPoint = null;

                    if (dice.length === 0) {
                        currentPlayer = currentPlayer === 1 ? 2 : 1;
                    }

                    updateUI();
                    draw();
                    checkWin();
                } else {
                    // إلغاء التحديد
                    selectedPoint = null;
                    draw();
                }
            }
        });

        function getPointFromCoords(x, y) {
            const w = canvas.width;
            const h = canvas.height;
            const pointWidth = w / 13;
            
            let isTop = y < h / 2;
            let col = Math.floor(x / pointWidth);
            
            if (col === 6) return null; // البار
            if (col > 6) col--; 

            let point = isTop ? (23 - col) : col;
            return point;
        }

        function checkWin() {
            // فحص مبسط للفوز (لو كل القطع في ربع واحد، دي مرحلة متقدمة. هنا سنسمح باللعب اللانهائي الممتع أو ضغطة زرار للفوز)
            // لإضافة نهاية: يمكن إضافة زر "إنهاء" يحسب النقاط ويعطي الجوائز.
        }

        initGame();
    </script>
</body>
</html>
