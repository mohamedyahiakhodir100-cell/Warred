<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الهروب من السجن - وريد</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0d0d0f;
            --card-color: #161616;
            --primary-color: #00C6FF;  
            --danger-color: #ff3366;
            --success-color: #00e676;
            --wall-color: #1a2a3a;
            --text-color: #eee;
            --gold: #FFD700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Cairo", sans-serif; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
        body { background: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: none; }

        /* --- الهيدر --- */
        .game-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; background: rgba(13, 13, 15, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 10;
        }
        .back-btn { font-size: 20px; color: var(--text-color); cursor: pointer; transition: 0.2s; }
        .back-btn:active { transform: scale(0.9); }
        .header-title { font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 0 10px rgba(0, 198, 255, 0.5); }
        .wallet { color: var(--gold); font-weight: bold; font-size: 14px; background: rgba(255,215,0,0.1); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--gold); }

        /* --- معلومات اللعبة --- */
        .game-info {
            display: flex; justify-content: space-between; padding: 15px 30px; background: #111;
            border-bottom: 1px solid #333; z-index: 10;
        }
        .info-text { font-size: 16px; font-weight: bold; color: var(--primary-color); }
        .key-status { font-size: 16px; font-weight: bold; color: #555; transition: 0.3s; }
        .key-status.active { color: var(--gold); text-shadow: 0 0 10px var(--gold); }

        /* --- منطقة اللعب --- */
        .game-area {
            flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px;
            background: radial-gradient(circle at center, #111, #000);
        }
        
        .grid {
            display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
            gap: 2px; background: #222; padding: 5px; border-radius: 10px;
            width: 100%; max-width: 350px; aspect-ratio: 1/1; box-shadow: 0 0 20px rgba(0, 198, 255, 0.1);
        }
        
        .cell {
            background: #161616; border-radius: 5px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; position: relative; transition: background 0.2s;
        }
        
        .wall { background: var(--wall-color); box-shadow: inset 0 0 10px rgba(0, 198, 255, 0.2); border: 1px solid #005577; }
        .floor { background: #1a1a1a; }
        .door { background: #2a1a1a; border: 1px solid #ff3366; }
        .door.open { background: #1a3a2a; border-color: #00e676; }

        /* العناصر */
        .entity { position: absolute; font-size: 26px; z-index: 5; animation: pop 0.2s ease; }
        .player { filter: drop-shadow(0 0 5px var(--primary-color)); }
        .guard { filter: drop-shadow(0 0 5px var(--danger-color)); }
        .key { filter: drop-shadow(0 0 5px var(--gold)); font-size: 22px; }

        @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }

        /* --- أزرار التحكم --- */
        .controls {
            padding: 20px; display: grid; grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px); gap: 10px; justify-content: center;
            background: #111; border-top: 1px solid #333;
        }
        .control-btn {
            background: #1a1a1a; border: 2px solid #333; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: var(--primary-color); cursor: pointer; transition: 0.1s;
        }
        .control-btn:active { background: var(--primary-color); color: #000; transform: scale(0.9); }
        
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        /* --- المودال --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 2000;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-card {
            background: #161616; border: 1px solid #333; border-radius: 20px;
            padding: 30px 20px; width: 90%; max-width: 350px; text-align: center;
            transform: translateY(20px); transition: 0.3s;
        }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-icon { font-size: 60px; margin-bottom: 10px; }
        .modal-title { font-size: 28px; font-weight: 900; margin-bottom: 5px; }
        .modal-reward { font-size: 18px; font-weight: bold; margin-bottom: 25px; color: var(--gold); }
        
        .btn {
            background: linear-gradient(45deg, var(--primary-color), #0072FF);
            color: #fff; border: none; padding: 12px 30px; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer; width: 100%;
            box-shadow: 0 5px 15px rgba(0, 198, 255, 0.4); transition: 0.2s;
        }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="game-header">
        <i class="fa-solid fa-arrow-right back-btn" onclick="history.back()"></i>
        <div class="header-title">الهروب من السجن 🥷</div>
        <div class="wallet"><i class="fa-solid fa-coins"></i> <span id="walletScore">1500</span></div>
    </div>

    <div class="game-info">
        <div class="info-text" id="levelDisplay">المستوى: 1</div>
        <div class="key-status" id="keyStatus"><i class="fa-solid fa-key"></i> المفتاح</div>
    </div>

    <div class="game-area" id="gameArea">
        <div class="grid" id="grid">
            </div>
    </div>

    <div class="controls">
        <div class="control-btn" id="btn-up" onclick="handleMove(0, -1)"><i class="fa-solid fa-chevron-up"></i></div>
        <div class="control-btn" id="btn-left" onclick="handleMove(-1, 0)"><i class="fa-solid fa-chevron-left"></i></div>
        <div class="control-btn" id="btn-down" onclick="handleMove(0, 1)"><i class="fa-solid fa-chevron-down"></i></div>
        <div class="control-btn" id="btn-right" onclick="handleMove(1, 0)"><i class="fa-solid fa-chevron-right"></i></div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div class="modal-icon" id="modalIcon">🏆</div>
            <div class="modal-title" id="modalTitle">عمل رائع!</div>
            <p style="color: #aaa; margin-bottom: 10px;" id="modalDesc">تم الهروب بنجاح</p>
            <div class="modal-reward" id="modalReward">+50 عملة</div>
            <button class="btn" id="modalBtn" onclick="nextLevel()">المستوى التالي</button>
        </div>
    </div>

    <script>
        // خريطة المستويات (W: حائط، Space: ممر، P: لاعب، K: مفتاح، D: باب)
        const levels = [
            {
                map: [
                    "WWWWWWWW",
                    "WP     W",
                    "W WWWW W",
                    "W WK W W",
                    "W WW W W",
                    "W      W",
                    "WWWWWW D",
                    "WWWWWWWW"
                ],
                guards: [
                    {x: 5, y: 1, dx: -1, dy: 0, min: 2, max: 6, axis: 'x'}, // يتحرك أفقياً
                    {x: 1, y: 5, dx: 1, dy: 0, min: 1, max: 6, axis: 'x'}
                ]
            },
            {
                map: [
                    "WWWWWWWW",
                    "WP W K W",
                    "W  W W W",
                    "WW   W W",
                    "W  WWW W",
                    "W      W",
                    "W WWWW D",
                    "WWWWWWWW"
                ],
                guards: [
                    {x: 2, y: 2, dx: 0, dy: 1, min: 2, max: 5, axis: 'y'}, // يتحرك رأسياً
                    {x: 4, y: 5, dx: -1, dy: 0, min: 1, max: 5, axis: 'x'}
                ]
            },
            {
                map: [
                    "WWWWWWWW",
                    "WP   W W",
                    "W WW W W",
                    "W W    W",
                    "W W WWKW",
                    "W      W",
                    "W WWWW W",
                    "WWWWWW D"
                ],
                guards: [
                    {x: 3, y: 1, dx: 0, dy: 1, min: 1, max: 5, axis: 'y'},
                    {x: 5, y: 3, dx: 0, dy: 1, min: 1, max: 5, axis: 'y'},
                    {x: 1, y: 5, dx: 1, dy: 0, min: 1, max: 6, axis: 'x'}
                ]
            }
        ];

        let currentLevelIndex = 0;
        let mapData = [];
        let player = {x: 0, y: 0};
        let guards = [];
        let door = {x: 0, y: 0};
        let hasKey = false;
        let isGameOver = false;

        const grid = document.getElementById('grid');
        const keyStatus = document.getElementById('keyStatus');
        const levelDisplay = document.getElementById('levelDisplay');
        const walletElement = document.getElementById('walletScore');

        function loadLevel(index) {
            if (index >= levels.length) {
                index = 0; // إعادة اللعبة من البداية لو خلص
            }
            currentLevelIndex = index;
            const levelObj = levels[index];
            
            levelDisplay.innerText = `المستوى: ${index + 1}`;
            hasKey = false;
            isGameOver = false;
            keyStatus.classList.remove('active');
            
            // استنساخ الخريطة والحراس عشان منغيرش في الأصل
            mapData = levelObj.map.map(row => row.split(''));
            guards = JSON.parse(JSON.stringify(levelObj.guards));

            // تحديد مكان اللاعب والباب
            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 8; x++) {
                    if (mapData[y][x] === 'P') { player = {x, y}; mapData[y][x] = ' '; }
                    if (mapData[y][x] === 'D') { door = {x, y}; }
                }
            }

            renderGrid();
        }

        function renderGrid() {
            grid.innerHTML = '';
            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 8; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell floor';
                    
                    if (mapData[y][x] === 'W') cell.className = 'cell wall';
                    if (mapData[y][x] === 'D') {
                        cell.className = `cell door ${hasKey ? 'open' : ''}`;
                        cell.innerText = hasKey ? '🕳️' : '🚪';
                    }
                    if (mapData[y][x] === 'K') {
                        const keyEl = document.createElement('div');
                        keyEl.className = 'entity key';
                        keyEl.innerText = '🗝️';
                        cell.appendChild(keyEl);
                    }
                    
                    // رسم الحراس
                    let isGuardHere = guards.find(g => g.x === x && g.y === y);
                    if (isGuardHere) {
                        const guardEl = document.createElement('div');
                        guardEl.className = 'entity guard';
                        guardEl.innerText = '👮';
                        cell.appendChild(guardEl);
                    }

                    // رسم اللاعب
                    if (player.x === x && player.y === y) {
                        const playerEl = document.createElement('div');
                        playerEl.className = 'entity player';
                        playerEl.innerText = '🥷';
                        cell.appendChild(playerEl);
                    }

                    grid.appendChild(cell);
                }
            }
        }

        function handleMove(dx, dy) {
            if (isGameOver) return;

            let nx = player.x + dx;
            let ny = player.y + dy;

            // التحقق من الحوائط
            if (mapData[ny][nx] === 'W') return;
            
            // التحقق من الباب
            if (mapData[ny][nx] === 'D' && !hasKey) return; // الباب مقفول

            // تحديث مكان اللاعب
            player.x = nx;
            player.y = ny;

            // أخذ المفتاح
            if (mapData[ny][nx] === 'K') {
                hasKey = true;
                mapData[ny][nx] = ' ';
                keyStatus.classList.add('active');
            }

            // حركة الحراس
            moveGuards();

            // التحقق من الاصطدام بالحراس أو الوصول للباب
            renderGrid();
            checkGameState();
        }

        function moveGuards() {
            guards.forEach(g => {
                let n_gx = g.x + g.dx;
                let n_gy = g.y + g.dy;

                // لو هيخبط في حيطة أو وصل لآخر مساره، يعكس اتجاهه
                if (mapData[n_gy][n_gx] === 'W' || 
                   (g.axis === 'x' && (n_gx < g.min || n_gx > g.max)) ||
                   (g.axis === 'y' && (n_gy < g.min || n_gy > g.max))) {
                    
                    g.dx *= -1;
                    g.dy *= -1;
                    n_gx = g.x + g.dx;
                    n_gy = g.y + g.dy;
                }
                
                g.x = n_gx;
                g.y = n_gy;
            });
        }

        function checkGameState() {
            // هل تم القبض عليه؟
            let caught = guards.some(g => g.x === player.x && g.y === player.y);
            if (caught) {
                endGame(false);
                return;
            }

            // هل وصل للباب؟
            if (player.x === door.x && player.y === door.y && hasKey) {
                endGame(true);
            }
        }

        function endGame(isWin) {
            isGameOver = true;
            const modal = document.getElementById('resultModal');
            const icon = document.getElementById('modalIcon');
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDesc');
            const reward = document.getElementById('modalReward');
            const btn = document.getElementById('modalBtn');

            if (isWin) {
                icon.innerText = "🏆";
                title.innerText = "عمل رائع!";
                title.style.color = "var(--primary-color)";
                desc.innerText = "لقد هربت بنجاح من السجن";
                reward.innerText = "+50 عملة ذهبية";
                reward.style.display = "block";
                btn.innerText = "المستوى التالي";
                btn.onclick = () => { document.getElementById('resultModal').classList.remove('active'); loadLevel(currentLevelIndex + 1); };
                
                // تحديث المحفظة
                let currentWallet = parseInt(walletElement.innerText);
                walletElement.innerText = currentWallet + 50;
            } else {
                icon.innerText = "🚨";
                title.innerText = "تم القبض عليك!";
                title.style.color = "var(--danger-color)";
                desc.innerText = "انتبه لمسار الحراس في المرة القادمة";
                reward.style.display = "none";
                btn.innerText = "حاول مرة أخرى";
                btn.onclick = () => { document.getElementById('resultModal').classList.remove('active'); loadLevel(currentLevelIndex); };
                
                // أنيميشن الخسارة
                grid.style.transform = "scale(0.95)";
                setTimeout(() => grid.style.transform = "scale(1)", 200);
            }

            setTimeout(() => { modal.classList.add('active'); }, 300);
        }

        // دعم السحب (Swipe) للموبايل
        let touchStartX = 0;
        let touchStartY = 0;

        document.getElementById('gameArea').addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        });

        document.getElementById('gameArea').addEventListener('touchend', e => {
            if (isGameOver) return;
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) handleMove(dx > 0 ? 1 : -1, 0); // يمين أو يسار
            } else {
                if (Math.abs(dy) > 30) handleMove(0, dy > 0 ? 1 : -1); // أسفل أو أعلى
            }
        });

        // دعم الكيبورد
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') handleMove(0, -1);
            if (e.key === 'ArrowDown') handleMove(0, 1);
            if (e.key === 'ArrowLeft') handleMove(-1, 0);
            if (e.key === 'ArrowRight') handleMove(1, 0);
        });

        // تشغيل اللعبة
        window.onload = () => loadLevel(0);
    </script>
</body>
</html>
