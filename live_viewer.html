<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NABD Live - Pro Gifts</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.18.2.js"></script>

    <style>
        /* =========================================
           1. أساسيات الصفحة
           ========================================= */
        :root { --primary: #F72585; --gold: #FFD700; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #000; color: #fff; height: 100vh; overflow: hidden; }

        /* مشغل الفيديو */
        #remote-player { position: absolute; inset: 0; z-index: 1; background: #111; }
        #remote-player video { object-fit: cover !important; }

        /* طبقة الواجهة */
        .overlay-layer { 
            position: absolute; inset: 0; z-index: 10; pointer-events: none; 
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 30%, rgba(0,0,0,0.8) 100%);
            display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
        }

        /* --- الهيدر --- */
        .top-section { width: 100%; display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
        .host-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .host-info-card {
            background: rgba(30, 30, 30, 0.6); backdrop-filter: blur(8px);
            padding: 4px 15px 4px 5px; border-radius: 30px;
            display: flex; align-items: center; gap: 10px; border: 1px solid rgba(255,255,255,0.1);
        }
        .host-img { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--primary); object-fit: cover; }
        .host-name { font-weight: bold; font-size: 13px; color: #fff; }
        .viewer-count { font-size: 10px; color: #ddd; }

        /* --- منطقة الشات --- */
        .chat-container { width: 100%; display: flex; flex-direction: column; justify-content: flex-end; margin-bottom: 10px; pointer-events: none; }
        .chat-list {
            height: 250px; overflow-y: auto; scrollbar-width: none;
            mask-image: linear-gradient(to top, black 85%, transparent 100%);
            display: flex; flex-direction: column; justify-content: flex-end; margin-bottom: 10px;
        }
        .chat-msg { 
            background: rgba(0,0,0,0.4); padding: 5px 12px; border-radius: 15px; 
            margin-bottom: 6px; font-size: 13px; width: fit-content; max-width: 85%; 
            word-wrap: break-word; text-shadow: 0 1px 2px black; animation: slideIn 0.2s ease;
        }
        .chat-user { color: #4CC9F0; font-weight: 800; margin-left: 5px; }
        .gift-chat-msg {
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.3), transparent);
            border-right: 3px solid #FFD700; color: #FFD700; font-weight: bold;
        }

        /* --- الشريط السفلي --- */
        .bottom-bar { display: flex; gap: 10px; pointer-events: auto; align-items: center; width: 100%; }
        #msg-input { 
            flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 25px; padding: 10px 15px; color: #fff; outline: none; backdrop-filter: blur(5px);
        }
        .action-btn { 
            width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; font-size: 20px; 
            color: #fff; transition: transform 0.2s; backdrop-filter: blur(5px);
        }
        .action-btn:active { transform: scale(0.9); }
        .btn-send { background: var(--primary); }
        .btn-gift { background: linear-gradient(135deg, #FFD700, #FFA500); color: #000; box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); animation: pulseGift 2s infinite; }

        /* =========================================
           2. نظام الهدايا الاحترافي (Ticker & Combo)
           ========================================= */
        .gift-ticker-wrapper {
            position: absolute; top: 120px; left: 10px; z-index: 100; pointer-events: none;
            display: flex; flex-direction: column; gap: 8px;
        }
        
        .gift-ticker-card {
            display: flex; align-items: center; gap: 10px;
            background: linear-gradient(90deg, rgba(0,0,0,0.8) 0%, rgba(255, 215, 0, 0.1) 100%);
            border-left: 4px solid #FFD700; border-radius: 50px;
            padding: 5px 15px 5px 5px;
            transform: translateX(-120%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: fit-content;
        }
        .gift-ticker-card.show { transform: translateX(0); }
        .ticker-avatar { width: 35px; height: 35px; border-radius: 50%; border: 1px solid #FFD700; object-fit: cover; }
        .ticker-info { display: flex; flex-direction: column; line-height: 1.1; margin-left: 5px; }
        .ticker-name { color: #FFD700; font-weight: 800; font-size: 12px; }
        .ticker-desc { color: #fff; font-size: 10px; font-weight: 600; }
        .ticker-gift-icon { font-size: 28px; filter: drop-shadow(0 0 5px rgba(255,215,0,0.5)); }
        .gift-combo-count { font-family: 'Impact', sans-serif; font-size: 24px; color: #fff; text-shadow: 2px 2px 0 #F72585; font-style: italic; margin-right: 10px; opacity: 0; transform: scale(0.5); transition: all 0.2s; }
        .gift-combo-count.active { opacity: 1; transform: scale(1); }
        .gift-combo-count.pop { animation: comboPop 0.3s ease-in-out; }

        /* =========================================
           3. قائمة اختيار الهدايا (Bottom Sheet)
           ========================================= */
        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; }
        .bottom-sheet {
            position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a1a;
            border-radius: 20px 20px 0 0; transform: translateY(100%); transition: transform 0.3s ease;
            z-index: 201; padding: 20px; border-top: 1px solid #333;
        }
        .bottom-sheet.active { transform: translateY(0); }
        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; color: #fff; }
        .gift-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .gift-item {
            background: rgba(255,255,255,0.05); border-radius: 12px; padding: 10px 5px;
            display: flex; flex-direction: column; align-items: center; cursor: pointer;
            border: 1px solid transparent; transition: 0.2s;
        }
        .gift-item:active { transform: scale(0.95); border-color: var(--primary); }
        .g-emoji { font-size: 35px; margin-bottom: 5px; }
        .g-name { font-size: 10px; font-weight: bold; color: #fff; }
        .g-price { font-size: 9px; color: #FFD700; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 8px; margin-top: 2px; }

        /* =========================================
           4. الأنيميشن والتأثيرات
           ========================================= */
        .big-effect-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 150; pointer-events: none; }
        .big-gift-pop { font-size: 120px; animation: popBig 1s ease-out forwards; filter: drop-shadow(0 0 20px rgba(255,215,0,0.8)); }
        
        @keyframes comboPop { 0% { transform: scale(1); } 50% { transform: scale(1.5) rotate(-10deg); color: #FFD700; } 100% { transform: scale(1) rotate(0); } }
        @keyframes popBig { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.5); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
        @keyframes pulseGift { 0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(255, 215, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-300px) scale(1.5) rotate(20deg); opacity: 0; } }

        /* شاشة التحميل */
        #loading-screen { position: absolute; inset: 0; background: #000; z-index: 999; display: flex; justify-content: center; align-items: center; flex-direction: column; color: var(--primary); }

        /* 🔥 =========================================
           شاشة انتهاء البث (End Screen) - الجديد
           ========================================= */
        .end-screen {
            position: fixed; inset: 0; z-index: 5000;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(15px);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            animation: fadeIn 0.5s ease;
        }
        .end-screen.active { display: flex; }
        .end-host-img {
            width: 100px; height: 100px; border-radius: 50%;
            border: 4px solid var(--primary); object-fit: cover;
            margin-bottom: 20px; box-shadow: 0 0 30px rgba(247, 37, 133, 0.5);
        }
        .end-title { font-size: 22px; font-weight: bold; margin-bottom: 10px; color: #fff; }
        .end-msg { font-size: 14px; color: #aaa; margin-bottom: 30px; }
        .redirect-box {
            background: rgba(255,255,255,0.1); padding: 15px 25px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px; font-size: 14px;
        }
        .spinner-mini {
            width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* حاوية التأثير بالكامل */
.interaction-container {
    position: absolute;
    bottom: 100px;
    right: 20px; /* مكان الظهور */
    width: 60px;
    height: 300px;
    pointer-events: none;
    z-index: 9999;
}

/* صورة الشخص اللي بعت القلب */
.sender-avatar-pop {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 3px solid #FFD700; /* إطار ذهبي */
    position: absolute;
    bottom: 0;
    left: 5px;
    opacity: 0;
    transform: scale(0);
    animation: popAvatar 3s ease-out forwards;
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    z-index: 2;
}

/* القلوب الصغيرة اللي بتخرج من الصورة */
.burst-heart {
    position: absolute;
    bottom: 25px; /* تخرج من نص الصورة */
    left: 15px;
    font-size: 20px;
    color: #F72585;
    opacity: 0;
    animation: burstUp 2s ease-out forwards;
    z-index: 1;
}

/* أنيميشن ظهور الصورة واختفائها */
@keyframes popAvatar {
    0% { transform: scale(0); opacity: 0; bottom: 0; }
    10% { transform: scale(1.2); opacity: 1; bottom: 20px; } /* تطلع لفوق سنة */
    20% { transform: scale(1); opacity: 1; bottom: 20px; }
    80% { transform: scale(1); opacity: 1; bottom: 20px; }
    100% { transform: scale(0); opacity: 0; bottom: 50px; }
}

/* أنيميشن طيران القلوب */
@keyframes burstUp {
    0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(var(--tx), -200px) scale(1.5) rotate(var(--rot)); opacity: 0; }
}

    </style>
</head>
<body>

    <div id="loading-screen">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 40px; margin-bottom: 15px;"></i>
        <div style="color: #fff; font-weight: bold;">جاري دخول البث...</div>
    </div>

    <div id="endScreen" class="end-screen">
        <img id="endHostPic" src="" class="end-host-img">
        <div class="end-title">انتهى البث المباشر 👋</div>
        <div class="end-msg">لقد أغلق <span id="endHostName" style="color:var(--primary)">المضيف</span> البث.</div>
        
        <div class="redirect-box">
            <div class="spinner-mini"></div>
            <span id="redirectText">جاري البحث عن بث آخر...</span>
        </div>
    </div>

    <div id="remote-player"></div>

    <div class="overlay-layer" id="uiLayer">
        
        <div class="top-section">
            <div class="host-header">
                <div class="host-info-card">
                    <img id="host-pic" src="https://via.placeholder.com/50" class="host-img">
                    <div style="display:flex; flex-direction:column; line-height:1.2">
                        <span class="host-name" id="host-name">..</span>
                        <span class="viewer-count"><i class="fa-solid fa-user"></i> <span id="viewers">0</span></span>
                    </div>
                </div>
                <div style="background:rgba(247,37,133,0.8); padding:4px 10px; border-radius:12px; font-size:11px; font-weight:bold;">LIVE</div>
            </div>
        </div>

        <div id="gift-ticker-overlay" class="gift-ticker-wrapper"></div>
        <div id="big-effects-area" class="big-effect-container"></div>

        <div class="chat-container">
            <div class="chat-list" id="chat-list"></div>

            <div class="bottom-bar">
                <input type="text" id="msg-input" placeholder="قل شيئاً لطيفاً..." onkeypress="if(event.key==='Enter') sendMsg()">
                <button class="action-btn btn-send" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
                <button class="action-btn btn-gift" onclick="GiftSystem.open()"><i class="fa-solid fa-gift"></i></button>
<button class="action-btn" style="background:rgba(255,255,255,0.15); color:#ff2d55" onclick="sendLiveHeart()"><i class="fa-solid fa-heart"></i></button>

            </div>
        </div>
    </div>

    <div class="sheet-overlay" id="sheetOverlay" onclick="GiftSystem.close()"></div>
    <div class="bottom-sheet" id="giftSheet">
        <div class="sheet-header">
            <h3>إرسال هدية</h3>
            <div style="background:rgba(255,215,0,0.1); color:#FFD700; padding:5px 10px; border-radius:15px; font-size:12px; font-weight:bold;">
                <i class="fa-solid fa-coins"></i> 5000
            </div>
        </div>
        <div class="gift-grid" id="giftGridContainer"></div>
    </div>

    <div id="flyingHeartsContainer" style="position:absolute; bottom:80px; right:20px; width:50px; height:300px; pointer-events:none; z-index:5;"></div>

    <script>
        // --- 1. الإعدادات ---
        const firebaseConfig = {
            apiKey: "AIzaSyDpvqNAReChsHn5tFJSp7vV_EJHmtD2x4c",
            authDomain: "pools-e4381.firebaseapp.com",
            projectId: "pools-e4381",
            storageBucket: "pools-e4381.firebasestorage.app",
            messagingSenderId: "339799216046",
            appId: "1:339799216046:web:26e437a7b7d5c24fe9023f"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const APP_ID = "f311de5105eb4fa7869dfffd2bb7ac2d"; 
        const TOKEN = "007eJxTYGhhPet5ZLbkOikhVcfvlz9rM9ouv5yyO1hfY/fRZY/S8lkUGNKMDQ1TUk0NDUxTk0zSEs0tzCxT0tLSUoySkswTk41SOlubMhsCGRnSrBuZGRkgEMTnYShJLS6JT85IzMtLzWFgAAAh4iJc";
        
        const urlParams = new URLSearchParams(window.location.search);
        const CHANNEL = urlParams.get('channel') || "test_channel"; 

        const client = AgoraRTC.createClient({ mode: "live", codec: "vp8" });
        let currentUser = null;
        let userData = { name: "ضيف", profilePic: "https://via.placeholder.com/100" };
        let pendingHearts = 0; 
        
        // متغيرات للمذيع الحالي لاستخدامها في شاشة النهاية
        let currentHostName = "المذيع";
        let currentHostPic = "";

        // --- 3. تشغيل البث ---
        auth.onAuthStateChanged(async user => {
            if(user) {
                currentUser = user;
                const doc = await db.collection('users').doc(user.uid).get();
                if(doc.exists) userData = doc.data();
                else userData = { name: user.displayName, profilePic: user.photoURL };
            }
            initLive();
        });

        async function initLive() {
            // الاستماع لحالة القناة (الحي / مغلق)
            db.collection('lives').doc(CHANNEL).onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    
                    // حفظ بيانات المذيع
                    currentHostName = data.hostName || "المذيع";
                    currentHostPic = data.hostPic || "https://cdn-icons-png.flaticon.com/512/847/847969.png";

                    // تحديث الواجهة الحالية
                    document.getElementById('host-name').innerText = currentHostName;
                    document.getElementById('host-pic').src = currentHostPic;
                    document.getElementById('viewers').innerText = data.viewers || 0;

                    // 🔥🔥🔥 الفحص الأهم: هل البث انتهى؟ 🔥🔥🔥
                    if (data.status === 'offline') {
                        handleStreamEnded(); // استدعاء دالة الخروج الاحترافي
                        listenToInteractions(); 
                    }
                }
            });

            // عداد المشاهدة
            db.collection('lives').doc(CHANNEL).update({ viewers: firebase.firestore.FieldValue.increment(1) }).catch(()=>{});

            // الاتصال بالفيديو
            try {
                client.setClientRole("audience");
                await client.join(APP_ID, CHANNEL, TOKEN, null);
                client.on("user-published", async (user, mediaType) => {
                    await client.subscribe(user, mediaType);
                    document.getElementById('loading-screen').style.display = 'none';
                    if (mediaType === "video") user.videoTrack.play("remote-player");
                    if (mediaType === "audio") user.audioTrack.play();
                });
            } catch (err) {
                console.error(err);
                document.getElementById('loading-screen').innerHTML = "<p style='color:red'>خطأ في الاتصال</p>";
            }

            loadChat();
        }

        // ==========================================
        // 🔥 دالة التعامل مع انتهاء البث (الجديدة) 🔥
        // ==========================================
        function handleStreamEnded() {
            // 1. قطع الاتصال بأجورا فوراً
            client.leave();

            // 2. إخفاء واجهة البث والفيديو
            document.getElementById('uiLayer').style.display = 'none';
            document.getElementById('remote-player').innerHTML = ''; // تنظيف الفيديو

            // 3. تجهيز شاشة النهاية
            document.getElementById('endHostName').innerText = currentHostName;
            document.getElementById('endHostPic').src = currentHostPic;
            
            // 4. إظهار شاشة النهاية
            const endScreen = document.getElementById('endScreen');
            endScreen.classList.add('active');

            // 5. البحث عن بث آخر (المنطق الذكي)
            const redirectText = document.getElementById('redirectText');
            let countdown = 5;

            // البحث في الداتابيز عن أي بث أونلاين غير الحالي
            db.collection('lives')
                .where('status', '==', 'online')
                .limit(2) // نجيب 2 احتياطي
                .get()
                .then(snapshot => {
                    // فلترة البث الحالي من النتائج
                    const otherStreams = snapshot.docs.filter(doc => doc.id !== CHANNEL);

                    if (otherStreams.length > 0) {
                        // لقينا بث تاني!
                        const nextStreamId = otherStreams[0].id;
                        redirectText.innerText = `تم العثور على بث آخر.. الانتقال خلال ${countdown}`;
                        
                        const timer = setInterval(() => {
                            countdown--;
                            redirectText.innerText = `تم العثور على بث آخر.. الانتقال خلال ${countdown}`;
                            if (countdown <= 0) {
                                clearInterval(timer);
                                window.location.href = `?channel=${nextStreamId}`; // إعادة تحميل الصفحة بالقناة الجديدة
                            }
                        }, 1000);

                    } else {
                        // مفيش بثوث تانية
                        redirectText.innerText = `لا توجد بثوث أخرى.. العودة للرئيسية خلال ${countdown}`;
                        
                        const timer = setInterval(() => {
                            countdown--;
                            redirectText.innerText = `لا توجد بثوث أخرى.. العودة للرئيسية خلال ${countdown}`;
                            if (countdown <= 0) {
                                clearInterval(timer);
                                // هنا بنرجعه لصفحة الفيديوهات (videos.html)
                                window.location.href = 'videos.html'; 
                            }
                        }, 1000);
                    }
                });
        }

        // ========================================================
        // 4. نظام الهدايا (كما هو)
        // ========================================================
        const AVAILABLE_GIFTS = [
            { id: 'rose', name: 'وردة', emoji: '🌹', price: 10 },
            { id: 'heart', name: 'قلب', emoji: '❤️', price: 50 },
            { id: 'fire', name: 'نار', emoji: '🔥', price: 100 },
            { id: 'diamond', name: 'ألماس', emoji: '💎', price: 500 },
            { id: 'car', name: 'سيارة', emoji: '🏎️', price: 1000 },
            { id: 'crown', name: 'تاج', emoji: '👑', price: 3000 },
            { id: 'lion', name: 'أسد', emoji: '🦁', price: 5000 },
            { id: 'rocket', name: 'صاروخ', emoji: '🚀', price: 10000 }
        ];

        const GiftSystem = {
            open: function() {
                const container = document.getElementById('giftGridContainer');
                container.innerHTML = AVAILABLE_GIFTS.map(g => `
                    <div class="gift-item" onclick="GiftSystem.send('${g.id}')">
                        <div class="g-emoji">${g.emoji}</div>
                        <div class="g-name">${g.name}</div>
                        <div class="g-price">${g.price}</div>
                    </div>
                `).join('');
                document.getElementById('giftSheet').classList.add('active');
                document.getElementById('sheetOverlay').style.display = 'block';
            },
            close: function() {
                document.getElementById('giftSheet').classList.remove('active');
                document.getElementById('sheetOverlay').style.display = 'none';
            },
            send: async function(giftId) {
                if (!currentUser) return alert("يرجى تسجيل الدخول");
                const gift = AVAILABLE_GIFTS.find(g => g.id === giftId);
                if(!gift) return;
                this.close();
                GiftTicker.add(userData.name, userData.profilePic, gift.name, gift.emoji);
                playSystemSound('sent');
                await db.collection('lives').doc(CHANNEL).collection('messages').add({
                    type: 'gift',
                    userId: currentUser.uid,
                    userName: userData.name || "مستخدم",
                    userPic: userData.profilePic || "",
                    giftId: gift.id,
                    giftName: gift.name,
                    giftEmoji: gift.emoji,
                    price: gift.price,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            },
            playBigEffect: function(emoji) {
                const area = document.getElementById('big-effects-area');
                const el = document.createElement('div');
                el.className = 'big-gift-pop';
                el.innerText = emoji;
                area.appendChild(el);
                playSystemSound('combo');
                setTimeout(() => el.remove(), 1500);
            }
        };

        const GiftTicker = {
            queue: [],
            activeData: null,
            hideTimer: null,
            add: function(senderName, senderPic, giftName, giftEmoji) {
                if (this.activeData && this.activeData.senderName === senderName && this.activeData.giftName === giftName) {
                    this.triggerCombo();
                    return;
                }
                this.queue.push({ senderName, senderPic, giftName, giftEmoji, count: 1 });
                if (!this.activeData) this.process();
            },
            process: function() {
                if (this.queue.length === 0) {
                    this.activeData = null;
                    return;
                }
                const gift = this.queue.shift();
                this.activeData = gift;
                this.render(gift);
            },
            render: function(gift) {
                const container = document.getElementById('gift-ticker-overlay');
                container.innerHTML = `
                    <div class="gift-ticker-card" id="tickerCard">
                        <img src="${gift.senderPic || 'https://via.placeholder.com/50'}" class="ticker-avatar">
                        <div class="ticker-info">
                            <span class="ticker-name">${gift.senderName}</span>
                            <span class="ticker-desc">أرسل ${gift.giftName}</span>
                        </div>
                        <div class="ticker-gift-icon">${gift.giftEmoji}</div>
                        <div class="gift-combo-count" id="comboCounter">x1</div>
                    </div>
                `;
                setTimeout(() => {
                    const card = document.getElementById('tickerCard');
                    const counter = document.getElementById('comboCounter');
                    if(card) card.classList.add('show');
                    if(counter) counter.classList.add('active');
                }, 50);
                this.resetTimer();
            },
            triggerCombo: function() {
                this.activeData.count++;
                const counter = document.getElementById('comboCounter');
                if (counter) {
                    counter.innerText = 'x' + this.activeData.count;
                    counter.classList.remove('pop');
                    void counter.offsetWidth;
                    counter.classList.add('pop');
                    playSystemSound('combo');
                }
                this.resetTimer();
            },
            resetTimer: function() {
                if (this.hideTimer) clearTimeout(this.hideTimer);
                this.hideTimer = setTimeout(() => { this.close(); }, 4000);
            },
            close: function() {
                const card = document.getElementById('tickerCard');
                if (card) {
                    card.style.transform = "translateX(-120%)";
                    card.style.opacity = "0";
                }
                setTimeout(() => {
                    document.getElementById('gift-ticker-overlay').innerHTML = '';
                    this.activeData = null;
                    this.process();
                }, 300);
            }
        };

        function loadChat() {
            db.collection('lives').doc(CHANNEL).collection('messages')
                .orderBy('timestamp', 'asc')
                .onSnapshot(snapshot => {
                    const list = document.getElementById('chat-list');
                    snapshot.docChanges().forEach(change => {
                        if (change.type === 'added') {
                            const msg = change.doc.data();
                            const div = document.createElement('div');
                            if (msg.type === 'gift') {
                                div.className = 'chat-msg gift-chat-msg';
                                div.innerHTML = `<span class="chat-user">${escapeHtml(msg.userName)}:</span> أرسل ${msg.giftName} ${msg.giftEmoji}`;
                                list.appendChild(div);
                                if (currentUser && msg.userId !== currentUser.uid) {
                                    GiftTicker.add(msg.userName, msg.userPic, msg.giftName, msg.giftEmoji);
                                }
                                GiftSystem.playBigEffect(msg.giftEmoji);
                            } else {
                                div.className = 'chat-msg';
                                div.innerHTML = `<span class="chat-user">${escapeHtml(msg.userName)}:</span> ${escapeHtml(msg.text)}`;
                                list.appendChild(div);
                            }
                            list.scrollTop = list.scrollHeight;
                        }
                    });
                });
        }

        async function sendMsg() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !currentUser) return;
            await db.collection('lives').doc(CHANNEL).collection('messages').add({
                type: 'text',
                userId: currentUser.uid,
                userName: userData.name,
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            input.value = '';
        }

        // استبدل الدالة القديمة بهذه النسخة المصححة
// دالة الإرسال عند المشاهد
async function sendLiveHeart() {
    // 1. تأثير بصري محلي (عشان المشاهد يحس بالسرعة)
    showAvatarBurst(userData.profilePic); // بنظهر صورتك انت لنفسك

    if (!CHANNEL) return;

    // 2. تحديث العداد العام (عشان الرقم يزيد)
    db.collection('lives').doc(CHANNEL).update({
        hearts: firebase.firestore.FieldValue.increment(1)
    }).catch(()=>{});

    // 3. 🔥 الجديد: إرسال "حدث تفاعل" ليراه المضيف
    // بنضيف مستند في كولكشن فرعية اسمها 'interactions'
    // ده اللي هيخلي صورتك تظهر هناك
    try {
        // داخل دالة sendLiveHeart
await db.collection('lives').doc(CHANNEL).collection('interactions').add({
    type: 'heart',
    uid: currentUser.uid, // <--- ضفنا هذا السطر عشان نعرف نميز مين اللي بعت
    senderName: userData.name || 'مجهول',
    senderPic: userData.profilePic || 'https://via.placeholder.com/50',
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
});

    } catch(err) {
        console.error("Error sending interaction:", err);
    }
}


// هذه الدالة كانت ناقصة عندك، ضفها عشان القلوب تظهر وهي طايرة
function showFloatingHeart(emoji) {
    const container = document.getElementById('flyingHeartsContainer');
    const el = document.createElement('div');
    el.innerText = emoji;
    // تنسيق القلب المتطاير
    el.style.position = 'absolute';
    el.style.bottom = '0';
    // مكان عشوائي عشان ميطلعوش فوق بعض
    el.style.left = (Math.random() * 50) + 'px'; 
    el.style.fontSize = '30px';
    el.style.pointerEvents = 'none';
    el.style.animation = 'floatUp 2s ease-out forwards';
    
    container.appendChild(el);

    // حذف العنصر بعد ما يختفي عشان الذاكرة
    setTimeout(() => {
        el.remove();
    }, 2000);
}

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSystemSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if (type === 'sent') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'combo') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        function escapeHtml(text) {
            if(!text) return "";
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        window.onbeforeunload = () => {
            if(CHANNEL) db.collection('lives').doc(CHANNEL).update({ viewers: firebase.firestore.FieldValue.increment(-1) });
        };
        
        setInterval(() => {
            if (pendingHearts > 0) {
                db.collection('lives').doc(CHANNEL).update({
                    hearts: firebase.firestore.FieldValue.increment(pendingHearts)
                }).catch(err => console.log(err));
                pendingHearts = 0;
            }
        }, 2000);
        
        // استدعاء هذه الدالة داخل initLive()
function listenToInteractions() {
    // بنسمع للتغييرات في كولكشن التفاعلات
    db.collection('lives').doc(CHANNEL).collection('interactions')
      .orderBy('timestamp', 'desc')
      .limit(1) // بنهتم بآخر تفاعل فقط
      .onSnapshot(snapshot => {
          snapshot.docChanges().forEach(change => {
              if (change.type === 'added') {
                  const data = change.doc.data();
                  
                  // نتأكد إن التفاعل جديد (مش قديم متخزن)
                  // بنقارن الوقت الحالي بوقت السيرفر (بفارق بسيط)
                  const now = Date.now();
                  const eventTime = data.timestamp ? data.timestamp.toMillis() : now;
                  
                  // لو الحدث حصل في آخر 5 ثواني واعرضه
                  if (now - eventTime < 5000) {
                      // لو أنا اللي باعت، متظهرش تاني (لأننا أظهرناها محلياً)
                      if (currentUser && currentUser.uid !== data.uid) { 
                          showAvatarBurst(data.senderPic);
                      }
                  }
              }
          });
      });
}

// 🔥 دالة الأنيميشن السحرية (صورة بتطلع منها قلوب)
function showAvatarBurst(imgUrl) {
    // 1. إنشاء الحاوية
    const container = document.createElement('div');
    container.className = 'interaction-container';
    
    // مكان عشوائي بسيط عشان لو كذا حد بعت ميبقوش فوق بعض بالظبط
    const randomRight = 20 + Math.random() * 40; 
    container.style.right = randomRight + 'px';

    document.body.appendChild(container);

    // 2. إنشاء صورة الشخص
    const avatar = document.createElement('img');
    avatar.src = imgUrl || "https://cdn-icons-png.flaticon.com/512/847/847969.png";
    avatar.className = 'sender-avatar-pop';
    container.appendChild(avatar);

    // 3. إنشاء قلوب متفجرة من الصورة (5 قلوب مثلاً)
    for (let i = 0; i < 5; i++) {
        const heart = document.createElement('div');
        heart.innerHTML = '<i class="fa-solid fa-heart"></i>';
        heart.className = 'burst-heart';
        
        // حسابات عشوائية لاتجاه القلب
        const tx = (Math.random() - 0.5) * 100 + 'px'; // يطير يمين أو شمال
        const rot = (Math.random() - 0.5) * 60 + 'deg'; // يلف شوية
        
        heart.style.setProperty('--tx', tx);
        heart.style.setProperty('--rot', rot);
        heart.style.animationDelay = (i * 0.1) + 's'; // تأخير بسيط بين كل قلب

        container.appendChild(heart);
    }

    // 4. تنظيف العناصر بعد ما الأنيميشن يخلص
    setTimeout(() => {
        container.remove();
    }, 3000);
}
