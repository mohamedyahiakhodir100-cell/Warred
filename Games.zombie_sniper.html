<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قناص الزومبي - Wareed</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #020205;
            --primary-color: #00ff66; /* لون الرؤية الليلية */
            --text-color: #eee;
            --gold: #FFD700;
            --danger: #ff0055;
            --zombie-color: #bf5af2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Cairo", sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-color); color: var(--text-color); overflow: hidden; display: flex; flex-direction: column; height: 100vh; touch-action: none; }

        /* --- الهيدر --- */
        .game-header {
            position: absolute; top: 0; left: 0; width: 100%; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            pointer-events: none; /* عشان نقدر نصوب تحته */
        }
        .game-header > * { pointer-events: auto; }
        
        .back-btn { font-size: 20px; cursor: pointer; color: #fff; filter: drop-shadow(0 0 5px #000); }
        .stats-box { background: rgba(255,215,0,0.1); border: 1px solid var(--gold); color: var(--gold); padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; backdrop-filter: blur(5px); }

        /* --- لوحة المعلومات --- */
        .dashboard {
            position: absolute; top: 60px; left: 0; width: 100%; z-index: 100;
            display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none;
        }
        .score-board { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 0 10px var(--primary-color); }
        
        .health-bar-container { width: 120px; height: 10px; background: #222; border-radius: 5px; border: 1px solid #444; overflow: hidden; margin-top: 10px; }
        .health-bar { height: 100%; width: 100%; background: var(--primary-color); transition: 0.3s; }

        /* --- الكانفاس --- */
        #gameCanvas {
            display: block; width: 100%; height: 100%; background: #050505;
        }

        /* --- أدوات التحكم (UI) --- */
        .controls-layer {
            position: absolute; bottom: 30px; left: 0; width: 100%; padding: 0 20px;
            display: flex; justify-content: space-between; align-items: flex-end; z-index: 150;
            pointer-events: none;
        }
        
        .ammo-box {
            display: flex; gap: 5px; flex-direction: column-reverse; pointer-events: auto;
        }
        .bullet { width: 12px; height: 35px; border: 2px solid var(--gold); border-radius: 5px 5px 2px 2px; background: rgba(255,215,0,0.2); transition: 0.2s; }
        .bullet.full { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
        
        .reload-btn {
            background: rgba(0,0,0,0.6); border: 2px solid var(--primary-color); color: var(--primary-color);
            padding: 10px; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            font-size: 20px; margin-top: 10px; cursor: pointer; backdrop-filter: blur(5px);
        }
        .reload-btn:active { transform: scale(0.9); }
        
        .fire-btn {
            background: rgba(255, 0, 85, 0.2); border: 3px solid var(--danger); color: var(--danger);
            width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 35px; cursor: pointer; box-shadow: 0 0 20px rgba(255,0,85,0.4), inset 0 0 20px rgba(255,0,85,0.4);
            pointer-events: auto; transition: 0.1s;
        }
        .fire-btn:active { background: var(--danger); color: #fff; transform: scale(0.9); box-shadow: 0 0 40px var(--danger); }
        
        /* وميض الإصابة/الإطلاق */
        .flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50;
            opacity: 0; pointer-events: none; transition: opacity 0.1s;
        }

        /* --- نافذة النهاية --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .result-box {
            background: #111; border: 1px solid var(--danger); border-radius: 20px;
            padding: 30px; text-align: center; width: 80%; max-width: 320px;
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.3); animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .result-icon { font-size: 50px; color: var(--danger); margin-bottom: 10px; }
        .result-title { font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 5px; }
        .score-text { font-size: 16px; color: #aaa; margin-bottom: 15px; }
        .earned-coins { font-size: 22px; font-weight: 900; color: var(--gold); margin-bottom: 20px; }
        
        .btn-action {
            background: linear-gradient(45deg, var(--danger), #ff5e62);
            color: #fff; border: none; padding: 12px 30px; border-radius: 25px;
            font-weight: bold; font-size: 16px; width: 100%; cursor: pointer; transition: 0.2s;
        }
        .btn-action:active { transform: scale(0.95); }

        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .start-hint {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: var(--primary-color); font-weight: bold; font-size: 16px; text-align: center;
            pointer-events: none; animation: blink 1.5s infinite; z-index: 100; width: 100%; text-shadow: 0 0 10px var(--primary-color);
        }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="game-header">
        <i class="fa-solid fa-arrow-right back-btn" onclick="history.back()"></i>
        <div class="stats-box" id="walletBox"><i class="fa-solid fa-coins"></i> <span id="walletCoins">0</span></div>
    </div>

    <div class="dashboard">
        <div>
            <div class="score-board"><i class="fa-solid fa-skull"></i> <span id="scoreDisplay">0</span></div>
            <div class="health-bar-container"><div class="health-bar" id="healthBar"></div></div>
        </div>
    </div>

    <div class="start-hint" id="startHint">اسحب لتحريك المنظار<br>واضغط على الزر للإطلاق!</div>

    <canvas id="gameCanvas"></canvas>
    <div class="flash" id="flashScreen"></div>

    <div class="controls-layer">
        <div style="pointer-events: auto;">
            <div class="ammo-box" id="ammoBox">
                </div>
            <div class="reload-btn" onclick="reloadWeapon()"><i class="fa-solid fa-rotate"></i></div>
        </div>
        
        <div class="fire-btn" onclick="fireWeapon()"><i class="fa-solid fa-crosshairs"></i></div>
    </div>

    <div class="modal-overlay" id="gameOverModal">
        <div class="result-box">
            <div class="result-icon"><i class="fa-solid fa-biohazard"></i></div>
            <div class="result-title">لقد التهموك!</div>
            <div class="score-text">تم القضاء على: <span id="finalScore" style="color:#fff; font-weight:bold;">0</span> زومبي</div>
            <div class="earned-coins">+<span id="coinsEarned">0</span> عملة <i class="fa-solid fa-coins"></i></div>
            <button class="btn-action" onclick="restartGame()">انتقام <i class="fa-solid fa-rotate-right"></i></button>
        </div>
    </div>

    <script>
        // ==========================================
        // 🎯 إعدادات الكانفاس والمحفظة
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            aimX = canvas.width / 2;
            aimY = canvas.height / 2;
        }
        window.addEventListener('resize', resize);
        
        let totalCoins = parseInt(localStorage.getItem('wareed_coins') || '1500');
        document.getElementById('walletCoins').innerText = totalCoins;

        // متغيرات اللعبة
        let score = 0;
        let health = 100;
        let ammo = 5;
        const maxAmmo = 5;
        let isReloading = false;
        let gameActive = true;
        let hasStarted = false;
        let frameCount = 0;

        // متغيرات القناص (المنظار)
        let aimX = 0, aimY = 0;
        let recoilY = 0; // تأثير الارتداد
        const scopeRadius = 100; // مساحة الرؤية الواضحة

        // ==========================================
        // 🧟‍♂️ كائن الزومبي
        // ==========================================
        let zombies = [];
        let particles = [];

        class Zombie {
            constructor() {
                // يظهرون في أماكن عشوائية
                this.x = Math.random() * (canvas.width - 100) + 50;
                this.y = Math.random() * (canvas.height - 200) + 100;
                this.radius = 5; // يبدأ صغير كأنه بعيد
                this.maxRadius = 50; // إذا وصل هذا الحجم يضربك
                // سرعة النمو تعتمد على السكور (الزومبي يقترب أسرع)
                this.growSpeed = 0.05 + (score * 0.002);
                this.color = '#bf5af2';
                this.active = true;
            }

            draw() {
                if(!this.active) return;
                ctx.save();
                
                // عين الزومبي المرعبة في الظلام
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                
                // الرأس
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fill();

                // العينان (حمراء مضيئة إذا اقترب)
                ctx.fillStyle = this.radius > 30 ? '#ff0055' : '#000';
                ctx.shadowColor = this.radius > 30 ? '#ff0055' : 'transparent';
                ctx.beginPath();
                ctx.arc(this.x - this.radius*0.3, this.y - this.radius*0.2, this.radius*0.2, 0, Math.PI*2);
                ctx.arc(this.x + this.radius*0.3, this.y - this.radius*0.2, this.radius*0.2, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
            }

            update() {
                if(!this.active) return;
                
                // الزومبي يكبر (يقترب)
                this.radius += this.growSpeed;

                // إذا وصل للحجم الأقصى -> يهاجم اللاعب
                if (this.radius >= this.maxRadius) {
                    this.active = false;
                    takeDamage();
                }

                this.draw();
            }
        }

        // ==========================================
        // 💥 مؤثرات الدم (Blood Particles)
        // ==========================================
        class Particle {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.radius = Math.random() * 4 + 2;
                this.vx = (Math.random() - 0.5) * 15;
                this.vy = (Math.random() - 0.5) * 15;
                this.color = '#bf5af2'; // دم الزومبي بنفسجي نيون
                this.alpha = 1;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.04;
                this.draw();
            }
        }

        // ==========================================
        // 🔭 رسم الشاشة ومنظار القنص (Night Vision Scope)
        // ==========================================
        function drawScope() {
            ctx.save();
            
            // 1. تظليل الشاشة كلها بالأسود
            ctx.fillStyle = 'rgba(0, 0, 5, 0.95)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. قص دائرة الرؤية (Scope)
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(aimX, aimY + recoilY, scopeRadius, 0, Math.PI * 2);
            ctx.fill();

            // 3. إضافة تأثير الرؤية الليلية الخضراء على الدائرة المقطوعة
            ctx.globalCompositeOperation = 'source-over';
            
            // خطوط المنظار (Crosshair)
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.8)';
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            ctx.moveTo(aimX - scopeRadius, aimY + recoilY);
            ctx.lineTo(aimX + scopeRadius, aimY + recoilY);
            ctx.moveTo(aimX, aimY + recoilY - scopeRadius);
            ctx.lineTo(aimX, aimY + recoilY + scopeRadius);
            ctx.stroke();

            // الدائرة المركزية
            ctx.beginPath();
            ctx.arc(aimX, aimY + recoilY, 20, 0, Math.PI * 2);
            ctx.stroke();

            // نقطة المنتصف الحمراء (الليزر)
            ctx.fillStyle = '#ff0055';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff0055';
            ctx.beginPath();
            ctx.arc(aimX, aimY + recoilY, 3, 0, Math.PI * 2);
            ctx.fill();

            // ارتداد السلاح يرجع لطبيعته تدريجياً
            if(recoilY > 0) recoilY -= 2;

            ctx.restore();
        }

        // ==========================================
        // 🔫 نظام الإطلاق والتذخير
        // ==========================================
        function updateAmmoUI() {
            const box = document.getElementById('ammoBox');
            box.innerHTML = '';
            for(let i=0; i<maxAmmo; i++) {
                const bullet = document.createElement('div');
                bullet.className = `bullet ${i < ammo ? 'full' : ''}`;
                box.appendChild(bullet);
            }
        }

        function reloadWeapon() {
            if (!gameActive || ammo === maxAmmo || isReloading) return;
            isReloading = true;
            if(navigator.vibrate) navigator.vibrate([20, 50, 20]); // صوت تذخير
            
            // وميض زر التذخير
            const rBtn = document.querySelector('.reload-btn');
            rBtn.style.color = '#fff'; rBtn.style.background = 'var(--primary-color)';
            
            setTimeout(() => {
                ammo = maxAmmo;
                isReloading = false;
                updateAmmoUI();
                rBtn.style.color = 'var(--primary-color)'; rBtn.style.background = 'rgba(0,0,0,0.6)';
            }, 800);
        }

        function fireWeapon() {
            if (!gameActive || !hasStarted) return;
            
            if (ammo <= 0) {
                // سلاح فارغ (نقرة فارغة)
                if(navigator.vibrate) navigator.vibrate(10);
                const rBtn = document.querySelector('.reload-btn');
                rBtn.style.borderColor = 'var(--danger)';
                setTimeout(()=> rBtn.style.borderColor = 'var(--primary-color)', 200);
                return;
            }

            if (isReloading) return;

            // إطلاق ناجح
            ammo--;
            updateAmmoUI();
            recoilY = 30; // رفع المنظار للأعلى كارتداد واقعي
            if(navigator.vibrate) navigator.vibrate(50); // هزة قوية

            // وميض ناري للشاشة
            const flash = document.getElementById('flashScreen');
            flash.style.background = 'rgba(255, 215, 0, 0.3)';
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 50);

            checkHit();

            if (ammo === 0) {
                setTimeout(reloadWeapon, 500); // تذخير تلقائي إذا فرغ
            }
        }

        function checkHit() {
            let hitFound = false;

            // البحث عن زومبي في مركز المنظار (من الأكبر للأصغر)
            for (let i = zombies.length - 1; i >= 0; i--) {
                let z = zombies[i];
                if (!z.active) continue;

                // هل نقطة الهدف تقع داخل دائرة الزومبي؟
                let dist = Math.hypot(aimX - z.x, aimY - z.y);
                
                if (dist < z.radius + 15) { // +15 تسامح لسهولة اللعب ع الموبايل
                    z.active = false;
                    hitFound = true;
                    
                    // انفجار دموي
                    for(let p=0; p<12; p++) particles.push(new Particle(z.x, z.y));
                    
                    // إزالة الزومبي
                    zombies.splice(i, 1);
                    
                    score++;
                    document.getElementById('scoreDisplay').innerText = score;
                    break; // رصاصة واحدة تقتل زومبي واحد
                }
            }
        }

        // ==========================================
        // ❤️ نظام الصحة (التعرض للهجوم)
        // ==========================================
        function takeDamage() {
            health -= 25; // 4 هجمات وتموت
            
            const hb = document.getElementById('healthBar');
            hb.style.width = health + '%';
            if (health <= 25) hb.style.background = 'var(--danger)';

            // وميض أحمر دموي
            const flash = document.getElementById('flashScreen');
            flash.style.background = 'rgba(255, 0, 85, 0.5)';
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 150);
            
            if(navigator.vibrate) navigator.vibrate([100, 50, 100]);

            if (health <= 0) {
                endGame();
            }
        }

        // ==========================================
        // 👆 التحكم في المنظار
        // ==========================================
        // عشان نحرك المنظار بالسحب على الشاشة من أي مكان
        let isAiming = false;
        
        canvas.addEventListener('touchstart', (e) => {
            isAiming = true;
            if (!hasStarted) {
                hasStarted = true;
                document.getElementById('startHint').style.display = 'none';
            }
            aimX = e.touches[0].clientX;
            aimY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
            if(isAiming) {
                aimX = e.touches[0].clientX;
                aimY = e.touches[0].clientY;
            }
        });

        canvas.addEventListener('touchend', () => isAiming = false);

        // دعم الماوس
        canvas.addEventListener('mousemove', (e) => {
            if(!hasStarted) return;
            aimX = e.clientX;
            aimY = e.clientY;
        });
        canvas.addEventListener('mousedown', () => {
            if (!hasStarted) { hasStarted = true; document.getElementById('startHint').style.display = 'none'; }
        });

        // ==========================================
        // 🔄 الحلقة الرئيسية ونهاية اللعبة
        // ==========================================
        function animate() {
            if (!gameActive) return;
            requestAnimationFrame(animate);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (hasStarted) {
                frameCount++;
                
                // ظهور الزومبي يسرع مع الوقت
                let spawnRate = Math.max(30, 120 - Math.floor(score * 2));
                if (frameCount % spawnRate === 0) {
                    zombies.push(new Zombie());
                }
            }

            // رسم وتحديث الزومبي (يُرسَم تحت الـ Scope)
            zombies.forEach(z => z.update());
            
            // رسم الشرر والدم
            for (let i = particles.length - 1; i >= 0; i--) {
                if (particles[i].alpha <= 0) particles.splice(i, 1);
                else particles[i].update();
            }

            // رسم المنظار فوق كل شيء
            drawScope();
        }

        function endGame() {
            gameActive = false;
            
            // حساب المكافأة: 1 عملة لكل 5 زومبي
            let earned = Math.floor(score / 5);
            if(score > 0 && earned === 0) earned = 1;

            totalCoins += earned;
            localStorage.setItem('wareed_coins', totalCoins);
            document.getElementById('walletCoins').innerText = totalCoins;

            document.getElementById('finalScore').innerText = score;
            document.getElementById('coinsEarned').innerText = earned;
            
            setTimeout(() => {
                document.getElementById('gameOverModal').style.display = 'flex';
            }, 500);
        }

        function restartGame() {
            document.getElementById('gameOverModal').style.display = 'none';
            score = 0;
            health = 100;
            ammo = maxAmmo;
            frameCount = 0;
            zombies = [];
            particles = [];
            hasStarted = false;
            
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('healthBar').style.width = '100%';
            document.getElementById('healthBar').style.background = 'var(--primary-color)';
            document.getElementById('startHint').style.display = 'block';
            
            updateAmmoUI();
            resize();
            gameActive = true;
            animate();
        }

        // البدء
        resize();
        updateAmmoUI();
        animate();

    </script>
</body>
</html>
