<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حرب الفضاء - Wareed</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0d0d0f;
            --primary-color: #00C6FF;  
            --text-color: #eee;
            --gold: #FFD700;
            --danger: #ff3b30;
            --enemy-color: #ff0055;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Cairo", sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #000; color: var(--text-color); overflow: hidden; touch-action: none; display: flex; flex-direction: column; height: 100vh; }

        /* --- الهيدر --- */
        .game-header {
            position: absolute; top: 0; left: 0; width: 100%; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        }
        .back-btn { font-size: 20px; cursor: pointer; color: #fff; filter: drop-shadow(0 0 5px #000); }
        .stats-box { background: rgba(255,215,0,0.2); border: 1px solid var(--gold); color: var(--gold); padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; backdrop-filter: blur(5px); }

        /* --- معلومات اللعب (النقاط) --- */
        .score-board {
            position: absolute; top: 65px; left: 20px; z-index: 100;
            font-size: 20px; font-weight: 900; color: #fff; text-shadow: 0 0 10px var(--primary-color);
        }
        
        /* --- مساحة الكانفاس --- */
        #gameCanvas {
            display: block; width: 100%; height: 100%; background: #050510;
        }

        /* --- نافذة نهاية اللعبة (Game Over) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .result-box {
            background: #111; border: 1px solid var(--primary-color); border-radius: 20px;
            padding: 30px; text-align: center; width: 80%; max-width: 320px;
            box-shadow: 0 0 40px rgba(0, 198, 255, 0.2); animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .result-icon { font-size: 50px; color: var(--danger); margin-bottom: 10px; }
        .result-title { font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 5px; }
        .score-text { font-size: 16px; color: #aaa; margin-bottom: 15px; }
        .earned-coins { font-size: 22px; font-weight: 900; color: var(--gold); margin-bottom: 20px; }
        
        .btn-action {
            background: linear-gradient(45deg, var(--primary-color), #0072FF);
            color: #fff; border: none; padding: 12px 30px; border-radius: 25px;
            font-weight: bold; font-size: 16px; width: 100%; cursor: pointer; transition: 0.2s;
        }
        .btn-action:active { transform: scale(0.95); }

        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div class="game-header">
        <i class="fa-solid fa-arrow-right back-btn" onclick="history.back()"></i>
        <div class="stats-box"><i class="fa-solid fa-coins"></i> <span id="walletCoins">0</span></div>
    </div>

    <div class="score-board">النتيجة: <span id="scoreDisplay">0</span></div>

    <canvas id="gameCanvas"></canvas>

    <div class="modal-overlay" id="gameOverModal">
        <div class="result-box">
            <div class="result-icon"><i class="fa-solid fa-meteor"></i></div>
            <div class="result-title">انتهت اللعبة!</div>
            <div class="score-text">دمرت <span id="finalScore" style="color:#fff; font-weight:bold;">0</span> عدو</div>
            <div class="earned-coins">+<span id="coinsEarned">0</span> عملة <i class="fa-solid fa-coins"></i></div>
            <button class="btn-action" onclick="restartGame()">إلعب مرة أخرى <i class="fa-solid fa-rotate-right"></i></button>
        </div>
    </div>

    <script>
        // ==========================================
        // 🚀 إعدادات المحرك (Game Engine)
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // ضبط أبعاد الشاشة
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // متغيرات المحفظة واللعبة
        let totalCoins = parseInt(localStorage.getItem('wareed_coins') || '1500');
        document.getElementById('walletCoins').innerText = totalCoins;
        
        let score = 0;
        let gameActive = true;
        let frameCount = 0;

        // مصفوفات العناصر
        let bullets = [];
        let enemies = [];
        let particles = [];
        let stars = [];

        // ==========================================
        // 🛸 كائن اللاعب (المركبة)
        // ==========================================
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            width: 40,
            height: 50,
            color: '#00C6FF',
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // توهج المركبة
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;

                // رسم شكل المركبة (مثلث)
                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2); // الرأس
                ctx.lineTo(this.width / 2, this.height / 2); // الزاوية اليمنى
                ctx.lineTo(0, this.height / 3); // تجويف من الأسفل
                ctx.lineTo(-this.width / 2, this.height / 2); // الزاوية اليسرى
                ctx.closePath();
                ctx.fill();

                // نيران المحرك
                ctx.fillStyle = '#ff9900';
                ctx.beginPath();
                ctx.moveTo(-10, this.height / 3);
                ctx.lineTo(10, this.height / 3);
                ctx.lineTo(0, this.height / 2 + Math.random() * 20); // حركة النيران العشوائية
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            },
            shoot() {
                // إطلاق ليزر من منتصف المركبة
                bullets.push(new Bullet(this.x, this.y - this.height / 2));
            }
        };

        // ==========================================
        // 🔫 الرصاص (الليزرات)
        // ==========================================
        class Bullet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 4;
                this.height = 15;
                this.speed = 10;
                this.color = '#00C6FF';
            }
            draw() {
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - this.width/2, this.y, this.width, this.height);
                ctx.shadowBlur = 0;
            }
            update() {
                this.y -= this.speed;
                this.draw();
            }
        }

        // ==========================================
        // 👾 الأعداء (النيازك / سفن العدو)
        // ==========================================
        class Enemy {
            constructor() {
                this.radius = Math.random() * 15 + 15; // حجم عشوائي
                this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
                this.y = -this.radius;
                this.speed = Math.random() * 2 + 2 + (score / 50); // تزيد السرعة مع زيادة السكور
                this.color = '#ff0055';
            }
            draw() {
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                // عين للعدو (شكل جمالي)
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius / 2.5, 0, Math.PI * 2);
                ctx.fill();
            }
            update() {
                this.y += this.speed;
                this.draw();
            }
        }

        // ==========================================
        // ✨ المؤثرات (الانفجارات)
        // ==========================================
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 3 + 1;
                this.velocity = {
                    x: (Math.random() - 0.5) * 8,
                    y: (Math.random() - 0.5) * 8
                };
                this.color = color;
                this.alpha = 1;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.02; // يتلاشى تدريجياً
                this.draw();
            }
        }

        // ==========================================
        // 🌌 خلفية النجوم المتحركة
        // ==========================================
        for(let i=0; i<50; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 1 + 0.5
            });
        }
        function drawStars() {
            ctx.fillStyle = '#fff';
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI*2);
                ctx.fill();
                star.y += star.speed;
                if(star.y > canvas.height) { star.y = 0; star.x = Math.random() * canvas.width; }
            });
        }

        // ==========================================
        // 🎮 حلقة اللعبة الرئيسية (Game Loop)
        // ==========================================
        function animate() {
            if (!gameActive) return;
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(5, 5, 16, 0.4)'; // يعطي تأثير ذيل للحركة
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawStars();
            player.draw();

            frameCount++;
            
            // إطلاق نار تلقائي (كل 15 فريم)
            if (frameCount % 15 === 0) {
                player.shoot();
            }

            // ظهور أعداء (كلما زاد السكور، يظهرون أسرع)
            let spawnRate = Math.max(20, 60 - Math.floor(score / 5));
            if (frameCount % spawnRate === 0) {
                enemies.push(new Enemy());
            }

            // تحديث الانفجارات
            particles.forEach((particle, index) => {
                if (particle.alpha <= 0) particles.splice(index, 1);
                else particle.update();
            });

            // تحديث الرصاص
            bullets.forEach((bullet, bIndex) => {
                bullet.update();
                // مسح الرصاصة لو طلعت برا الشاشة
                if (bullet.y + bullet.height < 0) {
                    setTimeout(() => bullets.splice(bIndex, 1), 0);
                }
            });

            // تحديث الأعداء وفحص التصادم
            enemies.forEach((enemy, eIndex) => {
                enemy.update();

                // 1. تصادم العدو مع الرصاص
                bullets.forEach((bullet, bIndex) => {
                    const dist = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);
                    if (dist - enemy.radius - bullet.width/2 < 0) {
                        // انفجار
                        for(let i=0; i<8; i++) {
                            particles.push(new Particle(enemy.x, enemy.y, enemy.color));
                        }
                        // مسح العدو والرصاصة
                        setTimeout(() => {
                            enemies.splice(eIndex, 1);
                            bullets.splice(bIndex, 1);
                        }, 0);
                        
                        // زيادة السكور
                        score++;
                        document.getElementById('scoreDisplay').innerText = score;
                    }
                });

                // 2. تصادم العدو مع اللاعب (Game Over)
                const distToPlayer = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                if (distToPlayer - enemy.radius - player.width/2 < 0) {
                    endGame();
                }

                // 3. مسح العدو لو نزل لتحت (خصم نقطة كعقاب)
                if (enemy.y - enemy.radius > canvas.height) {
                    setTimeout(() => enemies.splice(eIndex, 1), 0);
                    score = Math.max(0, score - 1); // لا يقل عن صفر
                    document.getElementById('scoreDisplay').innerText = score;
                }
            });
        }

        // ==========================================
        // 👆 التحكم باللمس (للموبايل)
        // ==========================================
        canvas.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            // تحريك المركبة مع الإصبع، مع عدم الخروج من الشاشة
            if(touch.clientX > 20 && touch.clientX < canvas.width - 20) {
                player.x = touch.clientX;
            }
            // يمكن أيضاً ربط الـ Y إذا أردت (player.y = touch.clientY - 50;)
        });

        // الماوس (للكمبيوتر)
        canvas.addEventListener('mousemove', (e) => {
            if(e.clientX > 20 && e.clientX < canvas.width - 20) {
                player.x = e.clientX;
            }
        });

        // ==========================================
        // 🛑 نهاية اللعبة وإضافة العملات
        // ==========================================
        function endGame() {
            gameActive = false;
            
            // حساب الأرباح (مثلاً: كل 10 أعداء = 1 عملة، كحد أدنى 1 لو جاب سكور)
            let earned = Math.floor(score / 10);
            if (score > 0 && earned === 0) earned = 1; 

            // تحديث المحفظة
            totalCoins += earned;
            localStorage.setItem('wareed_coins', totalCoins);
            document.getElementById('walletCoins').innerText = totalCoins;

            // إظهار النتائج
            document.getElementById('finalScore').innerText = score;
            document.getElementById('coinsEarned').innerText = earned;
            document.getElementById('gameOverModal').style.display = 'flex';
            
            // هزة خفيفة للخسارة
            if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }

        // ==========================================
        // 🔄 إعادة اللعب
        // ==========================================
        function restartGame() {
            document.getElementById('gameOverModal').style.display = 'none';
            score = 0;
            frameCount = 0;
            document.getElementById('scoreDisplay').innerText = score;
            
            // إعادة ضبط المصفوفات واللاعب
            bullets = [];
            enemies = [];
            particles = [];
            player.x = canvas.width / 2;
            
            gameActive = true;
            animate();
        }

        // تشغيل اللعبة فوراً
        animate();

        // تحديث أبعاد الكانفاس عند تدوير الشاشة
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.y = canvas.height - 100;
        });

    </script>
</body>
</html>
