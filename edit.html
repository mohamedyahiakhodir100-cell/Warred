<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NABD - تعديل الملف الشخصي</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">

    <style>
        /* الستايل الجديد المطور */
        :root {
            --primary-color: #7c3aed;
            --uranium-green: #3fff00;
            --bg-dark: #0d0d0f;
            --card-bg: #16161a;
            --input-bg: #1f1f23;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: #fff;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* الهيدر */
        .header {
            display: flex;
            align-items: center;
            padding: 20px 15px;
            border-bottom: 1px solid #1f1f23;
            position: sticky;
            top: 0;
            background: rgba(13, 13, 15, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .header i {
            cursor: pointer;
            font-size: 20px;
            color: var(--uranium-green);
            margin-left: 15px;
            transition: 0.3s;
        }

        .header i:hover { transform: scale(1.2); }

        .header h2 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 450px;
            margin: 0 auto 40px;
            padding: 0 15px;
        }

        /* منطقة الغلاف والأفاتار */
        .cover-area {
            height: 160px;
            background: linear-gradient(180deg, rgba(124, 58, 237, 0.2), transparent), 
                        url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            background-color: #1a1a1e;
            position: relative;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .avatar-edit {
            width: 115px;
            height: 115px;
            border-radius: 50%;
            border: 4px solid var(--bg-dark);
            position: absolute;
            bottom: -55px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 900;
            background: #25252b;
            color: var(--uranium-green);
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px rgba(63, 255, 0, 0.1);
        }

        .avatar-edit:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 0 30px rgba(63, 255, 0, 0.3);
        }

        .camera-icon {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: var(--uranium-green);
            color: #000;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            border: 3px solid var(--bg-dark);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* نموذج التعديل */
        .edit-form {
            margin-top: 75px;
            padding: 25px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.03);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #888;
            font-weight: 600;
            font-size: 13px;
            margin-right: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid #2a2a30;
            background: var(--input-bg);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--uranium-green);
            background: #25252b;
            box-shadow: 0 0 15px rgba(63, 255, 0, 0.05);
        }

        .form-group textarea {
            min-height: 110px;
            resize: none;
        }

        /* 🔥 ستايلات نظام اليوزر نيم (TikTok Style) 🔥 */
        .username-feedback { font-size: 12px; margin-top: 5px; margin-bottom: 10px; text-align: right; display: none; font-weight: bold; transition: 0.3s; }
        .username-feedback.error { color: #ff5555; display: block; }
        .username-feedback.success { color: #10b981; display: block; }
        .username-feedback.loading { color: var(--secondary-text); display: block; }

        .form-group input.error { border-color: #ff5555; box-shadow: 0 0 8px rgba(255, 85, 85, 0.3); }
        .form-group input.success { border-color: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.3); }

        .suggestions-box { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; margin-bottom: 15px; display: none; }
        .suggestion-chip { background: rgba(255,255,255,0.05); border: 1px solid #2a2a30; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; color: #fff; transition: 0.2s; font-family: sans-serif; font-weight: bold; }
        .suggestion-chip:hover { background: var(--primary-color); border-color: var(--primary-color); transform: scale(1.05); }

        /* تصميم قسم البصمة الصوتية */
        .voice-section {
            background: rgba(255,255,255,0.02);
            border: 1px solid #2a2a30;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .rec-btn {
            width: 100%; padding: 12px; border-radius: 12px; font-weight: bold;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
            border: 1px dashed var(--primary-color); color: var(--primary-color); background: rgba(124, 58, 237, 0.1);
        }

        .rec-btn:hover { background: rgba(124, 58, 237, 0.2); }

        .rec-active-ui {
            display: none; align-items: center; justify-content: space-between;
            background: rgba(255, 59, 48, 0.1); border: 1px solid #ff3b30;
            padding: 10px 15px; border-radius: 12px; margin-top: 10px;
        }

        .preview-ui {
            display: none; flex-direction: column; gap: 15px; margin-top: 15px;
        }

        /* الأزرار */
        .save-btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: var(--uranium-green);
            color: #000;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(63, 255, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(63, 255, 0, 0.3);
            filter: brightness(1.1);
        }

        .save-btn:active { transform: scale(0.97); }

        .save-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* الرسائل والأنيميشن */
        .message {
            text-align: center;
            margin-bottom: 20px;
            padding: 14px;
            border-radius: 12px;
            display: none;
            font-weight: 600;
            font-size: 14px;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success { background: rgba(63, 255, 0, 0.1); color: var(--uranium-green); border: 1px solid rgba(63, 255, 0, 0.2); }
        .error { background: rgba(255, 85, 85, 0.1); color: #ff5555; border: 1px solid rgba(255, 85, 85, 0.2); }
        .loading { background: rgba(255, 255, 255, 0.05); color: #ccc; border: 1px solid rgba(255, 255, 255, 0.1); }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ========================================= */
        /* 🌟 نظام اختيار المواهب المتقدم (قائمة ثابتة) */
        /* ========================================= */
        .selected-tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            background: var(--input-bg);
            border: 1px solid #2a2a30;
            border-radius: 14px;
            min-height: 55px;
            align-items: center;
            cursor: pointer;
        }

        .selected-tag-chip {
            background: rgba(124, 58, 237, 0.2);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(124, 58, 237, 0.5);
        }

        .open-selector-btn {
            background: transparent;
            border: 1px dashed var(--primary-color);
            color: var(--primary-color);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .open-selector-btn:hover { background: rgba(124, 58, 237, 0.1); }

        /* تصميم نافذة الاختيار */
        .interest-category-title {
            font-size: 13px;
            color: var(--uranium-green);
            margin: 15px 0 10px 0;
            font-weight: 800;
            text-align: right;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .options-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            direction: rtl;
        }

        .option-chip {
            background: #25252b;
            border: 1px solid #333;
            color: #aaa;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }

        .option-chip.selected {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 4px 10px rgba(124, 58, 237, 0.3);
        }

        /* نافذة المودال الأساسية */
        .custom-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100000;
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .modal-box {
            background: var(--card-bg, #16161a); border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 24px; padding: 25px; width: 85%; max-width: 320px; 
            text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        @keyframes popInModal {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        /* زر تغيير الغلاف */
.cover-edit-btn {
    position: absolute;
    top: 15px;
    left: 15px; /* مكانه فوق على الشمال */
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255,255,255,0.2);
    transition: 0.3s;
    z-index: 10;
}
.cover-edit-btn:hover {
    background: rgba(0, 0, 0, 0.8);
    border-color: var(--uranium-green);
}

/* --- ستايل نافذة قص الصور --- */
.crop-modal-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95);
    z-index: 100000; display: none; flex-direction: column;
    backdrop-filter: blur(10px);
}
.crop-image-container {
    flex: 1; width: 100%; max-height: calc(100vh - 100px);
    display: flex; align-items: center; justify-content: center;
    background: #000; overflow: hidden;
}
.crop-image-container img { display: block; max-width: 100%; }
.crop-actions-bar {
    height: 100px; padding: 20px; background: #111;
    display: flex; gap: 15px; align-items: center; border-top: 1px solid #333;
}


    </style>
</head>

<body>

<div class="header">
    <i class="fa-solid fa-arrow-right" onclick="history.back()"></i>
    <h2>تعديل الملف الشخصي</h2>
</div>

<div class="container">
    <div class="cover-area" id="coverArea">
        <div class="cover-edit-btn" onclick="document.getElementById('coverOptionsModal').style.display='flex'">
            <i class="fa-solid fa-camera"></i> تغيير الغلاف
        </div>
        
        <div class="avatar-edit" id="avatarEdit">
            
            <i class="fa-solid fa-camera camera-icon"></i>
        </div>
    </div>

    <div class="edit-form">
        <div id="statusMessage" class="message"></div>

        <div class="form-group">
            <label>الاسم الكامل</label>
            <input type="text" id="nameInput" placeholder="أدخل اسمك الكامل">
        </div>

        <div class="form-group">
            <label>اسم المستخدم</label>
            <input type="text" id="usernameInput" placeholder="مثال: user_123" dir="ltr" style="text-align: right;" oninput="validateUsernameLive(this)">
            <div id="usernameFeedback" class="username-feedback"></div>
            <div id="usernameSuggestions" class="suggestions-box"></div>
        </div>

        <div class="form-group">
            <label>النبذة (Bio)</label>
            <textarea id="bioInput" placeholder="أخبرنا عن نفسك..."></textarea>
        </div>

        <div class="voice-section">
            <label style="display: block; margin-bottom: 10px; color: #888; font-weight: 600; font-size: 13px;">
                <i class="fa-solid fa-microphone-lines" style="color: var(--primary-color);"></i> البصمة الصوتية
            </label>
            <p style="font-size: 11px; color: #666; margin-bottom: 15px;">سجل رسالة ترحيب قصيرة لزوار بروفايلك (10 ثواني كحد أقصى)</p>

            <button id="startBioRecBtn" class="rec-btn" onclick="startBioRecording()">
                <i class="fa-solid fa-microphone"></i> اضغط لبدء التسجيل
            </button>

            <div id="recordingBioUI" class="rec-active-ui">
                <div style="display: flex; align-items: center; gap: 10px; color: #ff3b30; font-weight: bold;">
                    <i class="fa-solid fa-circle fa-fade" style="font-size: 10px;"></i> 
                    <span id="bioRecTimer">00:00</span>
                </div>
                <button onclick="stopBioRecording()" style="background: #ff3b30; color: #fff; border: none; padding: 6px 15px; border-radius: 8px; font-weight: bold; cursor: pointer;">
                    <i class="fa-solid fa-stop"></i> إيقاف
                </button>
            </div>

            <div id="previewBioUI" class="preview-ui">
                <audio id="bioAudioPreview" controls style="width: 100%; height: 35px;"></audio>
                <div style="display: flex; gap: 10px;">
                    <button onclick="deleteBioRecord()" style="flex: 1; padding: 10px; background: rgba(255, 59, 48, 0.1); border: 1px solid rgba(255, 59, 48, 0.3); color: #ff3b30; border-radius: 10px; cursor: pointer; font-weight: bold;">حذف</button>
                    <button id="uploadBioBtn" onclick="uploadVoiceBio()" style="flex: 2; padding: 10px; background: var(--primary-color); border: none; color: #fff; border-radius: 10px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);">
                        <i class="fa-solid fa-cloud-arrow-up"></i> حفظ كبصمة
                    </button>
                </div>
            </div>
            
            <div id="existingBioUi" style="display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #333; text-align: center;">
                <span style="font-size: 12px; color: var(--uranium-green);"><i class="fa-solid fa-check-circle"></i> لديك بصمة صوتية مسجلة</span>
                <button onclick="removeExistingBio()" style="display: block; width: 100%; margin-top: 10px; background: transparent; border: 1px dashed #ff3b30; color: #ff3b30; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold;">إزالة البصمة الحالية</button>
            </div>
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-briefcase"></i> العمل</label>
            <input type="text" id="workInput" placeholder="مثال: مهندس برمجيات">
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-graduation-cap"></i> الدراسة</label>
            <input type="text" id="eduInput" placeholder="مثال: جامعة القاهرة">
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-location-dot"></i> الموقع / السكن</label>
            <input type="text" id="locInput" placeholder="مثال: مصر، القاهرة">
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-link"></i> رابط أو موقع</label>
            <input type="text" id="webInput" placeholder="رابط موقعك أو حساب آخر" dir="ltr" style="text-align: right;">
        </div>
        
        <div class="form-group" style="border-top: 1px solid #2a2a30; padding-top: 20px; margin-top: 20px;">
            <label><i class="fa-solid fa-star" style="color: #FFD700;"></i> المواهب والاهتمامات</label>
            <p style="font-size: 11px; color: #888; margin-bottom: 10px;">اختر من القائمة ما يعبر عنك (بحد أقصى 5)</p>
            
            <div id="selectedTagsArea" class="selected-tags-container" onclick="openInterestsSelector(event)">
                <button class="open-selector-btn" id="openSelectorBtn">+ اضغط لاختيار مواهبك</button>
            </div>
        </div>

        <div class="form-group" style="margin-top: 20px;">
            <label><i class="fa-solid fa-link" style="color: var(--primary-color);"></i> روابط التواصل</label>
            <input type="url" id="fbInput" placeholder="رابط فيسبوك" dir="ltr" style="text-align: right; margin-bottom: 8px;">
            <input type="url" id="instaInput" placeholder="رابط إنستجرام" dir="ltr" style="text-align: right; margin-bottom: 8px;">
            <input type="url" id="tiktokInput" placeholder="رابط تيك توك" dir="ltr" style="text-align: right;">
        </div>

        <button class="save-btn" id="saveBtn" onclick="saveProfile()">
            حفظ التعديلات
        </button>
    </div>
</div>

<input type="file" id="fileInput" hidden accept="image/*">
<input type="file" id="coverInput" hidden accept="image/*">

const auth = firebase.auth();

// ==========================================
// 🌟 تعريف المتغيرات الأساسية
// ==========================================
const avatarEdit = document.getElementById("avatarEdit");
const fileInput = document.getElementById("fileInput");
const statusMessage = document.getElementById("statusMessage");
const saveBtn = document.getElementById("saveBtn");

const nameInput = document.getElementById("nameInput");
const usernameInput = document.getElementById("usernameInput");
const bioInput = document.getElementById("bioInput");
const workInput = document.getElementById("workInput");

const coverInput = document.getElementById("coverInput");
const coverArea = document.getElementById("coverArea");

let currentUser = null;
let uploadedImageUrl = null;
let currentProfileData = null; 

// متغيرات نظام اليوزر نيم
let usernameTimer;
let isUsernameValid = true; // يتم جعله صحيح افتراضياً حتى لا يمنع الحفظ إن لم يتم تعديله

// ==========================================
// 🔥 محرك فحص اسم المستخدم (TikTok Style) 🔥
// ==========================================
function validateUsernameLive(input) {
    clearTimeout(usernameTimer);
    const feedback = document.getElementById('usernameFeedback');
    const suggestionsBox = document.getElementById('usernameSuggestions');
    
    // إزالة المسافات، تحويل لحروف صغيرة، ومنع الحروف العربية
    let val = input.value.toLowerCase().replace(/\s/g, '');
    val = val.replace(/[^a-z0-9._]/g, '');
    input.value = val;

    saveBtn.disabled = true;
    isUsernameValid = false;
    suggestionsBox.style.display = 'none';

    if (val.length === 0) {
        input.classList.remove('error', 'success');
        feedback.style.display = 'none';
        saveBtn.disabled = false; 
        isUsernameValid = true; // السماح بالحفظ لو تركه فارغاً
        return;
    }

    if (val.length < 3) {
        input.classList.add('error');
        input.classList.remove('success');
        feedback.className = 'username-feedback error';
        feedback.innerText = "يجب أن يكون 3 أحرف على الأقل";
        return;
    }

    feedback.className = 'username-feedback loading';
    feedback.innerText = "جاري التحقق... ⏳";
    input.classList.remove('error', 'success');

    usernameTimer = setTimeout(() => {
        checkUsernameAvailability(val, input, feedback, suggestionsBox);
    }, 500);
}

async function checkUsernameAvailability(username, input, feedback, suggestionsBox) {
    if(!currentUser) return;

    // إذا كان هو نفس اسم المستخدم الحالي للملف الشخصي
    if(currentProfileData && currentProfileData.username === username) {
        input.classList.remove('error');
        input.classList.add('success');
        feedback.className = 'username-feedback success';
        feedback.innerText = "هذا هو اسم المستخدم الحالي الخاص بك ✅";
        isUsernameValid = true; 
        saveBtn.disabled = false;
        return;
    }

    try {
        const snapshot = await db.collection('users').where('username', '==', username).get();
        
        if(!snapshot.empty) {
            // الاسم مأخوذ
            input.classList.add('error');
            input.classList.remove('success');
            feedback.className = 'username-feedback error';
            feedback.innerText = "اسم المستخدم غير متاح ❌";
            generateSuggestions(username, suggestionsBox, input);
            saveBtn.disabled = true;
            isUsernameValid = false;
        } else {
            // الاسم متاح
            input.classList.remove('error');
            input.classList.add('success');
            feedback.className = 'username-feedback success';
            feedback.innerText = "اسم المستخدم متاح ✅";
            saveBtn.disabled = false;
            isUsernameValid = true;
        }
    } catch (e) {
        console.error("Error checking username:", e);
        feedback.className = 'username-feedback error';
        feedback.innerText = "حدث خطأ في الاتصال";
    }
}

function generateSuggestions(baseName, box, inputElement) {
    box.innerHTML = '';
    let cleanName = baseName.replace(/[0-9]/g, '');
    if(cleanName.length < 3) cleanName = baseName; 

    const suggestions = [
        cleanName + Math.floor(Math.random() * 999),
        cleanName + '_' + Math.floor(Math.random() * 99),
        cleanName + '.' + Math.floor(Math.random() * 999)
    ];

    suggestions.forEach(sug => {
        let chip = document.createElement('div');
        chip.className = 'suggestion-chip';
        chip.innerText = sug;
        chip.onclick = () => {
            inputElement.value = sug;
            validateUsernameLive(inputElement);
        };
        box.appendChild(chip);
    });
    box.style.display = 'flex';
}

function renderSelectedTagsUI() {
    const area = document.getElementById('selectedTagsArea');
    if (!area) return;
    area.innerHTML = ''; 

    if (userInterestsArray.length === 0) {
        area.innerHTML = '<button class="open-selector-btn" id="openSelectorBtn" onclick="openInterestsSelector(event)">+ اضغط لاختيار مواهبك</button>';
        return;
    }

    userInterestsArray.forEach(tag => {
        area.innerHTML += `<div class="selected-tag-chip">${tag}</div>`;
    });

    if (userInterestsArray.length < 5) {
        area.innerHTML += `<button class="open-selector-btn" id="openSelectorBtn" onclick="openInterestsSelector(event)" style="padding: 6px 10px; border-radius: 50%;"><i class="fa-solid fa-plus"></i></button>`;
    }
}

window.openInterestsSelector = function(e) {
    if(e) e.stopPropagation();
    if(typeof playSound === 'function') playSound('click');
    document.getElementById('interestsSelectorModal').style.display = 'flex';
    document.getElementById('interestSearchInput').value = ""; 
    drawDictionary(); 
};

function drawDictionary(searchQuery = "") {
    const container = document.getElementById('interestsDictionary');
    if (!container) return;
    container.innerHTML = "";

    for (const [category, tags] of Object.entries(interestsDictionary)) {
        const filteredTags = tags.filter(tag => tag.includes(searchQuery));
        
        if (filteredTags.length > 0) {
            container.innerHTML += `<div class="interest-category-title">${category}</div>`;
            
            let chipsHtml = '<div class="options-grid">';
            filteredTags.forEach(tag => {
                const isSelected = userInterestsArray.includes(tag) ? 'selected' : '';
                chipsHtml += `<div class="option-chip ${isSelected}" onclick="toggleInterestSelection('${tag}')">${tag}</div>`;
            });
            chipsHtml += '</div>';
            container.innerHTML += chipsHtml;
        }
    }

    if (container.innerHTML === "") {
        container.innerHTML = '<div style="text-align:center; color:#777; margin-top:30px;">لم يتم العثور على نتائج</div>';
    }
}

window.toggleInterestSelection = function(tag) {
    if(typeof playSound === 'function') playSound('click');
    const index = userInterestsArray.indexOf(tag);
    
    if (index > -1) {
        userInterestsArray.splice(index, 1);
    } else {
        if (userInterestsArray.length >= 5) {
            showMsg("الحد الأقصى 5 اهتمامات فقط ⚠️", "error");
            return;
        }
        userInterestsArray.push(tag);
    }

    drawDictionary(document.getElementById('interestSearchInput').value); 
    renderSelectedTagsUI();
};

window.filterInterests = function() {
    const query = document.getElementById('interestSearchInput').value.trim();
    drawDictionary(query);
};

async function loadProfile() {
    try {
        const doc = await db.collection("users").doc(currentUser.uid).get();
        
        if (!doc.exists) {
            await db.collection("users").doc(currentUser.uid).set({
                name: currentUser.displayName || "",
                email: currentUser.email || "",
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            return;
        }

        const data = doc.data();
        currentProfileData = data;
        
        nameInput.value = data.name || "";
        usernameInput.value = data.username || "";
        bioInput.value = data.bio || "";
        workInput.value = data.work || "";
        eduInput.value = data.education || "";
        locInput.value = data.location || "";
        webInput.value = data.website || "";

        userInterestsArray = data.interests || [];
        renderSelectedTagsUI();
        
        const links = data.socialLinks || {};
        fbInput.value = links.facebook || "";
        instaInput.value = links.instagram || "";
        tiktokInput.value = links.tiktok || "";

        // تحميل الغلاف (صورة أو لون)
        if (data.coverPic) {
            coverArea.style.backgroundImage = `url('${data.coverPic}')`;
            coverArea.style.backgroundSize = 'cover';
            coverArea.style.backgroundPosition = 'center';
        } else if (data.coverColor) {
            coverArea.style.backgroundImage = data.coverColor;
        }

        if (data.profilePic) {
            avatarEdit.style.backgroundImage = `url('${data.profilePic}')`;
            avatarEdit.innerText = "";
            uploadedImageUrl = data.profilePic;
        } else {
            avatarEdit.innerText = (data.name || "U")[0].toUpperCase();
        }

        if (data.voiceBioUrl) {
            document.getElementById('existingBioUi').style.display = 'block';
            document.getElementById('startBioRecBtn').innerHTML = '<i class="fa-solid fa-microphone"></i> تسجيل بصمة جديدة';
        }

    } catch (error) {
        console.error("Load error:", error);
        showMsg("خطأ في تحميل البيانات", "error");
    }
}

async function saveProfile() {
    if (!currentUser) {
        showMsg("يجب تسجيل الدخول ❌", "error");
        return;
    }

    // 🛑 منع الحفظ إذا كان اسم المستخدم قيد التحقق أو مسروق 🛑
    if (!isUsernameValid && usernameInput.value.trim().length > 0) {
        showMsg("يرجى اختيار اسم مستخدم متاح أولاً", "error");
        usernameInput.focus();
        return;
    }
    
    const name = nameInput.value.trim();
    const username = usernameInput.value.trim();
    const bio = bioInput.value.trim();
    const work = workInput.value.trim();
    const education = eduInput.value.trim();
    const location = locInput.value.trim();
    const website = webInput.value.trim();

    const socialLinks = {};
    const fb = fbInput.value.trim();
    const insta = instaInput.value.trim();
    const tiktok = tiktokInput.value.trim();
    if(fb) socialLinks.facebook = fb;
    if(insta) socialLinks.instagram = insta;
    if(tiktok) socialLinks.tiktok = tiktok;

    if (!name) {
        showMsg("أدخل الاسم", "error");
        nameInput.focus();
        return;
    }
    if (name.length < 2) {
        showMsg("الاسم قصير جداً", "error");
        nameInput.focus();
        return;
    }

    saveBtn.disabled = true;
    showMsg("جاري الحفظ...", "loading");

    const data = {
        name: name,
        username: username || "",
        bio: bio || "",
        work: work,
        education: education,
        location: location,
        website: website,
        socialLinks: socialLinks,           
        interests: userInterestsArray,      
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    if (uploadedImageUrl) {
        data.profilePic = uploadedImageUrl;
    }

    try {
        await db.collection("users").doc(currentUser.uid).set(data, { merge: true });
        showMsg("تم الحفظ بنجاح ✅", "success");
        setTimeout(() => window.location.href = "profile.html", 1500);
    } catch (error) {
        console.error("Save error:", error);
        showMsg("فشل الحفظ: " + error.message, "error");
        saveBtn.disabled = false;
    }
}

// ✂️ محرك قص ورفع الصور (Avatar & Cover)
// ==========================================
let cropper = null;
let currentCropType = ''; // 'avatar' أو 'cover'

// 1. لما يختار صورة البروفايل
fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (file) openCropModal(file, 'avatar');
    e.target.value = ''; // تصفير عشان يقدر يختارها تاني
};

// 2. لما يختار صورة الغلاف
coverInput.onchange = (e) => {
    const file = e.target.files[0];
    if (file) openCropModal(file, 'cover');
    e.target.value = ''; // تصفير
};

// 3. فتح نافذة القص وتشغيل المكتبة
function openCropModal(file, type) {
    if (!file.type.startsWith('image/')) {
        showMsg("اختر صورة فقط", "error");
        return;
    }
    
    currentCropType = type;
    const url = URL.createObjectURL(file);
    const image = document.getElementById('imageToCrop');
    image.src = url;
    
    document.getElementById('cropModal').style.display = 'flex';

    if (cropper) cropper.destroy(); // تدمير أي نسخة قديمة

    // تحديد مقاس القص بناءً على النوع (البروفايل 1:1 مربع ، الغلاف مستطيل عريض)
    const ratio = type === 'avatar' ? 1 / 1 : 16 / 7;

    cropper = new Cropper(image, {
        aspectRatio: ratio,
        viewMode: 1, // يمنع خروج التحديد بره الصورة
        dragMode: 'move', // يسمح بسحب الصورة نفسها بصابعك
        autoCropArea: 1,
        guides: true,
        highlight: false,
        cropBoxMovable: false, // نثبت المربع
        cropBoxResizable: false, // نثبت حجم المربع والمستخدم يحرك الصورة من تحته
    });
}

function closeCropModal() {
    document.getElementById('cropModal').style.display = 'none';
    if (cropper) {
        cropper.destroy();
        cropper = null;
    }
}

// 4. تنفيذ القص والرفع للفايربيز
async function confirmCropAndUpload() {
    if (!cropper || !currentUser) return;
    
    playSound('click');
    showMsg("جاري قص ورفع الصورة... ⏳", "loading");
    saveBtn.disabled = true;
    
    // استخراج الصورة المقصوصة (وهيضغطها أوتوماتيك عشان يوفر مساحة)
    const canvas = cropper.getCroppedCanvas({
        width: currentCropType === 'avatar' ? 400 : 800,
        height: currentCropType === 'avatar' ? 400 : 350,
        imageSmoothingEnabled: true,
        imageSmoothingQuality: 'high',
    });

    closeCropModal(); // نقفل النافذة فوراً

    // تحويل الكانفاس لملف عشان نرفعه
    canvas.toBlob(async (blob) => {
        try {
            const fileName = `${currentCropType}_${currentUser.uid}_${Date.now()}.jpg`;
            const folder = currentCropType === 'avatar' ? 'profile_pics' : 'covers';
            const storageRef = storage.ref().child(`${folder}/${currentUser.uid}/${fileName}`);
            
            await storageRef.put(blob);
            const url = await storageRef.getDownloadURL();

            if (currentCropType === 'avatar') {
                uploadedImageUrl = url;
                await db.collection("users").doc(currentUser.uid).update({
                    profilePic: url,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                avatarEdit.style.backgroundImage = `url('${url}')`;
                avatarEdit.innerText = "";
            } else {
                await db.collection("users").doc(currentUser.uid).update({
                    coverPic: url,
                    coverColor: firebase.firestore.FieldValue.delete(), // حذف اللون لو كان موجود
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                coverArea.style.backgroundImage = `url('${url}')`;
                coverArea.style.backgroundSize = 'cover';
                coverArea.style.backgroundPosition = 'center';
            }

            showMsg("تم التحديث بنجاح ✅", "success");
            playSound('success');
            
        } catch (error) {
            console.error("Crop Upload Error:", error);
            showMsg("فشل الرفع", "error");
        } finally {
            saveBtn.disabled = false;
        }
    }, 'image/jpeg', 0.85); // جودة 85% ممتازة جداً للموبايل
}

// ==================================================
let bioMediaRecorder;
let bioAudioChunks = [];
let bioTimerInterval;
let bioSeconds = 0;
let bioBlob = null;
let bioDurationText = "00:00";

async function startBioRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        bioMediaRecorder = new MediaRecorder(stream);
        bioAudioChunks = [];

        document.getElementById('startBioRecBtn').style.display = 'none';
        document.getElementById('existingBioUi').style.display = 'none'; 
        document.getElementById('recordingBioUI').style.display = 'flex';
        
        bioSeconds = 0;
        document.getElementById('bioRecTimer').innerText = "00:00";
        
        bioTimerInterval = setInterval(() => {
            bioSeconds++;
            const s = (bioSeconds % 60).toString().padStart(2, '0');
            bioDurationText = `00:${s}`;
            document.getElementById('bioRecTimer').innerText = bioDurationText;
            if (bioSeconds >= 10) stopBioRecording();
        }, 1000);

        bioMediaRecorder.ondataavailable = e => { if (e.data.size > 0) bioAudioChunks.push(e.data); };
        bioMediaRecorder.start();

    } catch (e) {
        alert("الرجاء السماح بصلاحية المايكروفون!");
    }
}

function stopBioRecording() {
    if (!bioMediaRecorder || bioMediaRecorder.state === "inactive") return;

    bioMediaRecorder.onstop = () => {
        clearInterval(bioTimerInterval);
        document.getElementById('recordingBioUI').style.display = 'none';
        document.getElementById('previewBioUI').style.display = 'flex';

        bioBlob = new Blob(bioAudioChunks, { type: 'audio/webm' });
        const audioUrl = URL.createObjectURL(bioBlob);
        document.getElementById('bioAudioPreview').src = audioUrl;

        bioMediaRecorder.stream.getTracks().forEach(track => track.stop()); 
    };
    bioMediaRecorder.stop();
}

function deleteBioRecord() {
    bioBlob = null;
    bioAudioChunks = [];
    document.getElementById('previewBioUI').style.display = 'none';
    document.getElementById('startBioRecBtn').style.display = 'block';
    
    if(currentProfileData && currentProfileData.voiceBioUrl) {
        document.getElementById('existingBioUi').style.display = 'block';
    }
}

async function uploadVoiceBio() {
    if (!bioBlob || !currentUser) return;

    const btn = document.getElementById('uploadBioBtn');
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> جاري الرفع...';
    btn.disabled = true;
    saveBtn.disabled = true; 

    try {
        const ext = 'webm';
        const storagePath = `voice_bios/${currentUser.uid}/bio_${Date.now()}.${ext}`;
        const storageRef = firebase.storage().ref().child(storagePath);
        
        const snapshot = await storageRef.put(bioBlob);
        const downloadUrl = await snapshot.ref.getDownloadURL();
        
        await db.collection("users").doc(currentUser.uid).update({
            voiceBioUrl: downloadUrl,
            voiceBioDuration: bioDurationText
        });

        currentProfileData.voiceBioUrl = downloadUrl;
        showMsg("تم حفظ البصمة الصوتية بنجاح 🎙️✅", "success");
        
        document.getElementById('previewBioUI').style.display = 'none';
        document.getElementById('startBioRecBtn').style.display = 'block';
        document.getElementById('startBioRecBtn').innerHTML = '<i class="fa-solid fa-microphone"></i> تسجيل بصمة جديدة';
        document.getElementById('existingBioUi').style.display = 'block';
        
    } catch (e) {
        console.error(e);
        showMsg("❌ حدث خطأ أثناء الرفع.", "error");
    } finally {
        btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> حفظ كبصمة';
        btn.disabled = false;
        saveBtn.disabled = false;
    }
}

function showMsg(msg, type) {
    statusMessage.className = `message ${type}`;
    statusMessage.innerHTML = type === 'loading' 
        ? msg + ' <span class="spinner"></span>' 
        : msg;
    statusMessage.style.display = "block";

    if (type !== 'loading') {
        setTimeout(() => statusMessage.style.display = "none", 3000);
    }
}

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px;">
            <h3 style="color: #fff; font-weight: 800; font-size: 16px;">اختر اهتماماتك</h3>
            <i class="fa-solid fa-xmark" onclick="document.getElementById('interestsSelectorModal').style.display='none'" style="color: #ff3b30; font-size: 20px; cursor: pointer; padding: 5px;"></i>
        </div>

        <input type="text" id="interestSearchInput" onkeyup="filterInterests()" placeholder="🔍 ابحث عن موهبة أو مهنة..." style="width: 100%; padding: 10px 15px; background: #0d0d0f; border: 1px solid #333; border-radius: 12px; color: #fff; outline: none; margin-bottom: 10px;">

        <div id="interestsDictionary" style="flex: 1; overflow-y: auto; padding-left: 5px; scrollbar-width: thin; text-align: right;">
        </div>

        <button class="save-btn" style="margin-top: 15px; padding: 12px;" onclick="document.getElementById('interestsSelectorModal').style.display='none'">تأكيد الاختيار</button>
    </div>
</div>
<script src="theme-manager.js"></script>

<div class="custom-modal" id="coverOptionsModal" style="z-index: 80000;">
    <div class="modal-box" style="max-width: 300px; padding: 20px;">
        <h3 style="color: #fff; margin-bottom: 15px;">تعديل الغلاف</h3>
        <button class="save-btn" style="margin-bottom: 10px; background: rgba(255,255,255,0.1); color: #fff;" onclick="document.getElementById('coverInput').click(); document.getElementById('coverOptionsModal').style.display='none';">
            <i class="fa-solid fa-image"></i> تحميل صورة
        </button>
        <button class="save-btn" style="margin-bottom: 10px; background: linear-gradient(135deg, var(--primary-color), #5D5FEF); color: #fff;" onclick="openCoverColorsModal()">
            <i class="fa-solid fa-palette"></i> اختيار لون / تدرج
        </button>
        <button style="width: 100%; padding: 12px; background: transparent; color: #aaa; border: none; font-weight: bold; cursor: pointer;" onclick="document.getElementById('coverOptionsModal').style.display='none'">إلغاء</button>
    </div>
</div>

<div class="custom-modal" id="coverColorsModal" style="z-index: 80001;">
    <div class="modal-box" style="max-width: 350px; padding: 20px;">
        <h3 style="color: #fff; margin-bottom: 15px;">ألوان الغلاف</h3>
        <div id="coverColorsGrid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-height: 300px; overflow-y: auto; padding: 5px;">
            </div>
        <button style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); color: #fff; border: none; border-radius: 12px; margin-top: 15px; font-weight: bold; cursor: pointer;" onclick="document.getElementById('coverColorsModal').style.display='none'">إغلاق</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<div class="crop-modal-overlay" id="cropModal">
    <div class="crop-image-container">
        <img id="imageToCrop" src="">
    </div>
    <div class="crop-actions-bar">
        <button class="btn-ghost btn-cancel-pro" style="flex: 1; padding: 15px; border-radius: 15px; font-weight: bold; background: rgba(255,255,255,0.1); border: none; color: #fff;" onclick="closeCropModal()">إلغاء</button>
        <button class="btn-primary" style="flex: 2; padding: 15px; border-radius: 15px; font-weight: bold; background: var(--primary-color); border: none; color: #fff;" onclick="confirmCropAndUpload()">قص وحفظ <i class="fa-solid fa-crop-simple"></i></button>
    </div>
</div>

</body>
</html>
