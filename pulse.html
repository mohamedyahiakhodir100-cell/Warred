<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wareed - النبض المتلاشي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>

    <style>
        :root {
            --bg: #050005; /* أسود محمر قليلاً */
            --life: #00ff88;
            --danger: #ff0055;
            --text: #eee;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Cairo", sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; overflow-x: hidden; }

        /* خلفية رسم القلب */
        .ecg-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: -1;
        }
        .ecg-line {
            position: fixed; top: 50%; left: 0; width: 100%; height: 2px;
            background: rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 10px var(--life);
            animation: ecgScan 4s linear infinite;
            z-index: -1;
        }
        @keyframes ecgScan { 
            0% { top: 10%; opacity: 0; } 
            50% { opacity: 1; } 
            100% { top: 90%; opacity: 0; } 
        }

        /* الهيدر */
        .pulse-header {
            padding: 15px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(20, 0, 5, 0.9); border-bottom: 1px solid #333;
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .heart-icon { font-size: 24px; color: var(--danger); animation: heartbeat 1.5s infinite; }
        @keyframes heartbeat { 0% { transform: scale(1); } 15% { transform: scale(1.3); } 30% { transform: scale(1); } 45% { transform: scale(1.3); } 100% { transform: scale(1); } }

        /* منطقة الكتابة */
        .create-pulse {
            background: rgba(255,255,255,0.05); margin: 15px; padding: 15px; border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .pulse-input {
            width: 100%; background: transparent; border: none; color: #fff; font-size: 16px; outline: none; resize: none;
        }
        .pulse-btn {
            background: var(--danger); color: #fff; border: none; padding: 8px 20px;
            border-radius: 20px; font-weight: bold; margin-top: 10px; cursor: pointer; float: left;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }

        /* كروت النبض */
        .pulse-card {
            background: #111; margin: 15px; border-radius: 16px; overflow: hidden;
            border: 1px solid #222; position: relative; transition: 0.5s;
        }
        
        /* شريط الحياة */
        .health-bar-container { height: 4px; background: #333; width: 100%; }
        .health-bar { height: 100%; background: var(--life); width: 100%; transition: width 1s linear, background 0.3s; box-shadow: 0 0 10px var(--life); }
        
        .pulse-body { padding: 15px; }
        .pulse-meta { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 12px; color: #aaa; }
        .pulse-avatar { width: 30px; height: 30px; border-radius: 50%; background-size: cover; border: 1px solid #555; }
        
        .pulse-text { font-size: 15px; line-height: 1.5; color: #fff; }

        /* زر الإنعاش */
        .revive-btn {
            position: absolute; right: 15px; bottom: 15px;
            width: 45px; height: 45px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: #fff; cursor: pointer;
            transition: 0.2s; z-index: 10;
        }
        .revive-btn:active { transform: scale(0.9); background: var(--life); color: #000; box-shadow: 0 0 20px var(--life); }

        /* حالات الاحتضار */
        .critical { animation: shake 0.5s infinite; border-color: var(--danger); }
        .dead { filter: grayscale(100%) blur(5px); pointer-events: none; opacity: 0.3; }

        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }

    </style>
</head>
<body>

    <div class="ecg-bg"></div>
    <div class="ecg-line"></div>

    <div class="pulse-header">
        <div onclick="history.back()" style="font-size: 20px; cursor: pointer;"><i class="fa-solid fa-arrow-right"></i></div>
        <div style="font-weight: 900; font-size: 18px;">غرفة الإنعاش <i class="fa-solid fa-heart-pulse heart-icon"></i></div>
        <div></div>
    </div>

    <div class="create-pulse">
        <textarea id="pulseInput" class="pulse-input" rows="2" placeholder="اكتب نبضة... (ستتلاشى إذا لم يتفاعل معها أحد)"></textarea>
        <div style="overflow: hidden;">
            <button class="pulse-btn" onclick="createPulse()">إطلاق النبضة 💉</button>
        </div>
    </div>

    <div id="pulseFeed" style="padding-bottom: 50px;">
        <div style="text-align:center; padding:20px; color:#666;"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري قياس النبض...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDpvqNAReChsHn5tFJSp7vV_EJHmtD2x4c",
            authDomain: "pools-e4381.firebaseapp.com",
            projectId: "pools-e4381",
            storageBucket: "pools-e4381.firebasestorage.app",
            messagingSenderId: "339799216046",
            appId: "1:339799216046:web:26e437a7b7d5c24fe9023f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;
        
        // عمر المنشور (مثلاً 1 ساعة = 60 دقيقة)
        const MAX_LIFE_MINUTES = 60; 

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                loadPulses();
            } else {
                alert("يجب تسجيل الدخول");
                history.back();
            }
        });

        // 1. إنشاء نبضة جديدة
        async function createPulse() {
            const txt = document.getElementById('pulseInput').value.trim();
            if(!txt) return;

            // جلب بيانات المستخدم
            const userDoc = await db.collection('users').doc(currentUser.uid).get();
            const userData = userDoc.data();

            await db.collection('pulse_posts').add({
                text: txt,
                uid: currentUser.uid,
                name: userData.name || "مستخدم",
                pic: userData.profilePic || "",
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                lastInteraction: firebase.firestore.FieldValue.serverTimestamp(), // وقت آخر إنعاش
                revives: 0
            });

            document.getElementById('pulseInput').value = "";
        }

        // 2. تحميل النبضات وتحديث حالتها
        function loadPulses() {
            db.collection('pulse_posts')
                .orderBy('lastInteraction', 'desc')
                .onSnapshot(snap => {
                    const container = document.getElementById('pulseFeed');
                    container.innerHTML = "";

                    snap.forEach(doc => {
                        const p = doc.data();
                        
                        // حساب الصحة
                        // نعتمد على وقت آخر تفاعل (lastInteraction)
                        const lastTime = p.lastInteraction ? p.lastInteraction.toMillis() : Date.now();
                        const now = Date.now();
                        const diffMinutes = (now - lastTime) / (1000 * 60); // الفرق بالدقائق
                        
                        // نسبة الصحة (100% - نسبة الوقت المنقضي)
                        let health = 100 - ((diffMinutes / MAX_LIFE_MINUTES) * 100);
                        
                        if(health <= 0) health = 0; // ميت

                        // تحديد الستايل بناءً على الصحة
                        let cardClass = "pulse-card";
                        let barColor = "var(--life)";
                        let opacity = health / 100;
                        let blur = (100 - health) / 10; // كل ما الصحة تقل، الضبابية تزيد

                        if (health < 30 && health > 0) {
                            cardClass += " critical"; // حالة خطرة (يهتز)
                            barColor = "var(--danger)";
                        } else if (health <= 0) {
                            cardClass += " dead"; // ميت
                            opacity = 0.3;
                        }

                        // منع الاختفاء التام عشان المستخدم يشوف إنه مات
                        if(opacity < 0.2) opacity = 0.2; 

                        const div = document.createElement('div');
                        div.className = cardClass;
                        div.style.opacity = opacity;
                        if(health < 100) div.style.filter = `blur(${blur}px)`;

                        const pic = p.pic || "https://cdn-icons-png.flaticon.com/512/149/149071.png";

                        div.innerHTML = `
                            <div class="health-bar-container">
                                <div class="health-bar" style="width:${health}%; background:${barColor};"></div>
                            </div>
                            <div class="pulse-body">
                                <div class="pulse-meta">
                                    <div class="pulse-avatar" style="background-image:url('${pic}')"></div>
                                    <div style="font-weight:bold; color:#fff;">${p.name}</div>
                                    <div style="margin-right:auto;">⚡ ${p.revives || 0}</div>
                                </div>
                                <div class="pulse-text">${p.text}</div>
                            </div>
                            ${health > 0 ? `<div class="revive-btn" onclick="revivePulse('${doc.id}')"><i class="fa-solid fa-bolt"></i></div>` : '<div style="text-align:center; padding:10px; color:red; font-weight:bold;">☠️ توقف النبض</div>'}
                        `;

                        container.appendChild(div);
                    });
                });
        }

        // 3. إنعاش النبض (CPR)
        function revivePulse(pid) {
            // تأثير صوتي للصدمة
            const audio = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-camera-shutter-click-1133.mp3'); // صوت يشبه الشحنة
            audio.play().catch(e=>{});
            if(navigator.vibrate) navigator.vibrate([50, 50, 50]); // هزاز قوي

            db.collection('pulse_posts').doc(pid).update({
                lastInteraction: firebase.firestore.FieldValue.serverTimestamp(), // إعادة تصفير الوقت
                revives: firebase.firestore.FieldValue.increment(1) // زيادة العداد
            });
        }

        // تحديث الصحة كل ثانية (عشان الشريط ينقص قدام عينك)
        setInterval(() => {
            // هذا التحديث مجرد بصري، الدالة loadPulses بتشتغل مع التغييرات الحقيقية
            // لكن لكي نرى الشريط يتحرك بسلاسة بدون ريفريش للداتابيز، ممكن نعمل ريلود خفيف
            // أو نعتمد على الـ Snapshot إنه سريع بما يكفي.
            // هنا سنعتمد على Snapshot الفايربيس لأنه Realtime.
        }, 1000);

    </script>
</body>
</html>
