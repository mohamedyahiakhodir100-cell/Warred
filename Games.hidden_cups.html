<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الكؤوس المخفية - وريد</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050508;
            --primary-color: #00C6FF;  
            --danger-color: #ff3366;
            --success-color: #00e676;
            --text-color: #eee;
            --gold: #FFD700;
            --cup-metal-dark: #0a0a12;
            --cup-metal-light: #2a2a3a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Cairo", sans-serif; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
        body { background: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- الهيدر --- */
        .game-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; background: rgba(5, 5, 8, 0.95);
            border-bottom: 1px solid rgba(0, 198, 255, 0.1); z-index: 100;
        }
        .back-btn { font-size: 20px; color: var(--text-color); cursor: pointer; transition: 0.2s; }
        .back-btn:active { transform: scale(0.9); }
        .header-title { font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 0 10px var(--primary-color); }
        .wallet { color: var(--gold); font-weight: bold; font-size: 14px; background: rgba(255,215,0,0.1); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--gold); }

        /* --- لوحة النتائج --- */
        .scoreboard {
            display: flex; justify-content: space-between; padding: 15px 30px; background: #0a0a0f;
            border-bottom: 1px solid #222; z-index: 100; position: relative;
        }
        .score-box { text-align: center; }
        .score-title { font-size: 12px; color: #aaa; font-weight: bold; }
        .score-value { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 0 10px rgba(0, 198, 255, 0.5); }
        .lives-value { font-size: 20px; font-weight: bold; color: var(--danger-color); letter-spacing: 2px; }

        /* --- منطقة اللعب (المسرح) --- */
        .game-stage {
            flex: 1; position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: flex-end;
            perspective: 1000px; /* لإعطاء عمق ثلاثي الأبعاد */
            background: radial-gradient(circle at center top, #1a1a2e 0%, #050508 80%);
        }

        /* تصميم المنضدة الاحترافي */
        .table-surface {
            position: absolute; bottom: 0; width: 120%; height: 40%;
            background: linear-gradient(to bottom, #111, #050505);
            transform: rotateX(60deg) translateY(50%); /* إمالة السطح ليعطي عمق */
            border-top: 3px solid rgba(0, 198, 255, 0.3);
            box-shadow: 0 -20px 50px rgba(0, 198, 255, 0.1), inset 0 50px 100px rgba(0,0,0,0.9);
            z-index: 1;
        }
        /* إضاءة نيون أسفل الطاولة */
        .table-glow {
            position: absolute; bottom: 0; width: 100%; height: 20px;
            background: var(--primary-color); filter: blur(30px); opacity: 0.4; z-index: 0;
        }

        /* حاوية الأكواب */
        .cups-container {
            position: relative; width: 340px; height: 250px; z-index: 10;
            display: flex; justify-content: center; align-items: flex-end;
            margin-bottom: 40px; /* رفع الحاوية عن أسفل الشاشة قليلاً */
        }

        /* تصميم الكوب الاحترافي (3D Metal Neon) */
        .cup {
            position: absolute; bottom: 0; width: 90px; height: 130px;
            /* تدرج لوني معدني معقد */
            background: linear-gradient(to right, 
                var(--cup-metal-dark) 0%, 
                var(--cup-metal-light) 40%, 
                var(--cup-metal-light) 60%, 
                var(--cup-metal-dark) 100%);
            border-radius: 10px 10px 40px 40px; /* شكل الكوب */
            cursor: pointer; z-index: 20; /* الأكواب فوق الكرة */
            /* تأثيرات واقعية */
            box-shadow: 
                inset 0 -10px 20px rgba(0,0,0,0.8), /* ضل داخلي */
                0 15px 25px rgba(0,0,0,0.6); /* ضل على الطاولة */
            
            /* حافة نيون سفلية */
            border-bottom: 3px solid var(--primary-color);

            /* أنيميشن سلس جداً للحركة والرفع */
            transition: left 0.4s cubic-bezier(0.45, 0.05, 0.55, 0.95), 
                        transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        /* حافة الكوب العلوية (Rim) */
        .cup::before {
            content: ''; position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
            width: 105%; height: 15px; border-radius: 50%;
            background: linear-gradient(to right, #333, #666, #333);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        /* حافة نيون علوية */
        .cup::after {
            content: ''; position: absolute; top: 0px; left: 5%; width: 90%; height: 3px;
            background: var(--primary-color); border-radius: 5px;
            box-shadow: 0 0 10px var(--primary-color), 0 0 20px var(--primary-color);
            opacity: 0.7;
        }

        /* تأثير رفع الكوب */
        .cup.lifted {
            transform: translateY(-100px) scale(1.05); /* يرتفع ويكبر قليلاً */
            box-shadow: 0 50px 40px rgba(0,0,0,0.4); /* الضل يبعد وينعم */
        }

        /* تصميم الكرة (طاقة نيون) */
        .ball {
            position: absolute; bottom: 20px; width: 40px; height: 40px;
            background: radial-gradient(circle at 30% 30%, #fff, var(--danger-color));
            border-radius: 50%; 
            box-shadow: 0 0 25px var(--danger-color), 0 0 40px var(--danger-color);
            z-index: 5; /* تحت الأكواب */
            transition: left 0.4s cubic-bezier(0.45, 0.05, 0.55, 0.95);
            /* نبض الكرة */
            animation: ballPulse 1.5s infinite alternate;
        }
        @keyframes ballPulse { from { filter: brightness(1); transform: scale(1); } to { filter: brightness(1.3); transform: scale(1.05); } }

        .instructions {
            position: absolute; top: 15%; width: 100%; text-align: center; z-index: 100;
            color: var(--gold); font-size: 22px; font-weight: 900; 
            text-shadow: 0 0 15px rgba(255,215,0,0.6);
            transition: 0.3s;
        }

        /* --- المودال --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 2000;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-card {
            background: #111; border: 1px solid #333; border-radius: 20px;
            padding: 30px 20px; width: 90%; max-width: 350px; text-align: center;
            transform: translateY(20px); transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-title { font-size: 28px; font-weight: 900; margin-bottom: 5px; }
        .modal-reward { font-size: 18px; font-weight: bold; margin-bottom: 25px; color: var(--gold); }
        
        .btn-restart {
            background: linear-gradient(45deg, var(--primary-color), #0055ff);
            color: #fff; border: none; padding: 12px 30px; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer; width: 100%;
        }
    </style>
</head>
<body>

    <div class="game-header">
        <i class="fa-solid fa-arrow-right back-btn" onclick="history.back()"></i>
        <div class="header-title">الكؤوس المخفية 🥤</div>
        <div class="wallet"><i class="fa-solid fa-coins"></i> <span id="walletScore">1500</span></div>
    </div>

    <div class="scoreboard">
        <div class="score-box">
            <div class="score-title">المستوى</div>
            <div class="score-value" id="levelDisplay">1</div>
        </div>
        <div class="score-box">
            <div class="score-title">المحاولات</div>
            <div class="lives-value" id="livesDisplay">❤️❤️❤️</div>
        </div>
    </div>

    <div class="game-stage">
        <div class="instructions" id="instructions">جاري التحضير...</div>
        
        <div class="cups-container">
            <div class="ball" id="ball"></div>
            
            <div class="cup" id="cup-0" onclick="checkCup(0)"></div>
            <div class="cup" id="cup-1" onclick="checkCup(1)"></div>
            <div class="cup" id="cup-2" onclick="checkCup(2)"></div>
        </div>

        <div class="table-surface"></div>
        <div class="table-glow"></div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div id="modalIcon" style="font-size: 60px; margin-bottom: 10px;">☠️</div>
            <div class="modal-title" id="modalTitle" style="color: var(--danger-color);">خدعتك!</div>
            <p style="color: #aaa; margin-bottom: 10px;">وصلت للمستوى <span id="finalScore" style="color:#fff; font-weight:bold;">1</span></p>
            <div class="modal-reward" id="modalReward">+0 عملة</div>
            <button class="btn-restart" onclick="initGame()">حاول مرة أخرى</button>
        </div>
    </div>

    <script>
        const cups = [document.getElementById('cup-0'), document.getElementById('cup-1'), document.getElementById('cup-2')];
        const ball = document.getElementById('ball');
        const instructions = document.getElementById('instructions');
        const levelDisplay = document.getElementById('levelDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const walletElement = document.getElementById('walletScore');

        // المسافات الدقيقة بين الأكواب لضمان التمركز
        const CUP_WIDTH = 90;
        const GAP = 25;
        const START_X = 10; // هامش أيسر
        // حساب المواقع الثلاثة بدقة
        const positions = [
            START_X, 
            START_X + CUP_WIDTH + GAP, 
            START_X + (CUP_WIDTH + GAP) * 2
        ];
        
        // مصفوفة لتتبع مكان كل كأس (cupPositions[0] هو مكان الكأس رقم 0 حالياً)
        let cupPositions = [0, 1, 2];
        let ballCupIndex = 1; // الكأس الذي يخفي الكرة
        
        let level = 1;
        let lives = 3;
        let isShuffling = false;
        let isWaitingForClick = false;

        const delay = ms => new Promise(res => setTimeout(res, ms));

        function initGame() {
            document.getElementById('resultModal').classList.remove('active');
            level = 1;
            lives = 3;
            updateUI();
            resetCupsPosition(true); // true تعني بدون أنيميشن في البداية
            
            setTimeout(startRound, 1000);
        }

        function updateUI() {
            levelDisplay.innerText = level;
            livesDisplay.innerText = "❤️".repeat(lives) + "🖤".repeat(3 - lives);
        }

        function resetCupsPosition(instant = false) {
            cupPositions = [0, 1, 2];
            cups.forEach((cup, i) => {
                if(instant) cup.style.transition = 'none';
                cup.style.left = `${positions[i]}px`;
                cup.classList.remove('lifted');
            });
            if(instant) ball.style.transition = 'none';
            // إعادة تفعيل الأنيميشن
            if(instant) setTimeout(() => {
                cups.forEach(cup => cup.style.transition = '');
                ball.style.transition = '';
            }, 50);
        }
        
        // دالة لوضع الكرة تحت الكأس المحدد بدقة
        function placeBallUnderCup(cupIndex) {
            let currentPosIndex = cupPositions[cupIndex]; // أين يقع هذا الكأس الآن (0 أو 1 أو 2)
            // حساب منتصف الكأس: موقعه + نصف عرضه - نصف عرض الكرة
            let ballX = positions[currentPosIndex] + (CUP_WIDTH / 2) - 20; 
            ball.style.left = `${ballX}px`;
        }

        async function startRound() {
            isWaitingForClick = false;
            instructions.innerText = "انتبه للكرة!";
            instructions.style.color = "var(--primary-color)";

            ballCupIndex = Math.floor(Math.random() * 3);
            placeBallUnderCup(ballCupIndex);
            
            await delay(500);

            // رفع الكأس لكشف الكرة
            cups[ballCupIndex].classList.add('lifted');
            await delay(1500);
            cups[ballCupIndex].classList.remove('lifted');
            await delay(800);
            
            instructions.innerText = "ركّز جيداً...";
            instructions.style.color = "var(--danger-color)";
            await shuffleCups();
        }

        async function shuffleCups() {
            isShuffling = true;
            // زيادة الصعوبة: عدد حركات أكثر وسرعة أكبر
            let shuffleCount = 5 + level;
            // السرعة: تبدأ من 0.5 ثانية وتقل (تسرع) حتى 0.2 ثانية
            let speed = Math.max(0.2, 0.5 - (level * 0.04)); 

            // تحديث سرعة الحركة في الـ CSS
            const transition = `left ${speed}s cubic-bezier(0.45, 0.05, 0.55, 0.95), transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)`;
            cups.forEach(cup => cup.style.transition = transition);
            ball.style.transition = `left ${speed}s cubic-bezier(0.45, 0.05, 0.55, 0.95)`;

            for (let i = 0; i < shuffleCount; i++) {
                // اختيار كأسين مختلفين للتبديل
                let idx1 = Math.floor(Math.random() * 3);
                let idx2 = (idx1 + 1 + Math.floor(Math.random() * 2)) % 3;

                // تبديل المواقع في المصفوفة
                let tempPos = cupPositions[idx1];
                cupPositions[idx1] = cupPositions[idx2];
                cupPositions[idx2] = tempPos;

                // تحريك الأكواب بصرياً للمواقع الجديدة
                cups[idx1].style.left = `${positions[cupPositions[idx1]]}px`;
                cups[idx2].style.left = `${positions[cupPositions[idx2]]}px`;

                // أهم جزء: تحريك الكرة مع الكأس الذي يحتويها
                if (idx1 === ballCupIndex || idx2 === ballCupIndex) {
                     placeBallUnderCup(ballCupIndex);
                }

                // انتظار انتهاء الحركة الحالية + توقف بسيط
                await delay(speed * 1000 + 80); 
            }

            isShuffling = false;
            isWaitingForClick = true;
            instructions.innerText = "أين الكرة؟ اختر كأساً";
            instructions.style.color = "var(--gold)";
        }

        async function checkCup(clickedIndex) {
            if (!isWaitingForClick || isShuffling) return;
            isWaitingForClick = false;

            cups[clickedIndex].classList.add('lifted');
            await delay(600);

            if (clickedIndex === ballCupIndex) {
                // فوز
                instructions.innerText = "أحسنت! إجابة صحيحة";
                instructions.style.color = "var(--success-color)";
                await delay(1000);
                cups[clickedIndex].classList.remove('lifted');
                await delay(500);
                level++;
                updateUI();
                startRound();
            } else {
                // خسارة
                instructions.innerText = "خطأ! الكرة هنا...";
                instructions.style.color = "var(--danger-color)";
                // كشف المكان الصحيح
                cups[ballCupIndex].classList.add('lifted');
                await delay(1500);
                cups[clickedIndex].classList.remove('lifted');
                cups[ballCupIndex].classList.remove('lifted');
                lives--;
                updateUI();
                
                if (lives <= 0) {
                    await delay(500);
                    gameOver();
                } else {
                    await delay(800);
                    resetCupsPosition();
                    await delay(500);
                    startRound();
                }
            }
        }

        function gameOver() {
            let reward = (level - 1) * 15; // 15 عملة لكل مستوى
            document.getElementById('finalScore').innerText = level - 1;
            document.getElementById('modalReward').innerText = `+${reward} عملة ذهبية`;
            
            let currentWallet = parseInt(walletElement.innerText);
            walletElement.innerText = currentWallet + reward;

            document.getElementById('resultModal').classList.add('active');
        }

        window.onload = initGame;
    </script>
</body>
</html>
