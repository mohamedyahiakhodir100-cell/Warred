<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الهدية اليومية - Wareed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #050505;
            --card-dark: #1A1A1D;
            --gold-light: #F2C94C;
            --gold-dark: #F2994A;
            --blue-light: #00C6FF;
            --text-color: #ffffff;
            --glow-color: rgba(242, 201, 76, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-color);
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* الهيدر */
        .gift-header {
            width: 100%;
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px;
            position: absolute; top: 0; z-index: 10;
        }
        .back-icon { font-size: 22px; cursor: pointer; color: #fff; padding: 10px; }

        /* 🔥 زر النقاط (يفتح القائمة المنبثقة) */
        .points-badge {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2);
            padding: 6px 15px; border-radius: 20px; font-weight: bold; font-size: 13px;
            display: flex; align-items: center; gap: 8px; cursor: pointer; backdrop-filter: blur(5px);
            transition: 0.3s;
        }
        .points-badge:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.2); }
        .points-count { color: var(--blue-light); font-size: 15px; font-weight: 900; }

        /* منطقة الصندوق */
        .gift-container {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            width: 100%; position: relative;
        }

        /* تأثيرات الإضاءة */
        .glow-effect {
            position: absolute; width: 300px; height: 300px;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
            border-radius: 50%; z-index: 0; animation: pulseGlow 3s infinite alternate;
        }
        @keyframes pulseGlow { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.2); opacity: 0.8; } }

        /* الصندوق */
        .chest-icon {
            font-size: 120px; color: var(--gold-light); z-index: 2;
            filter: drop-shadow(0 0 20px rgba(242, 153, 74, 0.5));
            transition: transform 0.3s; cursor: pointer;
        }
        .chest-icon.shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0) rotate(-5deg); } 20%, 80% { transform: translate3d(4px, 0, 0) rotate(5deg); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0) rotate(-5deg); } 40%, 60% { transform: translate3d(6px, 0, 0) rotate(5deg); } }

        /* النصوص والعداد */
        .gift-title { font-size: 26px; font-weight: 900; margin-top: 30px; z-index: 2; text-align: center; }
        .gift-desc { font-size: 13px; color: #aaa; margin-top: 10px; z-index: 2; text-align: center; max-width: 80%; }
        .timer-box { background: rgba(255,255,255,0.05); padding: 10px 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); font-family: monospace; font-size: 24px; font-weight: bold; color: var(--gold-light); margin-top: 20px; display: none; z-index: 2; }

        /* الأزرار السفلية */
        .action-area { width: 100%; padding: 30px 20px; z-index: 2; display: flex; flex-direction: column; gap: 15px; }
        .claim-btn { width: 100%; padding: 18px; border-radius: 20px; border: none; background: linear-gradient(135deg, var(--gold-dark), var(--gold-light)); color: #000; font-weight: 800; font-size: 18px; cursor: pointer; box-shadow: 0 0 20px rgba(242, 201, 76, 0.3); transition: transform 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .claim-btn:active { transform: scale(0.95); }
        .claim-btn:disabled { background: #333; color: #777; box-shadow: none; cursor: not-allowed; }

        .wallet-link-btn { width: 100%; padding: 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); color: #fff; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; }

        /* =========================================
           تصميم القائمة المنبثقة (Modal) للتحويل 
           ========================================= */
        .custom-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000;
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(8px); animation: fadeIn 0.3s;
        }

        .modal-box {
            background: var(--card-dark); width: 90%; max-width: 350px;
            border-radius: 24px; padding: 25px; text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transform: scale(0.9); animation: popIn 0.3s forwards;
        }

        .balance-row {
            display: flex; justify-content: space-between; margin-bottom: 20px;
            background: #000; padding: 10px; border-radius: 12px; border: 1px solid #333;
        }
        .bal-item { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .bal-val { font-weight: 900; font-size: 16px; }
        .bal-lbl { font-size: 10px; color: #aaa; }

        .exchange-input-group { position: relative; margin: 20px 0; }
        .ex-input {
            width: 100%; background: #252525; border: 2px solid #333; color: #fff;
            font-size: 24px; font-weight: bold; text-align: center; padding: 15px;
            border-radius: 15px; outline: none; transition: 0.3s;
        }
        .ex-input:focus { border-color: var(--blue-light); }
        .max-btn {
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
            background: rgba(0, 198, 255, 0.15); color: var(--blue-light);
            font-size: 11px; padding: 4px 8px; border-radius: 8px; cursor: pointer; font-weight: bold;
        }

        .convert-btn {
            width: 100%; background: linear-gradient(135deg, #00C6FF, #0072FF);
            color: #fff; font-weight: 800; padding: 12px; border-radius: 15px;
            border: none; cursor: pointer; margin-top: 10px;
        }
        .convert-btn:disabled { background: #333; color: #777; cursor: not-allowed; }

        /* نافذة الجائزة (لما تفتح الصندوق) */
        .reward-amount { font-size: 50px; font-weight: 900; color: var(--blue-light); text-shadow: 0 0 20px rgba(0, 198, 255, 0.5); margin: 15px 0; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { to { transform: scale(1); } }

    </style>
</head>
<body>

    <div class="gift-header">
        <i class="fa-solid fa-arrow-right back-icon" onclick="window.history.back()"></i>
        
        <div class="points-badge" onclick="openExchangeModal()">
            <i class="fa-solid fa-diamond" style="color: #00C6FF;"></i>
            <span class="points-count" id="headerPoints">0</span>
            <span style="font-size:10px; color:#aaa; margin-right:5px;">تحويل</span>
        </div>
    </div>

    <div class="gift-container">
        <div class="glow-effect"></div>
        
        <i id="chestIcon" class="fa-solid fa-gift chest-icon"></i>
        
        <div class="gift-title" id="statusTitle">هديتك اليومية!</div>
        <div class="gift-desc" id="statusDesc">افتح الصندوق واجمع النقاط، ثم اضغط على زر التحويل بالأعلى لتبديلها بعملات.</div>

        <div class="timer-box" id="countdown">00:00:00</div>
    </div>

    <div class="action-area">
        <button id="claimBtn" class="claim-btn" onclick="openGift()">
            <span>فتح الصندوق</span> <i class="fa-solid fa-box-open"></i>
        </button>

        <button class="wallet-link-btn" onclick="window.location.href='wallet.html'">
            <span>المحفظة</span> <i class="fa-solid fa-wallet"></i>
        </button>
    </div>

    <div class="custom-modal" id="rewardModal">
        <div class="modal-box">
            <i class="fa-solid fa-gift" style="font-size:40px; color: gold; margin-bottom:10px;"></i>
            <h3 style="color:#fff; margin:0;">مبروك!</h3>
            <div class="reward-amount" id="rewardValue">0</div>
            <p style="color:#aaa; font-size:13px;">نقطة تمت إضافتها لرصيدك</p>
            <button class="convert-btn" onclick="closeReward()">تم</button>
        </div>
    </div>

    <div class="custom-modal" id="exchangeModal">
        <div class="modal-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="margin:0;">💱 تحويل النقاط</h3>
                <i class="fa-solid fa-xmark" onclick="closeExchangeModal()" style="cursor:pointer; font-size:20px; color:#aaa;"></i>
            </div>

            <div class="balance-row">
                <div class="bal-item" style="border-left:1px solid #333;">
                    <span class="bal-val" style="color:var(--blue-light);" id="modalPoints">0</span>
                    <span class="bal-lbl">نقاطك</span>
                </div>
                <div class="bal-item">
                    <span class="bal-val" style="color:var(--gold-light);" id="modalCoins">0</span>
                    <span class="bal-lbl">عملاتك</span>
                </div>
            </div>

            <div style="font-size:12px; color:#aaa; margin-bottom:5px;">سعر الصرف: 100 نقطة = 1 عملة</div>

            <div class="exchange-input-group">
                <input type="number" id="convertInput" class="ex-input" placeholder="0" oninput="calculatePreview()">
                <div class="max-btn" onclick="setMaxPoints()">الكل</div>
            </div>

            <div style="margin-bottom:20px; font-size:14px;">
                ستحصل على: <span style="color:var(--gold-light); font-weight:bold; font-size:18px;" id="previewResult">0</span> عملة
            </div>

            <button id="confirmConvertBtn" class="convert-btn" onclick="confirmConversion()" disabled>تـحـويـل الآن</button>
        </div>
    </div>

    <audio id="chestSound" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>
    <audio id="cashSound" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>

    <div id="toast" style="position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #333; padding: 10px 20px; border-radius: 20px; transition:0.3s; opacity:0; color:#fff; border:1px solid #444; z-index:3000;">
        تم التحويل بنجاح ✅
    </div>

    <script>
        // إعدادات الوقت
        const COOLDOWN_TIME = 24 * 60 * 60 * 1000;
        const EXCHANGE_RATE = 100; // 100 نقطة = 1 عملة

        // متغيرات الرصيد
        let myPoints = parseInt(localStorage.getItem('nabd_points') || '0');
        let myCoins = parseInt(localStorage.getItem('nabd_balance') || '0');

        // عناصر الواجهة
        const headerPoints = document.getElementById('headerPoints');
        const claimBtn = document.getElementById('claimBtn');
        const countdownEl = document.getElementById('countdown');
        const chestIcon = document.getElementById('chestIcon');
        
        // تحديث العرض الأولي
        updateDisplay();
        checkEligibility();

        function updateDisplay() {
            headerPoints.innerText = myPoints.toLocaleString();
        }

        // --- دوال الهدية اليومية ---
        function checkEligibility() {
            const lastClaim = localStorage.getItem('nabd_last_gift_time');
            const now = Date.now();

            if (!lastClaim || (now - lastClaim) > COOLDOWN_TIME) {
                setReadyState();
            } else {
                setCooldownState(COOLDOWN_TIME - (now - lastClaim));
            }
        }

        function setReadyState() {
            claimBtn.disabled = false;
            claimBtn.style.background = "linear-gradient(135deg, var(--gold-dark), var(--gold-light))";
            claimBtn.innerHTML = `<span>فتح الصندوق</span> <i class="fa-solid fa-box-open"></i>`;
            countdownEl.style.display = 'none';
            chestIcon.style.opacity = "1";
        }

        function setCooldownState(remaining) {
            claimBtn.disabled = true;
            claimBtn.innerHTML = `<span>عد لاحقاً</span> <i class="fa-solid fa-clock"></i>`;
            countdownEl.style.display = 'block';
            chestIcon.style.opacity = "0.5";
            startTimer(remaining);
        }

        function openGift() {
            if (navigator.vibrate) navigator.vibrate(50);
            chestIcon.classList.add('shake');
            
            setTimeout(() => {
                chestIcon.classList.remove('shake');
                
                // هدية عشوائية (500 - 1500 نقطة)
                const reward = Math.floor(Math.random() * (1500 - 500 + 1)) + 500;
                
                // تحديث الرصيد
                myPoints += reward;
                localStorage.setItem('nabd_points', myPoints);
                localStorage.setItem('nabd_last_gift_time', Date.now());
                
                updateDisplay();
                
                // عرض المودال
                document.getElementById('rewardValue').innerText = reward;
                document.getElementById('rewardModal').style.display = 'flex';
                
                // تشغيل الصوت
                const sound = document.getElementById('chestSound');
                if(sound) { sound.volume=0.5; sound.play().catch(e=>{}); }

                setCooldownState(COOLDOWN_TIME);

            }, 1000);
        }

        function closeReward() {
            document.getElementById('rewardModal').style.display = 'none';
        }

        // --- دوال التحويل (Exchange Logic) ---
        function openExchangeModal() {
            // تحديث الأرقام داخل المودال
            document.getElementById('modalPoints').innerText = myPoints.toLocaleString();
            document.getElementById('modalCoins').innerText = myCoins.toLocaleString();
            
            document.getElementById('convertInput').value = '';
            document.getElementById('previewResult').innerText = '0';
            document.getElementById('confirmConvertBtn').disabled = true;
            
            document.getElementById('exchangeModal').style.display = 'flex';
        }

        function closeExchangeModal() {
            document.getElementById('exchangeModal').style.display = 'none';
        }

        function setMaxPoints() {
            document.getElementById('convertInput').value = myPoints;
            calculatePreview();
        }

        function calculatePreview() {
            const input = document.getElementById('convertInput');
            let val = parseInt(input.value);
            const btn = document.getElementById('confirmConvertBtn');

            if (isNaN(val) || val < 0) val = 0;
            
            // منع تجاوز الرصيد
            if (val > myPoints) {
                val = myPoints;
                input.value = myPoints;
            }

            const coinsResult = Math.floor(val / EXCHANGE_RATE);
            document.getElementById('previewResult').innerText = coinsResult.toLocaleString();

            if (coinsResult > 0) {
                btn.disabled = false;
                btn.style.opacity = '1';
            } else {
                btn.disabled = true;
                btn.style.opacity = '0.5';
            }
        }

        function confirmConversion() {
            const input = document.getElementById('convertInput');
            const amountPoints = parseInt(input.value);
            const amountCoins = Math.floor(amountPoints / EXCHANGE_RATE);

            if (amountPoints > myPoints || amountCoins <= 0) return;

            // الخصم والإضافة
            myPoints -= amountPoints;
            myCoins += amountCoins;

            // الحفظ
            localStorage.setItem('nabd_points', myPoints);
            localStorage.setItem('nabd_balance', myCoins);

            // تحديث الواجهة
            updateDisplay();
            closeExchangeModal();

            // تأثير النجاح
            const sound = document.getElementById('cashSound');
            if(sound) { sound.volume=0.5; sound.play().catch(e=>{}); }
            if(navigator.vibrate) navigator.vibrate([50, 100]);

            showToast(`تم تحويل ${amountPoints} نقطة إلى ${amountCoins} عملة`);
        }

        // أدوات مساعدة
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = '1';
            t.style.transform = 'translateX(-50%) translateY(0)';
            setTimeout(() => {
                t.style.opacity = '0';
                t.style.transform = 'translateX(-50%) translateY(100px)';
            }, 3000);
        }

        function startTimer(duration) {
            let timer = duration;
            const interval = setInterval(() => {
                const hours = Math.floor((timer % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timer % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timer % (1000 * 60)) / 1000);
                countdownEl.innerText = 
                    (hours < 10 ? "0" + hours : hours) + ":" +
                    (minutes < 10 ? "0" + minutes : minutes) + ":" +
                    (seconds < 10 ? "0" + seconds : seconds);

                if (timer <= 0) {
                    clearInterval(interval);
                    checkEligibility();
                }
                timer -= 1000;
            }, 1000);
        }
    </script>
</body>
</html>
