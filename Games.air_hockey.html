<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>هوكي الهواء - وريد</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050508;
            --primary-color: #00C6FF;  
            --danger-color: #ff3366;
            --text-color: #eee;
            --gold: #FFD700;
            --board-color: #0a0a14;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Cairo", sans-serif; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
        body { background: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: none; }

        /* --- الهيدر --- */
        .game-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; background: rgba(5, 5, 8, 0.95);
            border-bottom: 1px solid rgba(0, 198, 255, 0.1); z-index: 10;
        }
        .back-btn { font-size: 20px; color: var(--text-color); cursor: pointer; transition: 0.2s; }
        .back-btn:active { transform: scale(0.9); }
        .header-title { font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 0 10px var(--primary-color); }
        .wallet { color: var(--gold); font-weight: bold; font-size: 14px; background: rgba(255,215,0,0.1); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--gold); }

        /* --- لوحة النتائج --- */
        .scoreboard {
            display: flex; justify-content: space-around; padding: 15px; background: #0a0a0f;
            border-bottom: 1px solid #222; z-index: 10; font-size: 24px; font-weight: 900;
        }
        .score-ai { color: var(--danger-color); text-shadow: 0 0 10px rgba(255, 51, 102, 0.5); }
        .score-divider { color: #555; }
        .score-player { color: var(--primary-color); text-shadow: 0 0 10px rgba(0, 198, 255, 0.5); }

        /* --- منطقة اللعب --- */
        .game-area {
            flex: 1; display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #111, #000);
            padding: 15px; overflow: hidden;
        }
        
        .board-container {
            position: relative; width: 100%; max-width: 400px; height: 100%; max-height: 600px;
            background: var(--board-color); border: 4px solid #333; border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 198, 255, 0.1), inset 0 0 20px rgba(0,0,0,0.8);
        }
        
        canvas { display: block; width: 100%; height: 100%; border-radius: 16px; }

        .instructions {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100%; text-align: center; color: rgba(255,255,255,0.3);
            font-size: 18px; font-weight: bold; pointer-events: none;
            animation: fadeOut 2s forwards; animation-delay: 2s;
        }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

        /* --- المودال --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 2000;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-card {
            background: #111; border: 1px solid #333; border-radius: 20px;
            padding: 30px 20px; width: 90%; max-width: 350px; text-align: center;
            transform: translateY(20px); transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-title { font-size: 28px; font-weight: 900; margin-bottom: 5px; }
        .modal-reward { font-size: 18px; font-weight: bold; margin-bottom: 25px; color: var(--gold); }
        
        .btn-restart {
            background: linear-gradient(45deg, var(--primary-color), #0055ff);
            color: #fff; border: none; padding: 12px 30px; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer; width: 100%;
        }
        .btn-restart:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="game-header">
        <i class="fa-solid fa-arrow-right back-btn" onclick="history.back()"></i>
        <div class="header-title">هوكي الهواء 🏒</div>
        <div class="wallet"><i class="fa-solid fa-coins"></i> <span id="walletScore">1500</span></div>
    </div>

    <div class="scoreboard">
        <div class="score-ai" id="scoreAI">0</div>
        <div class="score-divider">-</div>
        <div class="score-player" id="scorePlayer">0</div>
    </div>

    <div class="game-area">
        <div class="board-container">
            <canvas id="gameCanvas"></canvas>
            <div class="instructions" id="instructions">اسحب مضربك الأزرق للعب!</div>
        </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div id="modalIcon" style="font-size: 60px; margin-bottom: 10px;">🏆</div>
            <div class="modal-title" id="modalTitle">فزت!</div>
            <p style="color: #aaa; margin-bottom: 10px;" id="modalDesc">أنت بطل الهوكي</p>
            <div class="modal-reward" id="modalReward">+70 عملة</div>
            <button class="btn-restart" onclick="initGame()">مباراة جديدة</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scorePlayerEl = document.getElementById('scorePlayer');
        const scoreAIEl = document.getElementById('scoreAI');
        const walletElement = document.getElementById('walletScore');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let animationId;
        let isGameOver = false;
        let scorePlayer = 0;
        let scoreAI = 0;
        const WIN_SCORE = 5;

        // إعدادات الملعب
        const goalWidth = canvas.width * 0.4;
        const goalX = (canvas.width - goalWidth) / 2;

        // الكائنات
        const puck = {
            x: canvas.width / 2, y: canvas.height / 2,
            radius: 12, vx: 0, vy: 0, speedLimit: 15,
            color: '#FFD700'
        };

        const player = {
            x: canvas.width / 2, y: canvas.height - 50,
            radius: 25, color: '#00C6FF', isDragging: false
        };

        const ai = {
            x: canvas.width / 2, y: 50,
            radius: 25, color: '#ff3366', speed: 4
        };

        function initGame() {
            document.getElementById('resultModal').classList.remove('active');
            scorePlayer = 0;
            scoreAI = 0;
            updateScore();
            isGameOver = false;
            resetPuck();
            
            cancelAnimationFrame(animationId);
            gameLoop();
        }

        function resetPuck() {
            puck.x = canvas.width / 2;
            puck.y = canvas.height / 2;
            puck.vx = 0;
            puck.vy = 0;
            
            player.x = canvas.width / 2;
            player.y = canvas.height - 50;
            
            ai.x = canvas.width / 2;
            ai.y = 50;
        }

        function updateScore() {
            scorePlayerEl.innerText = scorePlayer;
            scoreAIEl.innerText = scoreAI;
        }

        // --- دوال الرسم ---
        function drawGlow(color, blur) {
            ctx.shadowBlur = blur;
            ctx.shadowColor = color;
        }

        function drawBoard() {
            // خط المنتصف
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // دائرة المنتصف
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 40, 0, Math.PI * 2);
            ctx.stroke();

            // الأهداف (Goals)
            ctx.lineWidth = 5;
            
            // هدف الكمبيوتر (أحمر)
            ctx.beginPath();
            ctx.moveTo(goalX, 0); ctx.lineTo(goalX + goalWidth, 0);
            ctx.strokeStyle = 'var(--danger-color)';
            drawGlow('var(--danger-color)', 15);
            ctx.stroke();
            
            // هدف اللاعب (أزرق)
            ctx.beginPath();
            ctx.moveTo(goalX, canvas.height); ctx.lineTo(goalX + goalWidth, canvas.height);
            ctx.strokeStyle = 'var(--primary-color)';
            drawGlow('var(--primary-color)', 15);
            ctx.stroke();
            
            ctx.shadowBlur = 0; // Reset
        }

        function drawMallet(x, y, radius, color) {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = color;
            drawGlow(color, 15);
            ctx.fill();
            
            // دائرة داخلية
            ctx.beginPath();
            ctx.arc(x, y, radius - 10, 0, Math.PI * 2);
            ctx.fillStyle = '#111';
            ctx.shadowBlur = 0;
            ctx.fill();
        }

        function drawPuck() {
            ctx.beginPath();
            ctx.arc(puck.x, puck.y, puck.radius, 0, Math.PI * 2);
            ctx.fillStyle = puck.color;
            drawGlow(puck.color, 10);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // --- المنطق والفيزياء ---
        function update() {
            if (isGameOver) return;

            // حركة الذكاء الاصطناعي (AI)
            // يتجه نحو الكرة أفقياً، ويرجع لمكانه لو الكرة في نصف اللاعب
            if (puck.y < canvas.height / 2) {
                if (ai.x < puck.x - 10) ai.x += ai.speed;
                else if (ai.x > puck.x + 10) ai.x -= ai.speed;
                // يتقدم قليلاً لضرب الكرة
                if (ai.y < puck.y - 10 && ai.y < canvas.height / 2 - ai.radius) ai.y += ai.speed;
            } else {
                // العودة للمركز
                if (ai.x < canvas.width / 2) ai.x += ai.speed;
                else if (ai.x > canvas.width / 2) ai.x -= ai.speed;
                if (ai.y > 50) ai.y -= ai.speed;
            }

            // حدود AI
            if (ai.x < ai.radius) ai.x = ai.radius;
            if (ai.x > canvas.width - ai.radius) ai.x = canvas.width - ai.radius;

            // حركة الكرة
            puck.x += puck.vx;
            puck.y += puck.vy;

            // احتكاك لتبطيء الكرة تدريجياً
            puck.vx *= 0.99;
            puck.vy *= 0.99;

            // الاصطدام بالجدران الجانبية
            if (puck.x - puck.radius < 0) { puck.x = puck.radius; puck.vx *= -1; }
            if (puck.x + puck.radius > canvas.width) { puck.x = canvas.width - puck.radius; puck.vx *= -1; }

            // الاصطدام بالجدران العلوية والسفلية (خارج منطقة الهدف)
            if (puck.y - puck.radius < 0) {
                if (puck.x > goalX && puck.x < goalX + goalWidth) {
                    scorePlayer++; checkWin();
                } else {
                    puck.y = puck.radius; puck.vy *= -1;
                }
            }
            if (puck.y + puck.radius > canvas.height) {
                if (puck.x > goalX && puck.x < goalX + goalWidth) {
                    scoreAI++; checkWin();
                } else {
                    puck.y = canvas.height - puck.radius; puck.vy *= -1;
                }
            }

            // تحديد أقصى سرعة للكرة
            let currentSpeed = Math.hypot(puck.vx, puck.vy);
            if (currentSpeed > puck.speedLimit) {
                puck.vx = (puck.vx / currentSpeed) * puck.speedLimit;
                puck.vy = (puck.vy / currentSpeed) * puck.speedLimit;
            }

            // تصادم الكرة مع المضارب
            checkCollision(player, puck);
            checkCollision(ai, puck);
        }

        function checkCollision(mallet, p) {
            let dx = p.x - mallet.x;
            let dy = p.y - mallet.y;
            let distance = Math.hypot(dx, dy);

            if (distance < mallet.radius + p.radius) {
                // حساب زاوية التصادم
                let angle = Math.atan2(dy, dx);
                let force = 4; // قوة الدفع

                // حساب سرعة المضرب (لو اللاعب بيحرك المضرب بسرعة)
                let malletSpeed = 0;
                if(mallet === player && player.isDragging) { force = 8; }
                
                // إبعاد الكرة عن المضرب عشان متلزقش فيه
                p.x = mallet.x + Math.cos(angle) * (mallet.radius + p.radius);
                p.y = mallet.y + Math.sin(angle) * (mallet.radius + p.radius);

                // إضافة السرعة للكرة
                p.vx = Math.cos(angle) * force + (p.vx * -0.5);
                p.vy = Math.sin(angle) * force + (p.vy * -0.5);
            }
        }

        function checkWin() {
            updateScore();
            if (scorePlayer >= WIN_SCORE || scoreAI >= WIN_SCORE) {
                isGameOver = true;
                setTimeout(endGame, 500);
            } else {
                resetPuck();
            }
        }

        function endGame() {
            const modal = document.getElementById('resultModal');
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDesc');
            const icon = document.getElementById('modalIcon');
            const reward = document.getElementById('modalReward');

            if (scorePlayer >= WIN_SCORE) {
                title.innerText = "فزت!";
                title.style.color = "var(--primary-color)";
                desc.innerText = "أنت بطل الهوكي الحقيقي";
                icon.innerText = "🥇";
                reward.innerText = "+70 عملة ذهبية";
                reward.style.display = "block";
                
                let currentWallet = parseInt(walletElement.innerText);
                walletElement.innerText = currentWallet + 70;
            } else {
                title.innerText = "خسرت!";
                title.style.color = "var(--danger-color)";
                desc.innerText = "حاول مرة أخرى لتطوير مهاراتك";
                icon.innerText = "💔";
                reward.style.display = "none";
            }

            modal.classList.add('active');
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBoard();
            drawPuck();
            drawMallet(player.x, player.y, player.radius, player.color);
            drawMallet(ai.x, ai.y, ai.radius, ai.color);
        }

        function gameLoop() {
            update();
            draw();
            if(!isGameOver) animationId = requestAnimationFrame(gameLoop);
        }

        // --- التحكم باللمس والماوس ---
        function getPos(e) {
            let rect = canvas.getBoundingClientRect();
            let x = e.touches ? e.touches[0].clientX : e.clientX;
            let y = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: x - rect.left, y: y - rect.top };
        }

        function movePlayer(e) {
            if (isGameOver) return;
            e.preventDefault();
            let pos = getPos(e);
            
            // حدود حركة اللاعب (النصف السفلي فقط)
            if (pos.y < canvas.height / 2 + player.radius) pos.y = canvas.height / 2 + player.radius;
            if (pos.y > canvas.height - player.radius) pos.y = canvas.height - player.radius;
            if (pos.x < player.radius) pos.x = player.radius;
            if (pos.x > canvas.width - player.radius) pos.x = canvas.width - player.radius;

            player.x = pos.x;
            player.y = pos.y;
            player.isDragging = true;
        }

        canvas.addEventListener('touchstart', movePlayer, {passive: false});
        canvas.addEventListener('touchmove', movePlayer, {passive: false});
        canvas.addEventListener('touchend', () => player.isDragging = false);

        canvas.addEventListener('mousedown', movePlayer);
        canvas.addEventListener('mousemove', (e) => { if(e.buttons === 1) movePlayer(e); });
        canvas.addEventListener('mouseup', () => player.isDragging = false);

        window.onload = initGame;
    </script>
</body>
</html>
