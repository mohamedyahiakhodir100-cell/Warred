<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الجلاد - وريد</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050508;
            --primary-color: #00C6FF;  
            --danger-color: #ff3366;
            --success-color: #00e676;
            --text-color: #eee;
            --gold: #FFD700;
            --panel-bg: #0a0a10;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Cairo", sans-serif; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
        body { background: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- الهيدر --- */
        .game-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; background: rgba(5, 5, 8, 0.95);
            border-bottom: 1px solid rgba(0, 198, 255, 0.1); z-index: 10;
        }
        .back-btn { font-size: 20px; color: var(--text-color); cursor: pointer; transition: 0.2s; }
        .back-btn:active { transform: scale(0.9); }
        .header-title { font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 0 10px var(--primary-color); }
        .wallet { color: var(--gold); font-weight: bold; font-size: 14px; background: rgba(255,215,0,0.1); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--gold); }

        /* --- منطقة الرسم (Canvas) والتلميح --- */
        .drawing-area {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px; flex: 1; background: radial-gradient(circle at top, #111, var(--bg-color));
            position: relative;
        }
        
        .hint-box {
            background: rgba(0, 198, 255, 0.05); border: 1px solid rgba(0, 198, 255, 0.3);
            padding: 8px 20px; border-radius: 20px; color: var(--primary-color);
            font-size: 14px; font-weight: bold; margin-bottom: 10px;
            box-shadow: 0 0 15px rgba(0, 198, 255, 0.1); text-align: center; max-width: 90%;
        }

        canvas {
            background: transparent; max-width: 200px; height: 220px;
        }

        /* --- الكلمة المخفية --- */
        .word-display {
            display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
            padding: 15px; margin-bottom: 5px; direction: rtl;
        }
        .letter-box {
            width: 40px; height: 50px; background: var(--panel-bg); border-bottom: 3px solid #444;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 900; color: #fff; text-transform: uppercase;
            transition: 0.3s;
        }
        .letter-box.revealed {
            border-color: var(--success-color); color: var(--success-color);
            text-shadow: 0 0 10px var(--success-color); animation: popIn 0.3s ease;
        }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* --- لوحة المفاتيح --- */
        .keyboard-container {
            background: var(--panel-bg); padding: 15px 10px 25px;
            border-top: 1px solid #222; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; direction: rtl;
        }
        .key-btn {
            background: #16161a; border: 1px solid #333; border-radius: 8px;
            width: calc(100% / 8 - 8px); height: 45px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: bold; color: #eee; cursor: pointer;
            transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .key-btn:active { transform: scale(0.9); }
        .key-btn.correct { background: rgba(0, 230, 118, 0.1); border-color: var(--success-color); color: var(--success-color); pointer-events: none; }
        .key-btn.wrong { background: rgba(255, 51, 102, 0.05); border-color: #333; color: #555; pointer-events: none; opacity: 0.5; }

        /* --- المودال --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 2000;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-card {
            background: #111; border: 1px solid #333; border-radius: 20px;
            padding: 30px 20px; width: 90%; max-width: 350px; text-align: center;
            transform: translateY(20px); transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-title { font-size: 28px; font-weight: 900; margin-bottom: 5px; }
        .modal-word { font-size: 20px; font-weight: bold; color: #aaa; margin-bottom: 15px; }
        .modal-reward { font-size: 18px; font-weight: bold; margin-bottom: 25px; color: var(--gold); }
        
        .btn-restart {
            background: linear-gradient(45deg, var(--primary-color), #0055ff);
            color: #fff; border: none; padding: 12px 30px; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer; width: 100%;
        }
        .btn-restart:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="game-header">
        <i class="fa-solid fa-arrow-right back-btn" onclick="history.back()"></i>
        <div class="header-title">الجلاد 📝</div>
        <div class="wallet"><i class="fa-solid fa-coins"></i> <span id="walletScore">1500</span></div>
    </div>

    <div class="drawing-area">
        <div class="hint-box" id="hintDisplay">تلميح: جاري التحميل...</div>
        <canvas id="hangmanCanvas" width="200" height="220"></canvas>
    </div>

    <div class="word-display" id="wordDisplay">
        </div>

    <div class="keyboard-container" id="keyboard">
        </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div id="modalIcon" style="font-size: 60px; margin-bottom: 10px;">🏆</div>
            <div class="modal-title" id="modalTitle">أنقذته!</div>
            <div class="modal-word" id="modalWord">الكلمة كانت: كذا</div>
            <div class="modal-reward" id="modalReward">+35 عملة</div>
            <button class="btn-restart" onclick="initGame()">لعب دور جديد</button>
        </div>
    </div>

    <script>
        const wordsDatabase = [
            { word: "فلسطين", hint: "دولة عربية عاصمتها القدس" },
            { word: "مصر", hint: "أم الدنيا وفيها الأهرامات" },
            { word: "انترنت", hint: "شبكة معلومات عالمية" },
            { word: "برمجة", hint: "لغة التخاطب مع الكمبيوتر" },
            { word: "يوتيوب", hint: "أشهر منصة لمشاهدة الفيديوهات" },
            { word: "شمس", hint: "نجم يمدنا بالحرارة والضوء" },
            { word: "اسد", hint: "ملك الغابة" },
            { word: "تفاحة", hint: "فاكهة سقطت على رأس نيوتن" },
            { word: "سيف", hint: "سلاح أبيض قديم للقتال" },
            { word: "قهوة", hint: "مشروب أساسي لضبط المزاج في الصباح" },
            { word: "بيتزا", hint: "أكلة إيطالية شهيرة دائرية الشكل" },
            { word: "طائرة", hint: "وسيلة نقل تطير في السماء" }
        ];

        const arabicAlphabet = "ابتثجحخدذرزسشصضطظعغفقكلمنهويأإآؤئءة".split("");

        let currentWord = "";
        let currentHint = "";
        let guessedLetters = [];
        let mistakes = 0;
        const MAX_MISTAKES = 6;
        let isGameOver = false;

        const canvas = document.getElementById('hangmanCanvas');
        const ctx = canvas.getContext('2d');
        const wordDisplay = document.getElementById('wordDisplay');
        const keyboard = document.getElementById('keyboard');
        const hintDisplay = document.getElementById('hintDisplay');
        const walletElement = document.getElementById('walletScore');

        function initGame() {
            document.getElementById('resultModal').classList.remove('active');
            
            // اختيار كلمة عشوائية
            const randomIndex = Math.floor(Math.random() * wordsDatabase.length);
            currentWord = wordsDatabase[randomIndex].word;
            currentHint = wordsDatabase[randomIndex].hint;
            
            guessedLetters = [];
            mistakes = 0;
            isGameOver = false;

            hintDisplay.innerText = `💡 تلميح: ${currentHint}`;

            renderWord();
            renderKeyboard();
            drawHangman();
        }

        function renderWord() {
            wordDisplay.innerHTML = '';
            for (let i = 0; i < currentWord.length; i++) {
                const char = currentWord[i];
                const box = document.createElement('div');
                box.className = 'letter-box';
                
                if (char === ' ') {
                    box.style.border = 'none';
                    box.style.background = 'transparent';
                } else if (guessedLetters.includes(char)) {
                    box.innerText = char;
                    box.classList.add('revealed');
                }
                
                wordDisplay.appendChild(box);
            }
        }

        function renderKeyboard() {
            keyboard.innerHTML = '';
            arabicAlphabet.forEach(letter => {
                const btn = document.createElement('div');
                btn.className = 'key-btn';
                btn.innerText = letter;
                btn.onclick = () => handleGuess(letter, btn);
                keyboard.appendChild(btn);
            });
        }

        function handleGuess(letter, btnElement) {
            if (isGameOver || guessedLetters.includes(letter)) return;

            guessedLetters.push(letter);

            if (currentWord.includes(letter)) {
                // تخمين صحيح
                btnElement.classList.add('correct');
                renderWord();
                checkWin();
            } else {
                // تخمين خاطئ
                btnElement.classList.add('wrong');
                mistakes++;
                drawHangman();
                
                // تأثير اهتزاز خفيف للشاشة
                document.body.style.transform = "translateX(5px)";
                setTimeout(() => document.body.style.transform = "translateX(-5px)", 50);
                setTimeout(() => document.body.style.transform = "translateX(0)", 100);

                if (mistakes >= MAX_MISTAKES) {
                    gameOver(false);
                }
            }
        }

        // --- رسم المشنقة والجلاد بتقنية النيون ---
        function drawGlow(color, blur) {
            ctx.shadowBlur = blur;
            ctx.shadowColor = color;
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
        }

        function drawHangman() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 4;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            // لون المشنقة الثابت
            drawGlow('#00C6FF', 10);
            
            // القاعدة والعمود
            ctx.beginPath();
            ctx.moveTo(20, 200); ctx.lineTo(120, 200); // قاعدة
            ctx.moveTo(70, 200); ctx.lineTo(70, 20);   // عمود
            ctx.moveTo(70, 20); ctx.lineTo(150, 20);   // سقف
            ctx.moveTo(150, 20); ctx.lineTo(150, 40);  // حبل
            ctx.stroke();

            // لون الجلاد (يتغير للأحمر في آخر مرحلة)
            let manColor = mistakes >= MAX_MISTAKES ? '#ff3366' : '#FFD700';
            drawGlow(manColor, 12);

            if (mistakes >= 1) { // الرأس
                ctx.beginPath();
                ctx.arc(150, 60, 20, 0, Math.PI * 2);
                ctx.stroke();
            }
            if (mistakes >= 2) { // الجسم
                ctx.beginPath();
                ctx.moveTo(150, 80); ctx.lineTo(150, 140);
                ctx.stroke();
            }
            if (mistakes >= 3) { // الذراع الأيسر
                ctx.beginPath();
                ctx.moveTo(150, 90); ctx.lineTo(120, 120);
                ctx.stroke();
            }
            if (mistakes >= 4) { // الذراع الأيمن
                ctx.beginPath();
                ctx.moveTo(150, 90); ctx.lineTo(180, 120);
                ctx.stroke();
            }
            if (mistakes >= 5) { // الساق اليسرى
                ctx.beginPath();
                ctx.moveTo(150, 140); ctx.lineTo(130, 180);
                ctx.stroke();
            }
            if (mistakes >= 6) { // الساق اليمنى
                ctx.beginPath();
                ctx.moveTo(150, 140); ctx.lineTo(170, 180);
                ctx.stroke();
                
                // رسم عيون ميتة (X X)
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(142, 55); ctx.lineTo(148, 61);
                ctx.moveTo(148, 55); ctx.lineTo(142, 61);
                ctx.moveTo(152, 55); ctx.lineTo(158, 61);
                ctx.moveTo(158, 55); ctx.lineTo(152, 61);
                ctx.stroke();
            }
        }

        function checkWin() {
            let isWon = true;
            for (let i = 0; i < currentWord.length; i++) {
                if (currentWord[i] !== ' ' && !guessedLetters.includes(currentWord[i])) {
                    isWon = false;
                    break;
                }
            }
            if (isWon) {
                setTimeout(() => gameOver(true), 500);
            }
        }

        function gameOver(isWin) {
            isGameOver = true;
            const modal = document.getElementById('resultModal');
            const icon = document.getElementById('modalIcon');
            const title = document.getElementById('modalTitle');
            const wordDisplay = document.getElementById('modalWord');
            const reward = document.getElementById('modalReward');

            wordDisplay.innerText = `الكلمة: ${currentWord}`;

            if (isWin) {
                icon.innerText = "🎉";
                title.innerText = "أنقذته!";
                title.style.color = "var(--primary-color)";
                reward.innerText = "+35 عملة ذهبية";
                reward.style.display = "block";
                
                let currentWallet = parseInt(walletElement.innerText);
                walletElement.innerText = currentWallet + 35;
            } else {
                icon.innerText = "☠️";
                title.innerText = "تم الشنق!";
                title.style.color = "var(--danger-color)";
                reward.style.display = "none";
                
                // إظهار الكلمة بلون أحمر
                const boxes = document.getElementById('wordDisplay').children;
                for (let i = 0; i < currentWord.length; i++) {
                    if (currentWord[i] !== ' ' && !guessedLetters.includes(currentWord[i])) {
                        boxes[i].innerText = currentWord[i];
                        boxes[i].style.color = "var(--danger-color)";
                        boxes[i].style.borderColor = "var(--danger-color)";
                    }
                }
            }

            setTimeout(() => modal.classList.add('active'), 600);
        }

        window.onload = initGame;
    </script>
</body>
</html>
