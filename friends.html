<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NABD - الأصدقاء</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/locale/ar.min.js"></script>
    
    <style>
        /* === إعدادات عامة === */
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --bg-color: #0d0d0f;
            --card-color: #161616;
            --primary-solid: #5D5FEF;
            --primary-gradient: linear-gradient(135deg, #5D5FEF, #7879F1);
            --text-color: #eee;
            --secondary-text: #aaa;
            --border-color: #2a2a2a;
            --danger-color: #ff453a;
            --success-color: #4ade80; /* لون الأونلاين الجديد من كود الدردشة */
            --gold-color: #ffb400;
            --verified-color: #3897f0;
            --input-bg: #202022;
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            font-family: "Cairo", sans-serif; 
            padding-bottom: 90px; 
            overflow-x: hidden; 
            overscroll-behavior-y: contain;
        }
        
        /* === مؤشر السحب للتحديث === */
        #pullIndicator {
            position: fixed; top: -50px; left: 0; width: 100%; height: 50px;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary-solid); font-size: 20px;
            transition: top 0.3s ease; z-index: 99;
        }
        #pullIndicator.visible { top: 60px; }
        #pullIcon.rotate { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* === Header === */
        .header { 
            display: flex; align-items: center; padding: 15px 20px; 
            background: rgba(13, 13, 15, 0.95); 
            border-bottom: 1px solid var(--border-color); 
            position: sticky; top: 0; z-index: 100; 
            backdrop-filter: blur(10px); 
        }
        .header h2 { margin: 0; font-size: 18px; flex: 1; text-align: center; font-weight: 700; }
        .back-btn { font-size: 20px; cursor: pointer; color: var(--primary-solid); padding: 5px; transition: 0.2s; }
        .back-btn:active { transform: scale(0.9); }

        .header-req-btn { position: relative; cursor: pointer; padding: 5px; }
        .requests-badge { 
            background: var(--danger-color); color: white; 
            padding: 2px 6px; border-radius: 10px; 
            font-size: 10px; font-weight: bold;
            position: absolute; top: 0; right: 0;
            display: none; animation: pulse 1.5s infinite;
        }

        /* === Search & Filter === */
        .top-controls { 
            padding: 15px; position: sticky; top: 60px; z-index: 90; 
            background: var(--bg-color); border-bottom: 1px solid var(--border-color);
        }
        
        .search-box {
            width: 100%; background: var(--input-bg); 
            border: 1px solid var(--border-color);
            color: #fff; padding: 0 15px; height: 45px; border-radius: 12px;
            font-family: "Cairo"; display: flex; align-items: center; gap: 10px;
            margin-bottom: 15px; transition: 0.3s;
        }
        .search-box:focus-within { border-color: var(--primary-solid); box-shadow: 0 0 10px rgba(93, 95, 239, 0.2); }
        .search-box input { background: transparent; border: none; color: white; width: 100%; height: 100%; font-size: 14px; font-weight: 600; font-family: "Cairo"; }

        .filter-chips { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .filter-chips::-webkit-scrollbar { display: none; }
        
        .chip {
            padding: 8px 16px; background: var(--card-color); border: 1px solid var(--border-color);
            border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--secondary-text);
            cursor: pointer; white-space: nowrap; transition: 0.3s; display: flex; align-items: center; gap: 6px;
        }
        .chip.active { 
            background: var(--primary-solid); color: #fff; border-color: var(--primary-solid); 
            box-shadow: 0 4px 15px rgba(93, 95, 239, 0.3);
        }
        .chip span { font-size: 11px; opacity: 0.8; background: rgba(0,0,0,0.2); padding: 1px 6px; border-radius: 8px; }

        /* === Friend List === */
        .friend-list { padding: 15px; min-height: 400px; }
        .list-title { font-size: 13px; color: var(--secondary-text); margin-bottom: 10px; font-weight: bold; display: flex; justify-content: space-between; }

        .friend-item { 
            display: flex; align-items: center; gap: 15px;
            padding: 12px; border-bottom: 1px solid var(--border-color); 
            background: var(--card-color); margin-bottom: 10px; 
            border-radius: 16px; width: 100%; transition: 0.2s; position: relative;
            animation: fadeInUp 0.4s ease forwards; opacity: 0; transform: translateY(10px);
        }
        .friend-item:active { transform: scale(0.98); background: #222; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        .friend-avatar { 
            width: 55px; height: 55px; min-width: 55px; min-height: 55px;
            border-radius: 50%; background: #333; background-size: cover; background-position: center; 
            display: grid; place-items: center; border: 2px solid #333;
            position: relative; overflow: visible !important;
        }

        /* لمبة الأونلاين الجديدة (نفس ستايل الدردشة) */
        .online-dot {
            position: absolute; bottom: 0; right: 0;
            width: 14px; height: 14px; 
            background-color: var(--success-color);
            border: 2px solid var(--card-color); 
            border-radius: 50%;
            display: none; 
            z-index: 5;
            box-shadow: 0 0 5px rgba(74, 222, 128, 0.8);
        }
        .online-dot.active { display: block; }
        
        .friend-info { flex: 1; overflow: hidden; }
        .friend-name-row { display: flex; align-items: center; gap: 6px; }
        .friend-name { font-size: 15px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .verified-badge { color: var(--verified-color); font-size: 14px; }
        .fav-star { font-size: 12px; color: var(--gold-color); display: none; filter: drop-shadow(0 0 5px rgba(255, 180, 0, 0.5)); }
        .fav-star.active { display: block; }

        .friend-status { font-size: 11px; color: var(--secondary-text); margin-top: 4px; display: flex; align-items: center; gap: 4px; font-weight: 600; }
        .friend-status.online { color: var(--success-color); font-weight: bold; }
        
        .item-actions { display: flex; gap: 8px; }
        .icon-btn { 
            width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; 
            color: var(--secondary-text); background: rgba(255,255,255,0.05); 
            cursor: pointer; transition: 0.2s; border: 1px solid transparent;
        }
        .icon-btn:active { transform: scale(0.9); }
        .icon-btn.chat-quick { color: var(--primary-solid); background: rgba(93, 95, 239, 0.1); }
        .icon-btn.chat-quick:hover { border-color: var(--primary-solid); box-shadow: 0 0 10px rgba(93, 95, 239, 0.2); }

        /* === Skeleton Loading === */
        .skeleton-item { display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 10px; background: var(--card-color); border-radius: 16px; border-bottom: 1px solid var(--border-color); }
        .sk-avatar { width: 55px; height: 55px; border-radius: 50%; background: #222; animation: pulse 1.5s infinite; }
        .sk-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .sk-line { height: 10px; background: #222; border-radius: 5px; animation: pulse 1.5s infinite; }
        .w-50 { width: 50%; } .w-30 { width: 30%; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* === Bottom Action Sheet === */
        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 998; display: none; backdrop-filter: blur(3px); }
        .sheet-overlay.active { display: block; }
        .action-sheet { 
            position: fixed; bottom: -100%; left: 0; width: 100%; 
            background: #1c1c1e; border-radius: 24px 24px 0 0; z-index: 999; 
            transition: bottom 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); 
            padding-bottom: 30px; border-top: 1px solid #333; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }
        .action-sheet.active { bottom: 0; }
        .sheet-handle { width: 40px; height: 5px; background: #444; border-radius: 10px; margin: 12px auto; }
        .sheet-header { text-align: center; padding: 10px 20px 20px; border-bottom: 1px solid #2a2a2a; }
        .sheet-avatar { 
            width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 12px; 
            background-size: cover; border: 3px solid var(--bg-color); 
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .sheet-name { font-size: 20px; font-weight: 800; color: white; margin-bottom: 5px; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .sheet-date { font-size: 13px; color: var(--secondary-text); }
        .sheet-options { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .sheet-btn { 
            width: 100%; padding: 16px; background: #2c2c2e; border: none; 
            display: flex; align-items: center; gap: 15px; border-radius: 14px; 
            color: #eee; font-size: 15px; font-weight: 700; cursor: pointer; 
            transition: 0.2s; font-family: "Cairo";
        }
        .sheet-btn:active { transform: scale(0.98); }
        .sheet-btn i { font-size: 18px; width: 25px; text-align: center; }
        .sheet-btn.gold { color: var(--gold-color); background: rgba(255, 180, 0, 0.1); }
        .sheet-btn.danger { color: #ff453a; background: rgba(255, 69, 58, 0.1); }

        /* === Bottom Nav === */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--card-color); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--border-color); z-index: 900; }
        .nav-item { font-size: 22px; color: var(--secondary-text); cursor: pointer; transition: 0.2s; }
        .nav-item.active { color: var(--primary-solid); transform: translateY(-2px); }
        .empty-state { text-align: center; padding: 50px 20px; color: var(--secondary-text); }
        
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #222; border: 1px solid #444; color: #fff; padding: 12px 25px; border-radius: 30px; font-size: 14px; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 10000; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        #toast.show { opacity: 1; bottom: 110px; }
    </style>
</head>
<body>

    <div id="pullIndicator">
        <i id="pullIcon" class="fa-solid fa-rotate-right"></i>
    </div>

           <div class="header">

            <div class="skeleton-item"><div class="sk-avatar"></div><div class="sk-lines"><div class="sk-line w-50"></div><div class="sk-line w-30"></div></div></div>

     <div class="bottom-nav">

        <div class="nav-item active"><i class="fa-solid fa-users"></i></div>
        <div class="nav-item" onclick="location.href='create_post.html'"><i class="fa-solid fa-plus-circle"></i></div>
        
        <div class="nav-item" onclick="location.href='friend_requests.html'" style="position: relative;">
            <i class="fa-solid fa-user-plus"></i>
            <div class="requests-badge" id="headerReqBadge" style="top: -5px; right: 2px;">0</div>
        </div>

        <div class="nav-item" onclick="location.href='profile.html'"><i class="fa-regular fa-user"></i></div>
    </div>


    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        // === Firebase Config ===
        const firebaseConfig = {
            apiKey: "AIzaSyDpvqNAReChsHn5tFJSp7vV_EJHmtD2x4c",
            authDomain: "pools-e4381.firebaseapp.com",
            projectId: "pools-e4381",
            storageBucket: "pools-e4381.appspot.com",
            messagingSenderId: "339799216046",
            appId: "1:339799216046:web:26e437a7b7d5c24fe9023f"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

// === استقبال الآي دي من الرابط ===
const urlParams = new URLSearchParams(window.location.search);
const targetUid = urlParams.get('uid'); // ده رقم الشخص اللي عايزين نشوف أصدقاؤه
let viewUid = null; // ده الرقم اللي هنحمل بناء عليه (يا إما أنا يا إما هو)


        // === Variables ===
        const defaultAvatar = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
        let currentUserUid = null;
        let friendsData = []; 
        let currentFilter = 'all'; 
        // متغيرات الحظر (لمنع ظهور المحظورين)
        let blockedUsersSet = new Set();
        let theyBlockedMeSet = new Set();

        // Sheet Vars
        let selectedFriendUid = null;
        let selectedFriendName = "";
        let isFavorite = false;
        let isVerified = false;
        let myActivityVisible = true; // الحالة الافتراضية

        // Pull to Refresh Vars
        let touchstartY = 0;
        const pullIndicator = document.getElementById('pullIndicator');
        const pullIcon = document.getElementById('pullIcon');

        function showToast(msg) { 
            const t = document.getElementById('toast'); 
            t.querySelector('span').innerText = msg; 
            t.classList.add('show'); 
            setTimeout(() => t.classList.remove('show'), 2000); 
        }
        auth.onAuthStateChanged(async user => {
    if (user) {
        currentUserUid = user.uid;
        viewUid = targetUid || currentUserUid; 

        // 🔥 جلب قائمة المحظورين أولاً قبل تحميل الأصدقاء
        await fetchBlockedUsersList();

        if (targetUid && targetUid !== currentUserUid) {
            db.collection('users').doc(targetUid).get().then(doc => {
                if(doc.exists) document.querySelector('.header h2').innerText = `أصدقاء ${doc.data().name}`;
            });
            document.querySelector('.filter-chips').style.display = 'none';
            document.getElementById('pullIndicator').style.display = 'none'; 
            loadFriends();
        } else {
            loadFromCache();
            loadFriends(); 
            startPresenceSystem();
            checkReqCount();
            startNotificationListener(); 
            setInterval(() => renderFriends(), 60000);
        }
    } else {
        location.href = "index.html";
    }
});

// 🔥 دالة جلب المحظورين
async function fetchBlockedUsersList() {
    if (!currentUserUid) return;
    blockedUsersSet.clear(); 
    theyBlockedMeSet.clear(); 
    try {
        const snapshot = await db.collection('chats').where('users', 'array-contains', currentUserUid).get();
        snapshot.forEach(doc => {
            const data = doc.data();
            if (data.blockedBy && data.blockedBy.length > 0) {
                const otherUid = data.users.find(u => u !== currentUserUid);
                if (otherUid) {
                    blockedUsersSet.add(otherUid); 
                    if (data.blockedBy.includes(otherUid)) {
                        theyBlockedMeSet.add(otherUid);
                    }
                }
            }
        });
    } catch (e) { console.error(e); }
}

        // === Caching System ===
        function loadFromCache() {
            const cachedData = localStorage.getItem('nabd_friends_cache');
            if (cachedData) {
                friendsData = JSON.parse(cachedData);
                renderFriends();
                document.getElementById('loadingSkeleton').style.display = 'none';
            }
        }

        function saveToCache(data) {
            localStorage.setItem('nabd_friends_cache', JSON.stringify(data));
        }

        // === Core Functions ===

        // تحميل الأصدقاء ومراقبة التغييرات
        function loadFriends() {
    // استخدمنا viewUid بدل currentUserUid
    db.collection("users").doc(viewUid).collection("friends")
        .onSnapshot(async (snapshot) => {
            document.getElementById('loadingSkeleton').style.display = 'none';
            
            if (snapshot.empty) {
                friendsData = [];
                renderFriends();
                return;
            }

            let tempFriends = [];
            
            const promises = snapshot.docs.map(async (doc) => {
                const fid = doc.id;
                
                // 🛑 جدار الحماية: لو الشخص ده بيني وبينه حظر، متجيبوش في القائمة نهائياً
                if (blockedUsersSet.has(fid) || theyBlockedMeSet.has(fid)) {
                    return null; 
                }

                const relData = doc.data();
                
                // جلب بيانات الصديق
                const userDoc = await db.collection("users").doc(fid).get();
                const uData = userDoc.data() || {};
                
                return {
                    uid: fid,
                    name: uData.name || "مستخدم",
                    pic: uData.profilePic || defaultAvatar,
                    since: relData.acceptedAt ? moment(relData.acceptedAt.toDate()).format('D MMM YYYY') : 'غير معروف',
                    isFav: relData.isFavorite || false, 
                    isVerified: uData.isVerified || false,
                    lastSeen: uData.lastSeen, 
                    isOnlineSettings: uData.showActivity !== false
                };
            });

            tempFriends = await Promise.all(promises);
            // فلترة أي قيمة null نتجت عن جدار الحماية
            friendsData = tempFriends.filter(f => f !== null); 

            // حفظ في الكاش "فقط" لو دي صفحتي أنا
            if (!targetUid) {
                saveToCache(friendsData);
            }

            renderFriends(); 
            
            // وقف أنيميشن السحب
            pullIndicator.classList.remove('visible');
            pullIcon.classList.remove('rotate');
        });
}


        // حساب حالة الأونلاين ووقت الظهور (نفس منطق الدردشة)
        function calculateStatus(friend) {
            // 1. حساب حالة الأونلاين
            let isOnline = false;
            let timeText = 'غير متصل';

            if (friend.lastSeen) {
                const now = Date.now();
                // تحويل Timestamp إلى Millis لو لزم الأمر
                const lastSeenMillis = (typeof friend.lastSeen.toMillis === 'function') 
                                        ? friend.lastSeen.toMillis() 
                                        : new Date(friend.lastSeen).getTime();

                const diff = now - lastSeenMillis;

                // يعتبر أونلاين لو الفرق أقل من 5 دقائق (300000 مللي ثانية)
                // ويشترط أن يكون هو مفعل الظهور (isOnlineSettings) وأنا مفعل الظهور (myActivityVisible)
                if (diff < 300000 && friend.isOnlineSettings && myActivityVisible) {
                    isOnline = true;
                    timeText = 'نشط الآن';
                } else {
                    // حساب الوقت المنقضي باستخدام دالة الدردشة
                    timeText = getShortLastSeen(lastSeenMillis);
                }
            }

            return { isOnline, timeText };
        }

        // دالة تنسيق الوقت المختصرة (من كود الدردشة)
        function getShortLastSeen(timestamp) {
            if (!timestamp) return '';
            const diff = Date.now() - timestamp;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (minutes < 1) return 'نشط الآن';
            if (minutes < 60) return `منذ ${minutes}د`; 
            if (hours < 24) return `منذ ${hours}س`;   
            if (days < 7) return `منذ ${days}ي`;      
            return moment(timestamp).format('D MMM');
        }

        // --- رسم القائمة ---
        function renderFriends() {
            const listContainer = document.getElementById('friendsListContainer');
            
            // تنظيف القائمة الحالية (مع الحفاظ على العنوان)
            const oldItems = listContainer.querySelectorAll('.friend-item, .empty-state');
            oldItems.forEach(el => el.remove());
            
            // حساب الأونلاين وتحديث البيانات لكل صديق قبل الفلترة
            friendsData.forEach(friend => {
                const status = calculateStatus(friend);
                friend.calculatedOnline = status.isOnline;
                friend.calculatedTimeText = status.timeText;
            });

            // الفلترة والترتيب
            let filtered = [...friendsData]; // نسخة جديدة

            // الترتيب: المفضلة أولاً
            filtered.sort((a, b) => (b.isFav === true) - (a.isFav === true));

            if (currentFilter === 'online') {
                filtered = filtered.filter(f => f.calculatedOnline);
            } else if (currentFilter === 'favorites') {
                filtered = filtered.filter(f => f.isFav);
            } else {
                // فلترة البحث
                const q = document.getElementById('searchInput').value.toLowerCase();
                if(q) filtered = filtered.filter(f => f.name.toLowerCase().includes(q));
            }

            // تحديث العدادات
            document.getElementById('countAll').innerText = friendsData.length;
            document.getElementById('countOnline').innerText = friendsData.filter(f => f.calculatedOnline).length;

            if(filtered.length === 0) {
                const msg = document.createElement('div');
                msg.className = 'empty-state';
                msg.innerHTML = `
                    <i class="fa-solid fa-user-group" style="font-size:50px; margin-bottom:15px; opacity:0.5;"></i>
                    <p>لا توجد نتائج.</p>`;
                listContainer.appendChild(msg);
                return;
            }

            filtered.forEach(friend => {
                const verifiedIcon = friend.isVerified ? '<i class="fa-solid fa-circle-check verified-badge"></i>' : '';
                
                const div = document.createElement('div');
                div.className = 'friend-item';
                div.onclick = () => openSheet(friend);
                
                div.innerHTML = `
                    <div class="friend-avatar" style="background-image:url('${friend.pic}')">
                        <div class="online-dot ${friend.calculatedOnline ? 'active' : ''}"></div>
                    </div>
                    <div class="friend-info">
                        <div class="friend-name-row">
                            <div class="friend-name">${friend.name}</div>
                            ${verifiedIcon}
                            <i class="fa-solid fa-star fav-star ${friend.isFav ? 'active' : ''}"></i>
                        </div>
                        <div class="friend-status ${friend.calculatedOnline ? 'online' : ''}">
                            ${friend.calculatedTimeText}
                        </div>
                    </div>
                    <div class="item-actions">
                        <div class="icon-btn chat-quick" onclick="event.stopPropagation(); quickChat('${friend.uid}', '${friend.name}')">
                            <i class="fa-brands fa-facebook-messenger"></i>
                        </div>
                        <div class="icon-btn" onclick="event.stopPropagation(); openSheet(thisFriendData('${friend.uid}'))">
                            <i class="fa-solid fa-ellipsis-vertical"></i>
                        </div>
                    </div>
                `;
                listContainer.appendChild(div);
            });
            
            document.getElementById('updateTime').innerText = moment().format('h:mm A');
        }

        // مساعد لتمرير البيانات للشيت بشكل صحيح
        function thisFriendData(uid) {
            return friendsData.find(f => f.uid === uid);
        }

        // --- Pull to Refresh ---
        window.addEventListener('touchstart', e => { touchstartY = e.touches[0].clientY; });
        window.addEventListener('touchmove', e => {
            const touchY = e.touches[0].clientY;
            const diff = touchY - touchstartY;
            if (window.scrollY === 0 && diff > 50) {
                pullIndicator.classList.add('visible');
            }
        });
        window.addEventListener('touchend', () => {
            if (pullIndicator.classList.contains('visible')) {
                pullIcon.classList.add('rotate');
                loadFriends(); 
            }
        });

        // --- Presence System (تحديث وجودي أنا) ---
        function startPresenceSystem() {
            if (!currentUserUid || !myActivityVisible) return;
            
            // تحديث فوري
            updateMyStatus();
            // تحديث دوري كل دقيقة
            setInterval(updateMyStatus, 60000);
            
            // عند مغادرة الصفحة
            window.addEventListener('beforeunload', () => {
                 db.collection('users').doc(currentUserUid).update({ lastSeen: firebase.firestore.FieldValue.serverTimestamp() });
            });
        }

        function updateMyStatus() {
             db.collection('users').doc(currentUserUid).update({
                online: true,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(e => console.log(e));
        }

        // --- UI Interactions ---
        window.setFilter = (type, el) => {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            currentFilter = type;
            renderFriends();
        };

        window.filterFriends = () => {
            renderFriends(); // الفلترة تحدث الآن داخل renderFriends
        };

        window.openSheet = (friend) => {
            if(!friend) return;
            selectedFriendUid = friend.uid;
            selectedFriendName = friend.name;
            isFavorite = friend.isFav;
            isVerified = friend.isVerified;

            const verifiedIcon = isVerified ? '<i class="fa-solid fa-circle-check verified-badge"></i>' : '';
            document.getElementById('sheetName').innerHTML = `${friend.name} ${verifiedIcon}`;
            document.getElementById('sheetDate').innerText = `صديق منذ ${friend.since}`;
            document.getElementById('sheetImg').style.backgroundImage = `url('${friend.pic}')`;
            
            updateFavBtnUI();
            document.getElementById('sheetOverlay').classList.add('active');
            document.getElementById('actionSheet').classList.add('active');
        };

        window.closeSheet = () => {
            document.getElementById('sheetOverlay').classList.remove('active');
            document.getElementById('actionSheet').classList.remove('active');
        };

        // --- إصلاح نظام المفضلة ---
        window.toggleFavorite = async () => {
            // 1. عكس الحالة الحالية
            const newStatus = !isFavorite;
            isFavorite = newStatus;
            
            // 2. تحديث الزر فوراً (Visual Feedback)
            updateFavBtnUI();
            
            // 3. تحديث البيانات المحلية فوراً وإعادة الرسم
            const fIndex = friendsData.findIndex(f => f.uid === selectedFriendUid);
            if(fIndex > -1) {
                friendsData[fIndex].isFav = newStatus;
                saveToCache(friendsData);
                renderFriends();
            }

            // 4. إرسال التحديث للسيرفر
            try {
                await db.collection('users').doc(currentUserUid).collection('friends').doc(selectedFriendUid).update({
                    isFavorite: newStatus
                });
                showToast(newStatus ? "تمت الإضافة للمفضلة" : "تمت الإزالة من المفضلة");
            } catch(e) { 
                console.error(e);
                showToast("حدث خطأ في الاتصال");
                // تراجع في حالة الخطأ
                isFavorite = !newStatus;
                updateFavBtnUI();
                if(fIndex > -1) {
                    friendsData[fIndex].isFav = !newStatus;
                    renderFriends();
                }
            }
        };

        function updateFavBtnUI() {
            const btn = document.getElementById('favBtn');
            const txt = document.getElementById('favText');
            if (isFavorite) {
                btn.style.background = "rgba(255, 180, 0, 0.2)";
                btn.style.color = "#ffb400";
                txt.innerText = "إزالة من المفضلة";
            } else {
                btn.style.background = "#2c2c2e";
                btn.style.color = "#eee";
                txt.innerText = "إضافة للمفضلة";
            }
        }

        window.quickChat = (uid, name) => {
            const cid = [currentUserUid, uid].sort().join("_");
            // التأكد من إنشاء وثيقة الشات إذا لم تكن موجودة
            db.collection("chats").doc(cid).set({ 
                users: [currentUserUid, uid],
                lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
            }, {merge:true});
            location.href = `chat.html?chatId=${cid}&name=${encodeURIComponent(name)}&uid=${uid}`;
        };
        
        window.goToChat = () => quickChat(selectedFriendUid, selectedFriendName);

        window.unfriendUser = async () => {
            if(!confirm("هل أنت متأكد من إلغاء الصداقة؟")) return;
            closeSheet();
            
            // تحديث محلي فوري
            friendsData = friendsData.filter(f => f.uid !== selectedFriendUid);
            saveToCache(friendsData);
            renderFriends();

            const batch = db.batch();
            batch.delete(db.collection("users").doc(currentUserUid).collection("friends").doc(selectedFriendUid));
            batch.delete(db.collection("users").doc(selectedFriendUid).collection("friends").doc(currentUserUid));
            await batch.commit();
            
            showToast("تم إلغاء الصداقة");
        };

        function checkReqCount() {
            db.collection('users').doc(currentUserUid).collection('friendRequests').onSnapshot(snap => {
                const b = document.getElementById('headerReqBadge');
                if(snap.size > 0) { b.style.display='inline-block'; b.innerText=snap.size; } 
                else b.style.display='none';
            });
        }
                // مراقبة الإشعارات وتشغيل العداد والصوت
        function startNotificationListener() {
            db.collection("notifications")
              .where("recipientId", "==", currentUserUid)
              .where("read", "==", false)
              .onSnapshot(snap => {
                    const count = snap.size;
                    const badge = document.getElementById('headerNotifBadge');
                    
                    if (badge) {
                        if (count > 0) {
                            badge.style.display = 'inline-block';
                            badge.innerText = count > 99 ? '99+' : count;
                            
                            // تشغيل التنبيه (صوت + توست) للإشعارات الجديدة فقط
                            snap.docChanges().forEach(change => {
                                if (change.type === "added") {
                                    // التأكد أن الإشعار جديد (أقل من 10 ثواني)
                                    const timeDiff = Date.now() - (change.doc.data().createdAt?.toDate().getTime() || Date.now());
                                    if (timeDiff < 10000) {
                                        document.getElementById('notificationSound').play().catch(e=>{});
                                        showToast("🔔 إشعار جديد");
                                        if(navigator.vibrate) navigator.vibrate(200);
                                    }
                                }
                            });
                        } else {
                            badge.style.display = 'none';
                        }
                    }
              });
        }

    </script>
<audio id="notificationSound" src="https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3" preload="auto"></audio>
<script src="theme-manager.js"></script>
