<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مسار الذاكرة - وريد</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050508;
            --primary-color: #00C6FF;  
            --danger-color: #ff3366;
            --success-color: #00e676;
            --text-color: #eee;
            --gold: #FFD700;
            --tile-bg: #16161e;
            --tile-border: #2a2a35;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Cairo", sans-serif; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
        body { background: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- الهيدر --- */
        .game-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; background: rgba(5, 5, 8, 0.95);
            border-bottom: 1px solid rgba(0, 198, 255, 0.1); z-index: 10;
        }
        .back-btn { font-size: 20px; color: var(--text-color); cursor: pointer; transition: 0.2s; }
        .back-btn:active { transform: scale(0.9); }
        .header-title { font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 0 10px var(--primary-color); }
        .wallet { color: var(--gold); font-weight: bold; font-size: 14px; background: rgba(255,215,0,0.1); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--gold); }

        /* --- لوحة النتائج --- */
        .scoreboard {
            display: flex; justify-content: space-between; padding: 15px 30px; background: #0a0a10;
            border-bottom: 1px solid #1a1a2e; z-index: 10;
        }
        .score-box { text-align: center; }
        .score-title { font-size: 12px; color: #aaa; font-weight: bold; }
        .score-value { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 0 10px rgba(0, 198, 255, 0.4); }
        .lives-value { font-size: 20px; font-weight: bold; color: var(--danger-color); letter-spacing: 2px; }

        /* --- منطقة اللعب --- */
        .game-area {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #111, #000); padding: 20px; position: relative;
        }
        
        .instructions {
            font-size: 18px; font-weight: bold; margin-bottom: 30px; color: var(--gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); min-height: 27px; text-align: center;
        }

        .grid-container {
            display: grid; gap: 10px; background: #0a0a10; padding: 15px; border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 198, 255, 0.05), inset 0 0 20px rgba(0,0,0,0.8);
            border: 2px solid #222; transition: 0.3s;
        }

        .tile {
            background: var(--tile-bg); border: 2px solid var(--tile-border); border-radius: 12px;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
        }

        /* حالات المربعات */
        .tile.highlight {
            background: var(--primary-color); border-color: #fff;
            box-shadow: 0 0 20px var(--primary-color), inset 0 0 10px #fff;
            transform: scale(1.05);
        }
        .tile.correct {
            background: var(--success-color); border-color: #fff;
            box-shadow: 0 0 20px var(--success-color);
        }
        .tile.wrong {
            background: var(--danger-color); border-color: #fff;
            box-shadow: 0 0 20px var(--danger-color);
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* --- المودال --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 2000;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-card {
            background: #111; border: 1px solid #333; border-radius: 20px;
            padding: 30px 20px; width: 90%; max-width: 350px; text-align: center;
            transform: translateY(20px); transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-title { font-size: 28px; font-weight: 900; margin-bottom: 5px; color: var(--danger-color); }
        .modal-reward { font-size: 18px; font-weight: bold; margin-bottom: 25px; color: var(--gold); }
        
        .btn-restart {
            background: linear-gradient(45deg, var(--primary-color), #0055ff);
            color: #fff; border: none; padding: 12px 30px; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer; width: 100%;
            box-shadow: 0 5px 15px rgba(0, 198, 255, 0.4);
        }
        .btn-restart:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="game-header">
        <i class="fa-solid fa-arrow-right back-btn" onclick="history.back()"></i>
        <div class="header-title">مسار الذاكرة 🧠</div>
        <div class="wallet"><i class="fa-solid fa-coins"></i> <span id="walletScore">1500</span></div>
    </div>

    <div class="scoreboard">
        <div class="score-box">
            <div class="score-title">المستوى</div>
            <div class="score-value" id="levelDisplay">1</div>
        </div>
        <div class="score-box">
            <div class="score-title">المحاولات</div>
            <div class="lives-value" id="livesDisplay">❤️❤️❤️</div>
        </div>
    </div>

    <div class="game-area">
        <div class="instructions" id="instructions">استعد...</div>
        <div class="grid-container" id="gridContainer">
            </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div id="modalIcon" style="font-size: 60px; margin-bottom: 10px;">🤯</div>
            <div class="modal-title">انتهت اللعبة!</div>
            <p style="color: #aaa; margin-bottom: 15px;">لقد وصلت إلى المستوى <span id="finalScore" style="color:#fff; font-weight:bold;">1</span></p>
            <div class="modal-reward" id="modalReward">+0 عملة</div>
            <button class="btn-restart" onclick="initGame()">تنشيط الذاكرة من جديد</button>
        </div>
    </div>

    <script>
        const gridContainer = document.getElementById('gridContainer');
        const levelDisplay = document.getElementById('levelDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const instructions = document.getElementById('instructions');
        const walletElement = document.getElementById('walletScore');

        let level = 1;
        let lives = 3;
        let gridSize = 3; // يبدأ 3x3
        let pathLength = 3;
        let path = [];
        let playerStep = 0;
        let isPlayerTurn = false;
        let isGameOver = false;

        const delay = ms => new Promise(res => setTimeout(res, ms));

        function initGame() {
            document.getElementById('resultModal').classList.remove('active');
            level = 1;
            lives = 3;
            gridSize = 3;
            pathLength = 3;
            isGameOver = false;
            
            updateUI();
            startLevel();
        }

        function updateUI() {
            levelDisplay.innerText = level;
            livesDisplay.innerText = "❤️".repeat(lives) + "🖤".repeat(3 - lives);
        }

        function createGrid() {
            gridContainer.innerHTML = '';
            gridContainer.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            
            // تحديد حجم المربع بناءً على حجم الشبكة ليتناسب مع الشاشة
            let tileSize = gridSize === 3 ? 80 : (gridSize === 4 ? 65 : 55);
            
            for (let i = 0; i < gridSize * gridSize; i++) {
                let tile = document.createElement('div');
                tile.className = 'tile';
                tile.id = `tile-${i}`;
                tile.style.width = `${tileSize}px`;
                tile.style.height = `${tileSize}px`;
                
                // إضافة دعم اللمس والماوس
                tile.addEventListener('mousedown', () => handleTileClick(i));
                tile.addEventListener('touchstart', (e) => { e.preventDefault(); handleTileClick(i); });
                
                gridContainer.appendChild(tile);
            }
        }

        function generatePath() {
            path = [];
            let totalTiles = gridSize * gridSize;
            let current = Math.floor(Math.random() * totalTiles);
            path.push(current);

            for (let i = 1; i < pathLength; i++) {
                let neighbors = getNeighbors(current);
                // فلترة المربعات اللي متزارتش قبل كده عشان المسار ميتقاطعش في نفس اللحظة
                let unvisited = neighbors.filter(n => !path.includes(n));
                
                if (unvisited.length === 0) {
                    // لو وصل لطريق مسدود، نعيد بناء المسار من الأول
                    return generatePath();
                }
                
                current = unvisited[Math.floor(Math.random() * unvisited.length)];
                path.push(current);
            }
        }

        function getNeighbors(index) {
            let neighbors = [];
            let row = Math.floor(index / gridSize);
            let col = index % gridSize;

            if (row > 0) neighbors.push(index - gridSize); // أعلى
            if (row < gridSize - 1) neighbors.push(index + gridSize); // أسفل
            if (col > 0) neighbors.push(index - 1); // يسار
            if (col < gridSize - 1) neighbors.push(index + 1); // يمين

            return neighbors;
        }

        async function startLevel() {
            isPlayerTurn = false;
            playerStep = 0;
            
            // زيادة صعوبة الشبكة كل 4 مستويات
            if (level === 5) gridSize = 4;
            if (level === 10) gridSize = 5;
            
            createGrid();
            generatePath();

            instructions.innerText = "راقب المسار جيداً...";
            instructions.style.color = "var(--primary-color)";
            
            await delay(1000);
            await showPath();
        }

        async function showPath() {
            isPlayerTurn = false;
            
            // إضاءة المسار خطوة بخطوة
            for (let i = 0; i < path.length; i++) {
                let tile = document.getElementById(`tile-${path[i]}`);
                tile.classList.add('highlight');
                // سرعة العرض تزيد مع المستويات
                let showTime = Math.max(300, 600 - (level * 20)); 
                await delay(showTime);
            }

            await delay(500);

            // إخفاء المسار بالكامل
            for (let i = 0; i < path.length; i++) {
                let tile = document.getElementById(`tile-${path[i]}`);
                tile.classList.remove('highlight');
            }

            instructions.innerText = "دورك! أعد تتبع المسار";
            instructions.style.color = "var(--success-color)";
            isPlayerTurn = true;
        }

        async function handleTileClick(index) {
            if (!isPlayerTurn || isGameOver) return;

            let tile = document.getElementById(`tile-${index}`);
            
            // لو ضغط على مربع اختاره قبل كده صح، يتجاهله
            if (tile.classList.contains('correct')) return;

            if (index === path[playerStep]) {
                // إجابة صحيحة
                tile.classList.add('correct');
                playerStep++;

                if (playerStep === path.length) {
                    // أنهى المستوى بنجاح
                    isPlayerTurn = false;
                    instructions.innerText = "ممتاز! استعد للتالي...";
                    instructions.style.color = "var(--gold)";
                    
                    level++;
                    // زيادة طول المسار كل مستويين
                    if (level % 2 === 0) pathLength++; 
                    
                    updateUI();
                    await delay(1500);
                    startLevel();
                }
            } else {
                // إجابة خاطئة
                isPlayerTurn = false;
                tile.classList.add('wrong');
                lives--;
                updateUI();
                
                instructions.innerText = "خطأ! ركز أكثر";
                instructions.style.color = "var(--danger-color)";

                if (lives <= 0) {
                    await delay(800);
                    gameOver();
                } else {
                    await delay(1000);
                    tile.classList.remove('wrong');
                    // تنظيف المربعات الصحيحة السابقة
                    document.querySelectorAll('.tile').forEach(t => t.classList.remove('correct'));
                    
                    instructions.innerText = "سنعيد عرض المسار...";
                    instructions.style.color = "var(--gold)";
                    await delay(1000);
                    playerStep = 0;
                    await showPath();
                }
            }
        }

        function gameOver() {
            isGameOver = true;
            let reward = (level - 1) * 10; // 10 عملات لكل مستوى مكتمل
            
            document.getElementById('finalScore').innerText = level;
            document.getElementById('modalReward').innerText = `+${reward} عملة ذهبية`;
            
            let currentWallet = parseInt(walletElement.innerText);
            walletElement.innerText = currentWallet + reward;

            document.getElementById('resultModal').classList.add('active');
        }

        window.onload = initGame;
    </script>
</body>
</html>
