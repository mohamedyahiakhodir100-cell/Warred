<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كاسحة الألغام - وريد</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0d0d0f;
            --primary-color: #00C6FF;  
            --danger-color: #ff3366;
            --success-color: #00e676;
            --text-color: #eee;
            --gold: #FFD700;
            --cell-bg: #1a1a1a;
            --cell-revealed: #050505;
            --border-color: #333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Cairo", sans-serif; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
        body { background: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- الهيدر --- */
        .game-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; background: rgba(13, 13, 15, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .back-btn { font-size: 20px; color: var(--text-color); cursor: pointer; transition: 0.2s; }
        .back-btn:active { transform: scale(0.9); }
        .header-title { font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 0 10px var(--danger-color); }
        .wallet { color: var(--gold); font-weight: bold; font-size: 14px; background: rgba(255,215,0,0.1); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--gold); }

        /* --- لوحة النتائج --- */
        .scoreboard {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; background: #111; border-bottom: 1px solid #222;
        }
        .score-box { text-align: center; }
        .score-title { font-size: 12px; color: #aaa; font-weight: bold; }
        .score-value { font-size: 22px; font-weight: 900; color: var(--danger-color); }
        .timer-value { font-size: 22px; font-weight: 900; color: var(--primary-color); }
        
        .face-btn {
            font-size: 30px; cursor: pointer; transition: 0.2s;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .face-btn:active { transform: scale(0.9); }

        /* --- منطقة اللعب --- */
        .game-area {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px; background: radial-gradient(circle at center, #111, #000);
        }
        
        .grid {
            display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px;
            background: var(--border-color); padding: 4px; border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.2); width: 100%; max-width: 360px; aspect-ratio: 1/1;
        }
        
        .cell {
            background: var(--cell-bg); display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 900; cursor: pointer; border-radius: 4px;
            box-shadow: inset 2px 2px 0px rgba(255,255,255,0.1), inset -2px -2px 0px rgba(0,0,0,0.5);
            transition: background 0.1s;
        }
        .cell.revealed {
            background: var(--cell-revealed); box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }
        .cell.exploded {
            background: var(--danger-color) !important; color: #fff; box-shadow: 0 0 15px var(--danger-color);
        }
        .cell.flagged { color: var(--gold); text-shadow: 0 0 10px var(--gold); }

        /* ألوان الأرقام */
        .val-1 { color: #00C6FF; text-shadow: 0 0 5px rgba(0, 198, 255, 0.5); }
        .val-2 { color: #00e676; text-shadow: 0 0 5px rgba(0, 230, 118, 0.5); }
        .val-3 { color: #ff3366; text-shadow: 0 0 5px rgba(255, 51, 102, 0.5); }
        .val-4 { color: #b000ff; }
        .val-5 { color: #ff8c00; }
        .val-6 { color: #00ffff; }
        .val-7 { color: #000000; }
        .val-8 { color: #555555; }

        /* --- أزرار التحكم (حفر / علم) --- */
        .controls {
            display: flex; gap: 15px; margin-top: 20px;
        }
        .mode-btn {
            background: #1a1a1a; border: 2px solid #333; padding: 10px 30px; border-radius: 15px;
            font-size: 16px; font-weight: bold; color: #aaa; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .mode-btn.active {
            background: rgba(0, 198, 255, 0.1); border-color: var(--primary-color);
            color: var(--primary-color); box-shadow: 0 0 15px rgba(0, 198, 255, 0.2);
        }
        .mode-btn.active-flag {
            background: rgba(255, 215, 0, 0.1); border-color: var(--gold);
            color: var(--gold); box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        /* --- المودال --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 2000;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-card {
            background: #111; border: 1px solid #333; border-radius: 20px;
            padding: 30px 20px; width: 90%; max-width: 350px; text-align: center;
            transform: translateY(20px); transition: 0.3s; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-title { font-size: 28px; font-weight: 900; margin-bottom: 5px; }
        .modal-reward { font-size: 18px; font-weight: bold; margin-bottom: 25px; color: var(--gold); }
        
        .btn-restart {
            background: linear-gradient(45deg, var(--primary-color), #0055ff);
            color: #fff; border: none; padding: 12px 30px; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer; width: 100%;
        }
        .btn-restart:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="game-header">
        <i class="fa-solid fa-arrow-right back-btn" onclick="history.back()"></i>
        <div class="header-title">كاسحة الألغام 💣</div>
        <div class="wallet"><i class="fa-solid fa-coins"></i> <span id="walletScore">1500</span></div>
    </div>

    <div class="scoreboard">
        <div class="score-box">
            <div class="score-title">الألغام المتبقية</div>
            <div class="score-value" id="minesDisplay">010</div>
        </div>
        <div class="face-btn" id="faceBtn" onclick="initGame()">🙂</div>
        <div class="score-box">
            <div class="score-title">الوقت</div>
            <div class="timer-value" id="timerDisplay">000</div>
        </div>
    </div>

    <div class="game-area">
        <div class="grid" id="grid">
            </div>

        <div class="controls">
            <div class="mode-btn active" id="modeDig" onclick="setMode('dig')"><i class="fa-solid fa-pickaxe"></i> حفر</div>
            <div class="mode-btn" id="modeFlag" onclick="setMode('flag')"><i class="fa-solid fa-flag"></i> علم</div>
        </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div id="modalIcon" style="font-size: 60px; margin-bottom: 10px;">🏆</div>
            <div class="modal-title" id="modalTitle">عمل رائع!</div>
            <p style="color: #aaa; margin-bottom: 10px;" id="modalDesc">تم تنظيف الحقل بنجاح</p>
            <div class="modal-reward" id="modalReward">+120 عملة</div>
            <button class="btn-restart" onclick="initGame()">العب من جديد</button>
        </div>
    </div>

    <script>
        const gridEl = document.getElementById('grid');
        const minesDisplay = document.getElementById('minesDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const faceBtn = document.getElementById('faceBtn');
        const walletElement = document.getElementById('walletScore');
        
        const modeDig = document.getElementById('modeDig');
        const modeFlag = document.getElementById('modeFlag');

        const ROWS = 9;
        const COLS = 9;
        const TOTAL_MINES = 10;

        let board = [];
        let minesLeft = TOTAL_MINES;
        let timer = 0;
        let timerInterval = null;
        let isGameOver = false;
        let firstClick = true;
        let currentMode = 'dig'; // 'dig' or 'flag'
        let revealedCells = 0;

        function setMode(mode) {
            currentMode = mode;
            modeDig.className = 'mode-btn';
            modeFlag.className = 'mode-btn';
            if(mode === 'dig') modeDig.classList.add('active');
            else modeFlag.classList.add('active-flag');
        }

        function initGame() {
            document.getElementById('resultModal').classList.remove('active');
            clearInterval(timerInterval);
            timerInterval = null;
            
            board = [];
            minesLeft = TOTAL_MINES;
            timer = 0;
            isGameOver = false;
            firstClick = true;
            revealedCells = 0;
            
            updateDisplay();
            faceBtn.innerText = '🙂';
            gridEl.innerHTML = '';

            // إنشاء المصفوفة والشاشة
            for (let r = 0; r < ROWS; r++) {
                board[r] = [];
                for (let c = 0; c < COLS; c++) {
                    board[r][c] = {
                        r, c,
                        isMine: false,
                        isRevealed: false,
                        isFlagged: false,
                        neighborMines: 0
                    };

                    const cellEl = document.createElement('div');
                    cellEl.className = 'cell';
                    cellEl.id = `cell-${r}-${c}`;
                    cellEl.onclick = () => handleCellClick(r, c);
                    gridEl.appendChild(cellEl);
                }
            }
        }

        function updateDisplay() {
            minesDisplay.innerText = minesLeft.toString().padStart(3, '0');
            timerDisplay.innerText = timer.toString().padStart(3, '0');
        }

        function startTimer() {
            if (!timerInterval) {
                timerInterval = setInterval(() => {
                    timer++;
                    if (timer > 999) timer = 999;
                    updateDisplay();
                }, 1000);
            }
        }

        // توزيع الألغام وتجنب مكان الضغطة الأولى
        function placeMines(firstR, firstC) {
            let placed = 0;
            while (placed < TOTAL_MINES) {
                let r = Math.floor(Math.random() * ROWS);
                let c = Math.floor(Math.random() * COLS);
                
                // لا تضع لغم في أول ضغطة أو مكان فيه لغم مسبقاً
                if (!board[r][c].isMine && (r !== firstR || c !== firstC)) {
                    // تجنب وضع لغم في المربعات المجاورة للضغطة الأولى (لضمان فتح مساحة)
                    if (Math.abs(r - firstR) <= 1 && Math.abs(c - firstC) <= 1) continue;
                    
                    board[r][c].isMine = true;
                    placed++;
                }
            }
            calculateNeighbors();
        }

        function calculateNeighbors() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c].isMine) continue;
                    let count = 0;
                    for (let i = -1; i <= 1; i++) {
                        for (let j = -1; j <= 1; j++) {
                            let nr = r + i, nc = c + j;
                            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                                if (board[nr][nc].isMine) count++;
                            }
                        }
                    }
                    board[r][c].neighborMines = count;
                }
            }
        }

        function handleCellClick(r, c) {
            if (isGameOver) return;
            let cell = board[r][c];

            if (currentMode === 'flag') {
                toggleFlag(cell);
                return;
            }

            // وضع الحفر
            if (cell.isRevealed || cell.isFlagged) return;

            if (firstClick) {
                firstClick = false;
                placeMines(r, c);
                startTimer();
            }

            if (cell.isMine) {
                explode(cell);
            } else {
                revealCell(cell);
                checkWin();
            }
        }

        function toggleFlag(cell) {
            if (cell.isRevealed) return;
            
            const cellEl = document.getElementById(`cell-${cell.r}-${cell.c}`);
            
            if (cell.isFlagged) {
                cell.isFlagged = false;
                cellEl.innerHTML = '';
                cellEl.classList.remove('flagged');
                minesLeft++;
            } else {
                if(minesLeft > 0) {
                    cell.isFlagged = true;
                    cellEl.innerHTML = '<i class="fa-solid fa-flag"></i>';
                    cellEl.classList.add('flagged');
                    minesLeft--;
                }
            }
            updateDisplay();
        }

        function revealCell(cell) {
            if (cell.isRevealed || cell.isFlagged) return;

            cell.isRevealed = true;
            revealedCells++;
            const cellEl = document.getElementById(`cell-${cell.r}-${cell.c}`);
            cellEl.classList.add('revealed');

            if (cell.neighborMines > 0) {
                cellEl.innerText = cell.neighborMines;
                cellEl.classList.add(`val-${cell.neighborMines}`);
            } else {
                // إذا كان المربع فارغ (صفر)، افتح كل المربعات اللي حواليه
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        let nr = cell.r + i, nc = cell.c + j;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                            revealCell(board[nr][nc]);
                        }
                    }
                }
            }
        }

        function explode(clickedCell) {
            isGameOver = true;
            clearInterval(timerInterval);
            faceBtn.innerText = '😵';

            // إظهار كل الألغام
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let cell = board[r][c];
                    const cellEl = document.getElementById(`cell-${r}-${c}`);
                    
                    if (cell.isMine) {
                        if (!cell.isFlagged) {
                            cellEl.innerHTML = '💣';
                            cellEl.classList.add('revealed');
                            if (r === clickedCell.r && c === clickedCell.c) {
                                cellEl.classList.add('exploded');
                            }
                        }
                    } else if (cell.isFlagged) {
                        // علم خاطئ
                        cellEl.innerHTML = '❌';
                        cellEl.style.color = 'var(--danger-color)';
                    }
                }
            }
            
            setTimeout(() => showModal(false), 1000);
        }

        function checkWin() {
            // اللاعب يكسب لو فتح كل المربعات اللي مش ألغام
            if (revealedCells === (ROWS * COLS) - TOTAL_MINES) {
                isGameOver = true;
                clearInterval(timerInterval);
                faceBtn.innerText = '😎';
                
                // تحويل كل الألغام لأعلام تلقائياً
                minesLeft = 0;
                updateDisplay();
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (board[r][c].isMine && !board[r][c].isFlagged) {
                            const cellEl = document.getElementById(`cell-${r}-${c}`);
                            cellEl.innerHTML = '<i class="fa-solid fa-flag"></i>';
                            cellEl.classList.add('flagged');
                        }
                    }
                }

                setTimeout(() => showModal(true), 1000);
            }
        }

        function showModal(isWin) {
            const modal = document.getElementById('resultModal');
            const icon = document.getElementById('modalIcon');
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDesc');
            const reward = document.getElementById('modalReward');

            if (isWin) {
                icon.innerText = "🏆";
                title.innerText = "عمل رائع!";
                title.style.color = "var(--primary-color)";
                desc.innerText = `حليت اللغز في ${timer} ثانية`;
                reward.innerText = "+120 عملة ذهبية";
                reward.style.display = "block";
                
                let currentWallet = parseInt(walletElement.innerText);
                walletElement.innerText = currentWallet + 120;
            } else {
                icon.innerText = "💥";
                title.innerText = "انفجار!";
                title.style.color = "var(--danger-color)";
                desc.innerText = "خطوة خاطئة، حاول مرة أخرى";
                reward.style.display = "none";
            }

            modal.classList.add('active');
        }

        // تشغيل اللعبة
        window.onload = initGame;
    </script>
</body>
</html>
