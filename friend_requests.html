        /* === إعدادات التصميم === */
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --bg-color: #0d0d0f;
            --card-color: #161616;
            --primary-solid: #5D5FEF;
            --primary-gradient: linear-gradient(135deg, #5D5FEF, #7879F1);
            --text-color: #eee;
            --secondary-text: #aaa;
            --border-color: #2a2a2a;
            --danger-color: #ff453a;
            --success-color: #4ade80;
            --btn-bg: #262626;
        }

        body { 
            background: var(--app-main-bg, var(--bg-color)); 
            color: var(--text-color); 
            margin: 0; 
            font-family: "Cairo", sans-serif; 
            padding-bottom: 90px; 
            overflow-x: hidden; 
            overscroll-behavior-y: contain; 
            transition: background-color 0.5s ease;
        }

        /* === مؤشر السحب للتحديث === */
        #pullIndicator {
            position: fixed; 
            top: -60px; left: 0; width: 100%; height: 60px;
            display: flex; align-items: center; justify-content: center;
            z-index: 99; transition: top 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #pullIndicator.visible { top: 70px; }
        #pullIcon {
            font-size: 24px; color: var(--primary-color, var(--primary-solid));
            background: rgba(255,255,255,0.1); width: 45px; height: 45px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); border: 1px solid var(--border-color);
        }
        #pullIcon.rotate { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

     /* ================= الهيدر العائم (ستايل الماسنجر) ================= */
.main-header {
    position: sticky;
    top: 8px;
    z-index: 1000;
    width: 94%;
    height: 55px;
    margin: 0 auto 15px auto;

}

.luxury-logo-container {

}

.gold-text {

    background-size: 200% auto;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.5));
}

.icon-btn {
    width: 40px; height: 40px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.3s;
    background: rgba(255, 255, 255, 0.05);

    border: 1px solid rgba(255, 255, 255, 0.1);

    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

.icon-btn:active, .icon-btn:hover {
    color: #fff; border-color: var(--primary-color);
    background: var(--primary-color);
    box-shadow: 0 0 15px var(--primary-color); transform: scale(0.95);
}

        .header h2 { margin: 0; font-size: 18px; flex: 1; text-align: center; font-weight: 700; }

        .user-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;

        /* === الأزرار الاحترافية === */
        .actions-row { display: flex; gap: 10px; width: 100%; }
        
        .btn {
            flex: 1; border: none; padding: 0; height: 42px; border-radius: 14px;
            font-family: "Cairo"; font-weight: 800; font-size: 14px;

            transition: 0.3s;

        /* زر التأكيد/الإضافة (مضيء) */
        .btn-confirm, .btn-add { 
            background: linear-gradient(135deg, var(--primary-color), var(--primary-solid)) !important; 
            color: #fff !important; 
            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.3); 
        }
        .btn-confirm:active, .btn-add:active { transform: scale(0.95); filter: brightness(1.2); }

        /* زر الحذف/التجاهل (زجاجي غامق) */
        .btn-delete { 
            background: rgba(255, 255, 255, 0.05) !important; 
            color: var(--text-color) !important; 
            border: 1px solid rgba(255, 255, 255, 0.1) !important;

            width: 100%;

        /* === Success & Skeleton === */
        .success-overlay {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            animation: fadeIn 0.4s ease; padding: 10px 0;

        .success-text span { color: var(--primary-color); }
        .success-sub { font-size: 12px; color: var(--secondary-text); margin-top: 4px; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .skeleton-card {
            background: var(--post-main-bg, var(--card-color)); border-radius: 20px; padding: 15px;
            border: 1px solid var(--post-border-color, var(--border-color)); margin-bottom: 12px;
        }
        .sk-head { display: flex; gap: 12px; align-items: center; margin-bottom: 15px; }
        .sk-avatar { width: 65px; height: 65px; border-radius: 50%; background: #222; animation: pulse 1.5s infinite; }
        .sk-info { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .sk-line { height: 10px; background: #222; border-radius: 6px; animation: pulse 1.5s infinite; }
        .sk-btns { display: flex; gap: 10px; }
        .sk-btn { height: 42px; flex: 1; background: #222; border-radius: 14px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* === Empty State === */
        .empty-state { 
            text-align: center; padding: 40px 20px; color: var(--secondary-text); 
            display: none; flex-direction: column; align-items: center;
        }
        .empty-state i { font-size: 50px; margin-bottom: 15px; opacity: 0.3; }

        /* === Toast === */
        #toast { 
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); 
            background: #222; border: 1px solid #333; color: #fff; 
            padding: 12px 24px; border-radius: 30px; font-size: 14px; opacity: 0; 
            transition: 0.3s; z-index: 10000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 8px; pointer-events: none;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@keyframes heartbeat {

@keyframes shineBadge {
    0% { left: -100%; }
    20% { left: 100%; } 
    100% { left: 100%; } 
}

        auth.onAuthStateChanged(async user => {
            if (user) { 
                currentUserUid = user.uid; 
                // 🛑 جلب قائمة المحظورين قبل أي شيء آخر
                await fetchBlockedUsersList();

                startNotificationListener();
                
                // 🔥 كود جلب صورة البروفايل ووضعها في الشريط السفلي 🔥
                db.collection('users').doc(user.uid).get().then(doc => {
                    if(doc.exists) {
                        const pic = doc.data().profilePic || doc.data().avatarUrl || defaultAvatar;
                        const bottomAvatar = document.getElementById('navProfileImg');

            } else { location.href = "index.html"; }
        });

        // 🔥 دالة جلب بيانات الحظر
                // 🔥 دالة جلب بيانات الحظر (والحسابات المحذوفة)
        async function fetchBlockedUsersList() {
            if (!currentUserUid) return;
            blockedUsersSet.clear(); 
            theyBlockedMeSet.clear(); 
            
            try {
                // 1. جلب المحظورين من الشات
                const snapshot = await db.collection('chats').where('users', 'array-contains', currentUserUid).get();
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.blockedBy && data.blockedBy.length > 0) {
                        const otherUid = data.users.find(u => u !== currentUserUid);
                        if (otherUid) {
                            blockedUsersSet.add(otherUid); 
                            if (data.blockedBy.includes(otherUid)) {
                                theyBlockedMeSet.add(otherUid);
                            }
                        }
                    }
                });

                // 🔥 2. الإضافة السحرية: فحص الحسابات المحذوفة (Soft Deleted)
                // لو ليك أي تعاملات معاهم في المستقبل، هنعتبرهم محظورين عشان يختفوا
                const usersSnap = await db.collection('users').where('accountStatus', '==', 'deleted').get();
                usersSnap.forEach(doc => {
                    blockedUsersSet.add(doc.id); // ضيفناهم للقائمة السوداء العامة
                });

            } catch (e) { console.error(e); }
        }

        async function initPage() {
            await fetchMyFriends();
            loadRequests(); 
            loadSuggestions(); 
        }

        async function fetchMyFriends() {
            try { 
                const snap = await db.collection("users").doc(currentUserUid).collection("friends").get(); 
                snap.forEach(doc => myFriendsSet.add(doc.id)); 
            } catch (e) {}
        }

        // ==========================================
        //  Smart Navigation
        // ==========================================
        function smartNavigate(url) {
            playClick();
            const isInIframe = window.self !== window.top;
            if (url === 'back' || url === 'home.html') {
                if (isInIframe && window.parent.closeUniversalPage) {
                    window.parent.closeUniversalPage();
                } else {
                    if(url === 'back') history.back(); else location.href = url;
                }
            } else { location.href = url; }
        }

        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        // ==========================================
        //  Pull to Refresh
        // ==========================================
        let pStart = {x:0, y:0};
        let isPulling = false;
        const pullIndicator = document.getElementById('pullIndicator');
        const pullIcon = document.getElementById('pullIcon');

        document.addEventListener('touchstart', e => { if(window.scrollY === 0) { pStart.y = e.touches[0].screenY; isPulling = true; } }, {passive: false});
        document.addEventListener('touchmove', e => { if(!isPulling) return; const currentY = e.touches[0].screenY; if(currentY > pStart.y && window.scrollY === 0) pullIndicator.classList.add('visible'); else pullIndicator.classList.remove('visible'); }, {passive: false});
        document.addEventListener('touchend', e => { if(!isPulling) return; if(pullIndicator.classList.contains('visible')) performRefresh(); isPulling = false; });

        function performRefresh() {
            pullIcon.classList.add('rotate'); playClick();
            if(navigator.vibrate) navigator.vibrate(50);
            
            // إعادة ضبط الليميت
            requestsLimit = 50; 
            
            setTimeout(() => { 
                document.getElementById('requestsContainer').innerHTML = '<div class="skeleton-card"><div class="sk-head"><div class="sk-avatar"></div><div class="sk-info"><div class="sk-line" style="width:50%"></div><div class="sk-line" style="width:30%"></div></div></div><div class="sk-btns"><div class="sk-btn"></div><div class="sk-btn"></div></div></div>';
                loadRequests(); 
                loadSuggestions(); 
                pullIcon.classList.remove('rotate'); pullIndicator.classList.remove('visible'); 
            }, 1000);
        }

        // ==========================================
        //  Loading Requests
        // ==========================================
                        // ==========================================
        //  دالة تحميل الطلبات (تم تعديلها لحل المشكلة)
        // ==========================================
        function loadRequests() {
            const container = document.getElementById('requestsContainer');
            const emptyMsg = document.getElementById('noRequestsMsg');
            const badge = document.getElementById('reqBadge'); 
            const bottomBadge = document.getElementById('bottomReqBadge'); 
            const loadMoreBtn = document.getElementById('loadMoreBtn');

            if(requestsUnsubscribe) requestsUnsubscribe();

            // 🔥 شيلنا الـ orderBy("createdAt", "desc") لأنها السبب في اختفاء الطلبات
            requestsUnsubscribe = db.collection("users").doc(currentUserUid).collection("friendRequests")
                .limit(requestsLimit) 
                .onSnapshot((snapshot) => {
                    
                    const skeletons = container.querySelectorAll('.skeleton-card');
                    skeletons.forEach(sk => sk.remove());

                    let validCount = 0;
                    snapshot.forEach(doc => {
                        // بنتأكد إننا مش عاملين بلوك لبعض وإني لسه مقبلتوش في الجلسة دي
                        if (!blockedUsersSet.has(doc.id) && !theyBlockedMeSet.has(doc.id) && !acceptedRequests.has(doc.id)) {
                            validCount++;
                        }
                    });

                    if (validCount > 0) {
                        if(badge) { badge.innerText = validCount; badge.classList.add('show'); }
                        if(bottomBadge) { bottomBadge.innerText = validCount; bottomBadge.style.display = 'flex'; }
                        if(emptyMsg) emptyMsg.style.display = 'none';
                        if(snapshot.size >= requestsLimit) { if(loadMoreBtn) loadMoreBtn.style.display = 'flex'; } 
                        else { if(loadMoreBtn) loadMoreBtn.style.display = 'none'; }
                    } else {
                        if(badge) badge.classList.remove('show');
                        if(bottomBadge) bottomBadge.style.display = 'none';
                        if(loadMoreBtn) loadMoreBtn.style.display = 'none';
                        if (container.querySelectorAll('.user-card').length === 0) {
                            if(emptyMsg) emptyMsg.style.display = 'flex';
                        }
                    }

                    snapshot.docChanges().forEach((change) => {
                        const reqId = change.doc.id;
                        
                        if (blockedUsersSet.has(reqId) || theyBlockedMeSet.has(reqId)) return; 

                        if (change.type === "added") {
                            if(document.getElementById(`req-${reqId}`)) return;
                            if(acceptedRequests.has(reqId)) return;
                            
                            const reqData = change.doc.data();
                            renderRequestCard(reqId, reqData); // هنرسم الكارت هنا
                        }

                        if (change.type === "removed") {
                            if (!acceptedRequests.has(reqId)) {
                                const card = document.getElementById(`req-${reqId}`);
                                if(card) {
                                    card.remove();
                                    if (container.querySelectorAll('.user-card').length === 0) {
                                        if(emptyMsg) emptyMsg.style.display = 'flex';
                                    }
                                }
                            }
                        }
                    });

                }, (error) => {
                    console.error("Firebase Error in loadRequests:", error);
                });
        }


        // ==========================================
        //  دالة قبول الصداقة المضمونة والمبسطة
        // ==========================================
        async function acceptFriend(uid, name) {
            playClick();
            const card = document.getElementById(`req-${uid}`);
            if(!card) return;

            acceptedRequests.add(uid);

            card.innerHTML = `
                <div class="success-overlay" style="padding: 20px 0;">
                    <i class="fa-solid fa-handshake" style="font-size: 35px; color: var(--success-color); margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(74, 222, 128, 0.4));"></i>
                    <div class="success-text" style="font-size: 16px;">${t('text_became_friends_with') || "أصبحت صديقاً لـ"} <span style="color:var(--primary-color);">${name}</span></div>
                </div>
            `;
            card.style.borderColor = "var(--success-color)";
            playSuccess();

            try {
                const batch = db.batch();
                const time = firebase.firestore.FieldValue.serverTimestamp();
                
                // 1. إضافة الصديق لبروفايلي
                batch.set(db.collection("users").doc(currentUserUid).collection("friends").doc(uid), { acceptedAt: time });
                
                // 2. إضافتي لبروفايل الصديق
                batch.set(db.collection("users").doc(uid).collection("friends").doc(currentUserUid), { acceptedAt: time });
                
                // 3. مسح الطلب المعلق
                batch.delete(db.collection("users").doc(currentUserUid).collection("friendRequests").doc(uid));

                // 4. إرسال إشعار للطرف التاني (بسيط جداً لتجنب أخطاء الحماية)
                const notifRef = db.collection('notifications').doc();
                batch.set(notifRef, {
                    recipientId: uid,
                    senderUid: currentUserUid,
                    senderName: document.getElementById('menuName') ? document.getElementById('menuName').innerText : "صديق جديد",
                    type: 'accept_request',
                    text: t('notif_accepted_request') || "وافق على طلب الصداقة",
                    read: false,
                    opened: false,
                    createdAt: time
                });

                await batch.commit();
                myFriendsSet.add(uid);

                setTimeout(() => {
                    if(card) {
                        card.style.opacity = '0';
                        setTimeout(() => card.remove(), 400);
                    }
                }, 2000);

            } catch (error) {
                console.error("Accept Friend Error:", error);
                showToast(t('toast_error_try_again') || "حدث خطأ، حاول مرة أخرى");
                acceptedRequests.delete(uid);
            }
        }


        function loadMoreRequests() {
            if (typeof playClick === 'function') playClick();
            const btn = document.getElementById('loadMoreBtn');
            
            if (btn) {
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${t('text_loading_spinner')}`;
            }
            
            requestsLimit += 50; // نزود الليميت
            
            setTimeout(() => {
                loadRequests(); // نطلب الداتا بالليميت الجديد
                if (btn) {
                    btn.innerHTML = `${t('btn_load_more_down')} <i class="fa-solid fa-chevron-down"></i>`;
                }
            }, 500);
        }


                async function renderRequestCard(uid, data) {
            const container = document.getElementById('requestsContainer');
            let userData = { name: t('text_default_user') || "مستخدم", profilePic: defaultAvatar, isVerified: false };
            
            try {
                const uDoc = await db.collection("users").doc(uid).get();
                // 🔥 حماية إضافية: لو الحساب مش موجود أو محذوف، ماترسمش الكارت
                if(!uDoc.exists || uDoc.data().accountStatus === 'deleted') return; 
                userData = uDoc.data();
            } catch(e){}

            const pic = userData.profilePic || userData.avatarUrl || defaultAvatar;
            const timeAgo = data.createdAt ? moment(data.createdAt.toDate()).fromNow() : '';

            const card = document.createElement('div');
            card.className = 'user-card';
            card.id = `req-${uid}`;
            card.innerHTML = `
                <div class="card-top">
                    <div class="user-avatar" onclick="smartNavigate('profile.html?uid=${uid}')" style="background-image:url('${pic}')"></div>
                    <div class="user-info">
                        <div class="user-name">${userData.name} ${userData.isVerified ? '<i class="fa-solid fa-heart-circle-check nabd-badge"></i>' : ''}</div>
                        <div class="user-bio" style="color: var(--secondary-text);"><i class="fa-solid fa-envelope-open-text"></i> ${t('text_wants_to_be_friend')}</div>
                        <span class="req-time"><i class="fa-regular fa-clock"></i> ${timeAgo}</span>
                    </div>
                </div>
                <div class="actions-row">
                    <button class="btn btn-confirm" onclick="acceptFriend('${uid}', '${userData.name.replace(/'/g, "\\'")}')">
                        <i class="fa-solid fa-user-check"></i> ${t('btn_confirm_request')}
                    </button>
                    <button class="btn btn-delete" onclick="deleteRequest('${uid}')">
                        ${t('btn_delete_request')}
                    </button>
                </div>
            `;
            container.appendChild(card);
        }


        
        async function deleteRequest(uid) {
            playClick();
            const card = document.getElementById(`req-${uid}`);
            if(card) {
                card.style.opacity = '0.5';
                card.style.pointerEvents = 'none';
            }
            try {
                await db.collection("users").doc(currentUserUid).collection("friendRequests").doc(uid).delete();
                showToast(t('toast_request_deleted'));
            } catch (e) { 
                showToast(t('toast_delete_failed')); 
                if(card) card.style.opacity = '1';
            }
        }

        // ==================================================
        // 🚀 نظام الاقتراحات اللانهائي الذكي
        // ==================================================
        let isFetchingSuggestions = false;
        window.currentUserLocation = ""; 
        let lastSuggestedDoc = null;
        let suggestionsObserver = null; 

        async function loadSuggestions() {
            if (isFetchingSuggestions) return;
            isFetchingSuggestions = true;

            const container = document.getElementById('suggestionsContainer');
            const sentinel = document.getElementById('suggestedScrollSentinel');
            
            container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--primary-color);"><i class="fa-solid fa-circle-notch fa-spin" style="font-size:24px;"></i><br><span style="font-size:12px; margin-top:10px; display:block;">${t('text_analyzing_suggestions')}</span></div>`;

            try {
                if (currentUserUid) {
                    const myDoc = await db.collection('users').doc(currentUserUid).get();
                    if (myDoc.exists) window.currentUserLocation = myDoc.data().location || "";
                }

                const snap = await db.collection('users')
                    .orderBy(firebase.firestore.FieldPath.documentId()) 
                    .limit(15)
                    .get();
                
                if (!snap.empty) {
                    lastSuggestedDoc = snap.docs[snap.docs.length - 1]; 
                }

                container.innerHTML = ""; 
                await processAndRenderUsers(snap.docs, container); 
                initSuggestionsObserver();

            } catch (e) { 
                console.error("Suggestions Error:", e); 
                container.innerHTML = `<div style="padding:20px;text-align:center;color:var(--danger-color)">${t('err_fetching_suggestions')}</div>`;
            } finally {
                isFetchingSuggestions = false;
            }
        }

        async function loadMoreSuggestionsAuto() {
            if (isFetchingSuggestions || !lastSuggestedDoc) return;
            isFetchingSuggestions = true;

            const container = document.getElementById('suggestionsContainer');
            const sentinel = document.getElementById('suggestedScrollSentinel');
            sentinel.style.display = 'block'; 

            try {
                const snap = await db.collection('users')
                    .orderBy(firebase.firestore.FieldPath.documentId())
                    .startAfter(lastSuggestedDoc)
                    .limit(15)
                    .get();

                if (snap.empty) {
                    lastSuggestedDoc = null; 
                    sentinel.innerHTML = `<div style="color:#777; font-size:12px; padding: 20px;">${t('text_end_of_list')}</div>`;
                    return;
                }

                lastSuggestedDoc = snap.docs[snap.docs.length - 1]; 
                await processAndRenderUsers(snap.docs, container); 

            } catch (e) {
                console.error("Error loading more:", e);
            } finally {
                sentinel.style.display = 'none'; 
                isFetchingSuggestions = false;
            }
        }

        function initSuggestionsObserver() {
            const sentinel = document.getElementById('suggestedScrollSentinel');
            if (!sentinel) return;
            if (suggestionsObserver) suggestionsObserver.disconnect(); 

            suggestionsObserver = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    loadMoreSuggestionsAuto();
                }
            }, { rootMargin: "150px" }); 

            suggestionsObserver.observe(sentinel);
        }

                async function processAndRenderUsers(docsArray, container) {
            let potentialUsers = [];
            
            let myFullLocation = window.currentUserLocation || "";
            let myBroadLocation = ""; 
            if (myFullLocation) {
                let parts = myFullLocation.split('،');
                myBroadLocation = parts[parts.length - 1].trim(); 
            }

            docsArray.forEach(doc => {
                const uid = doc.id;
                const userData = doc.data();

                // 🔥 الحماية هنا: استبعاد المحذوفين + المحظورين + الأصدقاء
                if (uid !== currentUserUid && 
                   userData.accountStatus !== 'deleted' && // 👈 ده الشرط الأهم
                   (!myFriendsSet || !myFriendsSet.has(uid)) &&
                   (!blockedUsersSet || !blockedUsersSet.has(uid)) &&
                   (!theyBlockedMeSet || !theyBlockedMeSet.has(uid))) {
                    
                    potentialUsers.push({ id: uid, ...userData });
                }
            });

            if (potentialUsers.length === 0) return; 

            // ... (باقي الكود الخاص بالدالة دي زي ما هو بدون تغيير)


            await Promise.all(potentialUsers.map(async (user) => {
                let score = 0;
                let mutualCount = 0;
                let targetLocation = user.location || "";
                
                const hasRealPic = user.profilePic && user.profilePic.trim() !== "" && 
                                   !user.profilePic.includes("149071.png") && !user.profilePic.includes("847969.png");
                if (hasRealPic) score += 200; 

                if (myFullLocation && targetLocation === myFullLocation) score += 10000; 
                else if (myBroadLocation && targetLocation.includes(myBroadLocation)) score += 5000;  

                try {
                    const targetFriendsSnap = await db.collection('users').doc(user.id).collection('friends').get();
                    const targetFriendsList = targetFriendsSnap.docs.map(d => d.id);
                    if (myFriendsSet && myFriendsSet.size > 0) {
                        const myFriendsArray = Array.from(myFriendsSet);
                        const mutuals = targetFriendsList.filter(id => myFriendsArray.includes(id));
                        mutualCount = mutuals.length;
                        score += (mutualCount * 500); 
                    }
                } catch(e) {}
                
                let followers = user.followersCount || (user.followers ? user.followers.length : 0);
                score += followers; 

                user.mutualCount = mutualCount;
                user.followersCount = followers;
                user.hasRealPic = hasRealPic;
                user.smartScore = score;
            }));

            potentialUsers.sort((a, b) => b.smartScore - a.smartScore);

            potentialUsers.forEach(u => {
                const pic = u.profilePic || u.avatarUrl || defaultAvatar;
                
                let hintText = "";
                let hintColor = "var(--secondary-text)";
                let hintIcon = "";

                if (myFullLocation && u.location === myFullLocation) {
                    hintText = t('text_near_you');
                    hintColor = "var(--success-color)";
                    hintIcon = '<i class="fa-solid fa-location-dot"></i> ';
                } else if (u.mutualCount > 0) {
                    hintText = `${u.mutualCount} ${t('text_mutual_friends')}`;
                    hintColor = "var(--primary-color)";
                    hintIcon = '<i class="fa-solid fa-user-group"></i> ';
                } else if (myBroadLocation && u.location && u.location.includes(myBroadLocation)) {
                    hintText = `${t('text_from_location')} ${myBroadLocation}`;
                    hintIcon = '<i class="fa-solid fa-map-pin"></i> ';
                } else if (u.followersCount > 10) {
                    hintText = `${t('text_followed_by')} ${u.followersCount} ${t('text_person')}`;
                    hintColor = "#FFD700"; 
                    hintIcon = '<i class="fa-solid fa-star"></i> ';
                } else {
                    hintText = u.bio || t('text_suggested_for_you');
                    hintIcon = '<i class="fa-solid fa-wand-magic-sparkles"></i> ';
                }

                const div = document.createElement('div');
                div.className = 'user-card';
                div.innerHTML = `
                    <div class="card-top">
                        <div class="user-avatar" onclick="smartNavigate('profile.html?uid=${u.id}')" style="background-image:url('${pic}')"></div>
                        <div class="user-info">
                            <div class="user-name">${u.name} ${u.isVerified ? '<i class="fa-solid fa-heart-circle-check nabd-badge"></i>' : ''}</div>
                            <div class="user-bio" style="color: ${hintColor}; font-weight: bold;">${hintIcon}${hintText}</div>
                        </div>
                    </div>
                    <div class="actions-row">
                        <button class="btn btn-add" id="btn-add-${u.id}" onclick="sendReq('${u.id}')">
                            <i class="fa-solid fa-user-plus"></i> ${t('btn_add_friend')}
                        </button>
                        <button class="btn btn-delete" onclick="this.closest('.user-card').remove()">
                            ${t('btn_ignore')}
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function sendReq(targetUid) {
            playClick();
            const btn = document.getElementById(`btn-add-${targetUid}`);
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${t('text_sending_spinner')}`;
            try {
                await db.collection("users").doc(targetUid).collection("friendRequests").doc(currentUserUid).set({
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    from: currentUserUid
                });
                
                btn.style.background = "#222";
                btn.style.color = "#aaa";
                btn.style.border = "none";
                btn.innerHTML = `<i class="fa-solid fa-check"></i> ${t('btn_sent')}`;
                btn.onclick = null;
                showToast(t('toast_request_sent'));
            } catch (e) {
                btn.innerHTML = t('btn_add_friend');
                showToast(t('toast_error_occurred'));
            }
        }

        function startNotificationListener() {
            db.collection("notifications").where("recipientId", "==", currentUserUid).where("read", "==", false).onSnapshot(snap => {
                const count = snap.size;
                const badge = document.getElementById('headerNotifBadge');
                if (badge) {
                    if (count > 0) {
                        badge.style.display = 'flex'; badge.innerText = count > 99 ? '99+' : count;
                        snap.docChanges().forEach(change => {
                            if (change.type === "added") {
                                const timeDiff = Date.now() - (change.doc.data().createdAt?.toDate().getTime() || Date.now());
                                if (timeDiff < 10000) {
                                    document.getElementById('notificationSound').play().catch(e=>{});
                                    showToast(t('toast_new_notification_bell'));
                                    if(navigator.vibrate) navigator.vibrate(200);
                                }
                            }
                        });
                    } else { badge.style.display = 'none'; }
                }
            });
        }

        function playClick() { document.getElementById('clickSound').play().catch(()=>{}); }
        function playSuccess() { document.getElementById('successSound').play().catch(()=>{}); }
        function showToast(msg) { 
            const tEl = document.getElementById('toast'); 
            const span = document.getElementById('toastMsg');
            if (span) span.innerText = msg; 
            tEl.classList.add('show'); 
            setTimeout(() => tEl.classList.remove('show'), 3000); 
        }
    </script>
